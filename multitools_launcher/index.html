<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Tools · PortiCAD</title>
<meta name="description" content="Todas las herramientas de PortiCAD en un solo lugar: toca una y se abre.">
<meta name="theme-color" content="#0d1117">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --line: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }

  .top {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13,17,23,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .top-in {
    max-width: 1200px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .brand img { height: 36px; width: auto; border-radius: 6px; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  .brand span { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
  .home-link {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px;
    font-size: 14px; font-weight: 600; color: var(--accent); background: var(--panel);
  }
  .home-link:hover { border-color: var(--accent); }

  .search { flex: 1 1 280px; max-width: 420px; position: relative; }
  .search input {
    width: 100%; height: 44px; padding: 0 14px 0 42px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 15px;
  }
  .search input::placeholder { color: var(--muted); }
  .search svg { position: absolute; left: 13px; top: 12px; }

  main { max-width: 1200px; margin: 0 auto; padding: 22px 20px 56px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .chip {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px;
    min-height: 40px;
  }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0d1117; }

  section { margin-bottom: 38px; }
  .cat-head { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .cat-head svg { flex-shrink: 0; }
  .cat-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .cat-head small { color: var(--muted); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .tool {
    display: flex; align-items: center; gap: 16px;
    min-height: 104px; padding: 18px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 5px solid var(--c);
    border-radius: 14px;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .tool:hover { background: var(--panel-2); border-color: var(--c); transform: translateY(-2px); }
  .tool:active { transform: translateY(0); }
  .tile {
    flex: 0 0 54px; height: 54px; border-radius: 14px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 16%, transparent);
  }
  .tool b { display: block; font-size: 17px; line-height: 1.25; }
  .tool span {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-top: 4px; font-size: 13px; color: var(--muted);
  }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 16px; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  noscript p { text-align: center; color: var(--muted); padding: 60px 20px; }

  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
  footer a { color: var(--accent); }

  @media (max-width: 560px) {
    .top-in { padding: 12px 14px; }
    .brand h1 { font-size: 18px; }
    .search { order: 3; max-width: none; flex-basis: 100%; }
    main { padding: 18px 14px 48px; }
    .grid { grid-template-columns: 1fr; }
    .tool { min-height: 96px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tool { transition: none; }
    .tool:hover { transform: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <img src="/favicon.svg" alt="">
      <h1>Multi-Tools<span>Herramientas de PortiCAD</span></h1>
    </div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="q" type="search" placeholder="Buscar herramienta" autocomplete="off" aria-label="Buscar herramienta">
    </label>
    <a class="home-link" href="https://porticad.app">Ir a PortiCAD</a>
  </div>
</header>

<main>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
  <div id="list" aria-live="polite"></div>
  <noscript><p>Activa JavaScript para ver las herramientas, o entra directo a <a href="https://porticad.app" style="color:#58a6ff">porticad.app</a>.</p></noscript>
</main>

<footer>Cada botón abre la herramienta en <a href="https://porticad.app">porticad.app</a>.</footer>

<script>
(function () {
  var data = [], active = 'all', query = '';
  var $list = document.getElementById('list');
  var $chips = document.getElementById('chips');
  var $q = document.getElementById('q');

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function svg(icon, color, size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + icon + '</svg>';
  }

  function renderChips() {
    var items = [{ id: 'all', name: 'Todas' }].concat(data);
    $chips.innerHTML = items.map(function (c) {
      return '<button type="button" class="chip" data-id="' + esc(c.id) + '" aria-pressed="' + (c.id === active) + '">' + esc(c.name) + '</button>';
    }).join('');
  }

  function renderList() {
    var q = norm(query.trim());
    var html = '';
    data.forEach(function (c) {
      if (active !== 'all' && active !== c.id) return;
      var tools = c.tools.filter(function (t) {
        return !q || norm(t.name + ' ' + t.desc + ' ' + c.name).indexOf(q) > -1;
      });
      if (!tools.length) return;
      html += '<section><div class="cat-head">' + svg(c.icon, c.color, 22) +
        '<h2>' + esc(c.name) + '</h2><small>' + tools.length + (tools.length === 1 ? ' herramienta' : ' herramientas') + '</small></div><div class="grid">' +
        tools.map(function (t) {
          return '<a class="tool" href="' + esc(t.href) + '" style="--c:' + esc(t.color) + '">' +
            '<div class="tile">' + svg(t.icon, t.color, 28) + '</div>' +
            '<div><b>' + esc(t.name) + '</b><span>' + esc(t.desc) + '</span></div></a>';
        }).join('') + '</div></section>';
    });
    $list.innerHTML = html || '<div class="empty"><b>No hay herramientas con ese nombre</b>Prueba con otra palabra o elige la categoría Todas.</div>';
  }

  $chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    active = b.getAttribute('data-id');
    renderChips(); renderList();
  });
  $q.addEventListener('input', function () { query = $q.value; renderList(); });

  fetch('tools.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { data = d; renderChips(); renderList(); })
    .catch(function () {
      $list.innerHTML = '<div class="empty"><b>No se pudo cargar la lista</b>Recarga la página o entra directo a <a href="https://porticad.app" style="color:#58a6ff">porticad.app</a>.</div>';
    });
})();
</script>
</body>
</html>
