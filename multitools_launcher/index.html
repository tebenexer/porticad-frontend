<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Tools · PortiCAD</title>
<meta name="description" content="Todas las herramientas de PortiCAD en un solo lugar: elige una categoría y toca la herramienta.">
<meta name="theme-color" content="#0d1117" id="meta-theme">
<script>
  try { var t = localStorage.getItem('mt-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --line: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --overlay: rgba(1,4,9,.68);
    --tip-bg: #010409;
    --shadow: rgba(0,0,0,.6);
    --ico-mix: 0%;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-2: #f1f5f9;
    --line: #d0d7de;
    --text: #1f2328;
    --muted: #596270;
    --accent: #0969da;
    --overlay: rgba(31,41,55,.45);
    --tip-bg: #1f2328;
    --shadow: rgba(31,41,55,.28);
    --ico-mix: 32%;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
    min-height: 100vh;
  }
  body.locked { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 16px; }

  .top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .top-in {
    max-width: 1200px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .brand img { height: 36px; width: auto; border-radius: 6px; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  .brand span { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
  .home-link {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px;
    font-size: 14px; font-weight: 600; color: var(--accent); background: var(--panel);
  }
  .home-link:hover { border-color: var(--accent); }

  .theme {
    position: relative; flex-shrink: 0; cursor: pointer;
    width: 68px; height: 36px; padding: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 9px;
  }
  .theme:hover { border-color: var(--muted); }
  .theme svg { position: relative; z-index: 1; color: var(--muted); transition: color .2s; }
  .theme::before {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent);
    transition: transform .2s;
  }
  :root:not([data-theme="light"]) .theme::before { transform: translateX(32px); }
  :root:not([data-theme="light"]) .theme .moon { color: #0d1117; }
  :root[data-theme="light"] .theme .sun { color: #fff; }
  .theme:focus-visible { border-radius: 999px; }
  .search { flex: 1 1 280px; max-width: 420px; position: relative; }
  .search input {
    width: 100%; height: 44px; padding: 0 14px 0 42px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 15px;
  }
  .search input::placeholder { color: var(--muted); }
  .search svg { position: absolute; left: 13px; top: 12px; color: var(--muted); }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 56px; }

  /* ── Botones cuadrados (categorías y herramientas) ── */
  .cats, .tools {
    display: grid;
    gap: 14px;
  }
  .cats  { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
  .tools { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }

  .sq {
    width: 100%; aspect-ratio: 1 / 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 14px; text-align: center; cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: 5px solid var(--c);
    border-radius: 22px;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .sq:hover { background: var(--panel-2); border-color: var(--c); transform: translateY(-2px); }
  .sq:active { transform: translateY(0); }
  .ico {
    width: 60px; height: 60px; border-radius: 18px;
    display: grid; place-items: center; flex-shrink: 0;
    background: color-mix(in srgb, var(--c) 16%, transparent);
    color: color-mix(in srgb, var(--c), #000 var(--ico-mix));
  }
  .sq-name {
    font-size: 16px; font-weight: 700; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sq-count { font-size: 13px; color: var(--muted); }

  /* Botones de herramienta: algo más compactos, sobre el fondo de la capa */
  .tools .sq { background: var(--bg); padding: 12px; gap: 9px; }
  .tools .sq:hover { background: var(--panel-2); }
  .tools .ico { width: 54px; height: 54px; border-radius: 16px; }
  .tools .sq-name { font-size: 14px; font-weight: 600; }

  /* ── Capa por delante ── */
  .layer {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
    background: var(--overlay);
    backdrop-filter: blur(4px);
  }
  .layer.show { display: flex; animation: fade .18s ease-out; }
  .sheet {
    width: min(880px, 100%); max-height: min(86vh, 760px);
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--c);
    border-bottom: 5px solid var(--c);
    border-radius: 26px;
    box-shadow: 0 24px 80px var(--shadow);
    animation: pop .2s ease-out;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .sheet-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px 14px; flex-shrink: 0; }
  .sheet-head .ico { width: 48px; height: 48px; border-radius: 14px; }
  .sheet-head h2 { margin: 0; font-size: 20px; line-height: 1.2; }
  .sheet-head small { display: block; color: var(--muted); font-size: 13px; }
  .close {
    margin-left: auto; cursor: pointer; flex-shrink: 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 16px; font-size: 14px; font-weight: 600; min-height: 44px;
  }
  .close:hover { border-color: var(--muted); }
  .sheet-body { overflow-y: auto; padding: 4px 20px 22px; overscroll-behavior: contain; }

  /* ── Tooltip con la descripción ── */
  .tip {
    position: fixed; z-index: 200; pointer-events: none;
    max-width: 280px; padding: 10px 12px;
    background: var(--tip-bg); color: #e6edf3;
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 28px var(--shadow);
    font-size: 13px; line-height: 1.4;
    opacity: 0; transition: opacity .1s;
  }
  .tip.show { opacity: 1; }
  .tip b { display: block; font-size: 14px; margin-bottom: 2px; }
  .tip span { color: #adb6c0; }

  /* ── Búsqueda ── */
  .results-title { margin: 0 0 14px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 16px; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  noscript p { text-align: center; color: var(--muted); padding: 60px 20px; }

  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
  footer a { color: var(--accent); }

  @media (max-width: 560px) {
    .top-in { padding: 12px 14px; gap: 10px; }
    .brand { gap: 10px; }
    .brand img { height: 30px; }
    .brand h1 { font-size: 18px; }
    .brand span { display: none; }
    .home-link { padding: 9px 12px; font-size: 13px; }
    .theme { width: 60px; height: 34px; padding: 0 8px; }
    .theme::before { width: 26px; height: 26px; }
    :root:not([data-theme="light"]) .theme::before { transform: translateX(26px); }
    .search { order: 3; max-width: none; flex-basis: 100%; }
    main { padding: 18px 14px 48px; }
    .cats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .tools { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .ico { width: 54px; height: 54px; }
    .sq-name { font-size: 15px; }
    .tools .sq-name { font-size: 13px; }
    .layer { padding: 12px; align-items: flex-end; }
    .sheet { max-height: 88vh; border-radius: 24px; }
    .sheet-head { padding: 16px 14px 12px; }
    .sheet-body { padding: 2px 14px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sq { transition: none; }
    .sq:hover { transform: none; }
    .layer.show, .sheet { animation: none; }
    .tip { transition: none; }
    .theme::before, .theme svg { transition: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <img src="/favicon.svg" alt="">
      <h1>Multi-Tools<span>Herramientas de PortiCAD</span></h1>
    </div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="q" type="search" placeholder="Buscar herramienta" autocomplete="off" aria-label="Buscar herramienta">
    </label>
    <button type="button" class="theme" id="theme" role="switch" aria-checked="true" aria-label="Tema oscuro" title="Cambiar entre tema claro y oscuro">
      <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <a class="home-link" href="https://porticad.app">Ir a PortiCAD</a>
  </div>
</header>

<main>
  <div id="list" aria-live="polite"></div>
  <noscript><p>Activa JavaScript para ver las herramientas, o entra directo a <a href="https://porticad.app" style="color:var(--accent)">porticad.app</a>.</p></noscript>
</main>

<footer>Cada botón abre la herramienta en <a href="https://porticad.app">porticad.app</a>.</footer>

<div class="layer" id="layer" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
(function () {
  var data = [], query = '', lastBtn = null, openCat = null;
  var $list = document.getElementById('list');
  var $q = document.getElementById('q');
  var $layer = document.getElementById('layer');
  var $sheet = document.getElementById('sheet');
  var $tip = document.getElementById('tip');

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function svg(icon, color, size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + icon + '</svg>';
  }
  function plural(n) { return n + (n === 1 ? ' herramienta' : ' herramientas'); }

  function toolHtml(t) {
    return '<a class="sq" href="' + esc(t.href) + '" style="--c:' + esc(t.color) + '" data-name="' + esc(t.name) + '" data-desc="' + esc(t.desc) + '">' +
      '<span class="ico">' + svg(t.icon, t.color, 28) + '</span>' +
      '<span class="sq-name">' + esc(t.name) + '</span></a>';
  }
  function catHtml(c) {
    return '<button type="button" class="sq" style="--c:' + esc(c.color) + '" data-open="' + esc(c.id) + '" aria-haspopup="dialog">' +
      '<span class="ico">' + svg(c.icon, c.color, 30) + '</span>' +
      '<span class="sq-name">' + esc(c.name) + '</span>' +
      '<span class="sq-count">' + plural(c.tools.length) + '</span></button>';
  }

  function render() {
    var q = norm(query.trim());
    if (!q) { $list.innerHTML = '<div class="cats">' + data.map(catHtml).join('') + '</div>'; return; }
    var found = [];
    data.forEach(function (c) {
      c.tools.forEach(function (t) {
        if (norm(t.name + ' ' + t.desc + ' ' + c.name).indexOf(q) > -1) found.push(t);
      });
    });
    $list.innerHTML = found.length
      ? '<h2 class="results-title">' + plural(found.length) + ' encontradas</h2><div class="tools">' + found.map(toolHtml).join('') + '</div>'
      : '<div class="empty"><b>No hay herramientas con ese nombre</b>Prueba con otra palabra o borra la búsqueda para ver las categorías.</div>';
  }

  /* ── Capa ── */
  function openLayer(id, btn) {
    var c = data.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    openCat = id; lastBtn = btn;
    $sheet.style.setProperty('--c', c.color);
    $sheet.innerHTML =
      '<div class="sheet-head" style="--c:' + esc(c.color) + '"><span class="ico">' + svg(c.icon, c.color, 26) + '</span>' +
        '<div><h2 id="sheet-title">' + esc(c.name) + '</h2><small>' + plural(c.tools.length) + '</small></div>' +
        '<button type="button" class="close" data-close="1">Cerrar</button></div>' +
      '<div class="sheet-body"><div class="tools">' + c.tools.map(toolHtml).join('') + '</div></div>';
    $layer.classList.add('show');
    $layer.setAttribute('aria-hidden', 'false');
    document.body.classList.add('locked');
    var first = $sheet.querySelector('a.sq'); if (first) first.focus({ preventScroll: true });
  }
  function closeLayer() {
    if (!openCat) return;
    hideTip();
    openCat = null;
    $layer.classList.remove('show');
    $layer.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('locked');
    if (lastBtn && document.body.contains(lastBtn)) lastBtn.focus({ preventScroll: true });
  }

  $list.addEventListener('click', function (e) {
    var o = e.target.closest('[data-open]');
    if (o) openLayer(o.getAttribute('data-open'), o);
  });
  $layer.addEventListener('click', function (e) {
    if (e.target === $layer || e.target.closest('[data-close]')) closeLayer();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLayer();
    if (e.key === 'Tab' && openCat) {            /* el foco no sale de la capa */
      var f = $sheet.querySelectorAll('a[href], button');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  $q.addEventListener('input', function () { query = $q.value; render(); });

  /* ── Tooltip: descripción al pasar el puntero o enfocar ── */
  function showTip(el) {
    var d = el.getAttribute('data-desc');
    if (!d) return;
    $tip.innerHTML = '<b>' + esc(el.getAttribute('data-name')) + '</b><span>' + esc(d) + '</span>';
    var r = el.getBoundingClientRect();
    $tip.classList.add('show');
    var w = $tip.offsetWidth, h = $tip.offsetHeight, gap = 10;
    var x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
    var y = r.top - h - gap;
    if (y < 8) y = r.bottom + gap;
    $tip.style.left = x + 'px';
    $tip.style.top = y + 'px';
  }
  function hideTip() { $tip.classList.remove('show'); }
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest('[data-desc]');
    if (el) showTip(el); else hideTip();
  });
  document.addEventListener('focusin', function (e) {
    var el = e.target.closest && e.target.closest('[data-desc]');
    if (el) showTip(el); else hideTip();
  });
  document.addEventListener('focusout', hideTip);
  document.addEventListener('scroll', hideTip, true);
  document.addEventListener('mouseleave', hideTip);

  /* ── Tema claro / oscuro ── */
  var $theme = document.getElementById('theme');
  var $meta = document.getElementById('meta-theme');
  function isLight() { return document.documentElement.getAttribute('data-theme') === 'light'; }
  function syncTheme() {
    var light = isLight();
    $theme.setAttribute('aria-checked', String(!light));
    $theme.setAttribute('aria-label', light ? 'Tema claro' : 'Tema oscuro');
    if ($meta) $meta.setAttribute('content', light ? '#eef1f5' : '#0d1117');
  }
  $theme.addEventListener('click', function () {
    var next = isLight() ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('mt-theme', next); } catch (e) {}
    syncTheme(); hideTip();
  });
  syncTheme();

  fetch('tools.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { data = d; render(); })
    .catch(function () {
      $list.innerHTML = '<div class="empty"><b>No se pudo cargar la lista</b>Recarga la página o entra directo a <a href="https://porticad.app" style="color:var(--accent)">porticad.app</a>.</div>';
    });
})();
</script>
</body>
</html>
