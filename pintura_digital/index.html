<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Pintura Digital — PortiCAD Multi-Tools</title>
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="shortcut icon" href="/favicon.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── Top bar ── */
  .topbar {
    background: #161b22; border-bottom: 1px solid #30363d; height: 50px;
    display: flex; align-items: center; padding: 0 16px; gap: 8px;
    flex-shrink: 0; z-index: 300; position: relative;
  }
  .topbar-logo { font-size: 16px; font-weight: 700; color: #58a6ff; text-decoration: none; }
  .topbar-sep  { color: #30363d; font-size: 18px; }
  .topbar-crumb { font-size: 14px; color: #8b949e; display: flex; align-items: center; gap: 6px; }
  .topbar-title { font-size: 15px; font-weight: 600; color: #e6edf3; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 20px; margin-left: 6px; }
  .topbar-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .doc-name { color: #8b949e; font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Menu bar ── */
  .menubar {
    background: #161b22; border-bottom: 1px solid #30363d; height: 34px;
    display: flex; align-items: center; padding: 0 8px; gap: 2px;
    flex-shrink: 0; position: relative; z-index: 250;
  }
  .menu-item { position: relative; }
  .menu-btn {
    background: none; border: none; color: #c9d1d9; font-size: 13px;
    padding: 6px 12px; border-radius: 4px; cursor: pointer;
  }
  .menu-btn:hover, .menu-btn.open { background: #21262d; color: #e6edf3; }
  .menu-dropdown {
    position: absolute; top: 100%; left: 0; margin-top: 2px;
    background: #161b22; border: 1px solid #30363d; border-radius: 6px;
    min-width: 240px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    display: none; flex-direction: column; padding: 4px; z-index: 260;
  }
  .menu-dropdown.show { display: flex; }
  .menu-dropdown button {
    background: none; border: none; color: #e6edf3; text-align: left;
    padding: 7px 10px; border-radius: 4px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .menu-dropdown button:hover { background: #1f6feb22; }
  .menu-dropdown .key { color: #8b949e; font-size: 11px; }
  .menu-dropdown hr { border: none; border-top: 1px solid #21262d; margin: 4px 2px; }
  .menubar-sep { width: 1px; height: 20px; background: #30363d; margin: 0 4px; }
  .menubar-btn {
    background: none; border: none; color: #c9d1d9; padding: 6px 8px; border-radius: 4px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .menubar-btn:hover:not(:disabled) { background: #21262d; color: #e6edf3; }
  .menubar-btn:disabled { color: #484f58; cursor: default; }
  .menubar-btn.on { color: #58a6ff; background: #1f6feb22; }

  /* ── Tool options bar ── */
  .optbar {
    background: #11161d; border-bottom: 1px solid #30363d; min-height: 40px;
    display: flex; align-items: center; gap: 14px; padding: 4px 12px;
    flex-shrink: 0; overflow-x: auto; overflow-y: hidden; white-space: nowrap;
  }
  .optbar::-webkit-scrollbar { height: 4px; }
  .optbar::-webkit-scrollbar-thumb { background: #30363d; }
  .opt { display: flex; align-items: center; gap: 6px; color: #8b949e; font-size: 12px; }
  .opt input[type=range] { width: 110px; accent-color: #58a6ff; }
  .opt .val { color: #e6edf3; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; min-width: 38px; text-align: right; }
  .opt select, .opt input[type=number], .opt input[type=text] {
    background: #0d1117; border: 1px solid #30363d; color: #e6edf3; border-radius: 4px;
    padding: 3px 6px; font-size: 12px; font-family: inherit;
  }
  .opt label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #c9d1d9; }
  .opt-btn {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .opt-btn:hover { background: #30363d; color: #e6edf3; }
  .opt-btn.on { background: #1f6feb33; border-color: #1f6feb88; color: #58a6ff; }
  .opt-hint { color: #8b949e; font-size: 12px; }
  .opt-title { color: #58a6ff; font-weight: 600; font-size: 12px; }

  /* ── Layout ── */
  .workspace { flex: 1; display: flex; min-height: 0; position: relative; }

  .toolbar {
    width: 50px; background: #161b22; border-right: 1px solid #30363d;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 0; flex-shrink: 0; overflow-y: auto;
  }
  .tool-btn {
    width: 38px; height: 38px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: #8b949e; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; flex-shrink: 0;
  }
  .tool-btn svg { width: 20px; height: 20px; }
  .tool-btn:hover { background: #21262d; color: #e6edf3; }
  .tool-btn.active { background: #1f6feb22; border-color: #1f6feb55; color: #58a6ff; }
  .tool-sep { width: 26px; height: 1px; background: #30363d; margin: 4px 0; flex-shrink: 0; }

  /* FG/BG widget */
  .fgbg { position: relative; width: 40px; height: 40px; margin-top: 6px; flex-shrink: 0; }
  .fgbg .sw { position: absolute; width: 24px; height: 24px; border: 2px solid #e6edf3; border-radius: 3px; cursor: pointer; box-shadow: 0 0 0 1px #000; }
  .fgbg .sw.fg { left: 0; top: 0; z-index: 2; }
  .fgbg .sw.bg { right: 0; bottom: 0; z-index: 1; }
  .fgbg-swap { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 11px; margin-top: 2px; flex-shrink: 0; }
  .fgbg-swap:hover { color: #e6edf3; }

  .viewport { position: relative; flex: 1; min-width: 0; background: #1c2128; overflow: hidden; }
  .viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: none; }
  .viewport canvas.cur-grab { cursor: grab; }
  .viewport canvas.cur-grabbing { cursor: grabbing; }
  .viewport canvas.cur-cross { cursor: crosshair; }
  .viewport canvas.cur-move { cursor: move; }

  /* ── Right dock ── */
  .dock {
    width: 272px; background: #161b22; border-left: 1px solid #30363d;
    display: flex; flex-direction: column; flex-shrink: 0; min-height: 0; overflow-y: auto;
  }
  .dock::-webkit-scrollbar { width: 6px; }
  .dock::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  .panel { border-bottom: 1px solid #30363d; }
  .panel-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; font-size: 11px; font-weight: 700; color: #8b949e;
    letter-spacing: .5px; text-transform: uppercase; cursor: pointer; background: #11161d;
  }
  .panel-hd:hover { color: #e6edf3; }
  .panel-hd .chev { transition: transform .15s; }
  .panel.collapsed .panel-hd .chev { transform: rotate(-90deg); }
  .panel.collapsed .panel-bd { display: none; }
  .panel-bd { padding: 10px; }

  /* Color panel */
  .sv-wrap { position: relative; width: 100%; }
  #svCanvas { width: 100%; height: 150px; display: block; border-radius: 4px; cursor: crosshair; touch-action: none; }
  #hueCanvas { width: 100%; height: 14px; display: block; border-radius: 4px; margin-top: 8px; cursor: crosshair; touch-action: none; }
  .color-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .color-row input {
    flex: 1; min-width: 0; background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
    border-radius: 4px; padding: 4px 6px; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
  }
  .color-prev { width: 28px; height: 22px; border-radius: 4px; border: 1px solid #30363d; }
  .swatches { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 8px; }
  .swatches div { aspect-ratio: 1; border-radius: 2px; cursor: pointer; border: 1px solid #0006; }
  .swatches div:hover { outline: 1px solid #e6edf3; }
  .sub-label { font-size: 10px; color: #8b949e; margin-top: 8px; text-transform: uppercase; letter-spacing: .5px; }

  /* Brushes panel */
  .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  .preset {
    background: #0d1117; border: 1px solid #30363d; border-radius: 5px; padding: 3px;
    cursor: pointer; display: flex; flex-direction: column; align-items: stretch; gap: 2px;
    color: #c9d1d9; font-size: 11px; font-family: inherit;
  }
  .preset canvas { width: 100%; height: 34px; display: block; background: #fff; border-radius: 3px; }
  .preset:hover { border-color: #58a6ff88; }
  .preset.active { border-color: #58a6ff; background: #1f6feb22; color: #58a6ff; }

  /* Layers panel */
  .layer-props { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .layer-props .row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8b949e; }
  .layer-props select {
    flex: 1; background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
    border-radius: 4px; padding: 3px 4px; font-size: 12px; font-family: inherit;
  }
  .layer-props input[type=range] { flex: 1; accent-color: #58a6ff; }
  .layer-props .val { width: 34px; text-align: right; color: #e6edf3; font-size: 11px; }
  .icon-toggle {
    background: #0d1117; border: 1px solid #30363d; color: #8b949e; border-radius: 4px;
    width: 28px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-toggle.on { color: #58a6ff; border-color: #1f6feb88; background: #1f6feb22; }
  .icon-toggle svg { width: 14px; height: 14px; }
  .layer-list { display: flex; flex-direction: column; gap: 2px; max-height: 340px; overflow-y: auto; }
  .layer-row {
    display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 4px;
    border: 1px solid transparent; cursor: pointer; background: #0d1117;
  }
  .layer-row:hover { background: #21262d; }
  .layer-row.active { background: #1f6feb22; border-color: #1f6feb66; }
  .layer-row.drop-above { box-shadow: 0 -2px 0 #58a6ff; }
  .layer-row.drop-below { box-shadow: 0 2px 0 #58a6ff; }
  .layer-row .eye { background: none; border: none; color: #8b949e; cursor: pointer; width: 20px; display: flex; justify-content: center; }
  .layer-row .eye.off { color: #484f58; }
  .layer-row .eye svg { width: 15px; height: 15px; }
  .layer-row canvas { width: 44px; height: 32px; border: 1px solid #30363d; border-radius: 2px; flex-shrink: 0;
    background-image: conic-gradient(#555 25%, #888 0 50%, #555 0 75%, #888 0); background-size: 8px 8px; }
  .layer-row .lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .layer-row .lname input { width: 100%; background: #0d1117; border: 1px solid #58a6ff; color: #e6edf3; font-size: 12px; padding: 1px 3px; border-radius: 3px; }
  .layer-row .flags { color: #8b949e; font-size: 10px; display: flex; gap: 2px; }
  .layer-btns { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .layer-btns button {
    flex: 1; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px;
    height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .layer-btns button:hover { background: #30363d; color: #e6edf3; }
  .layer-btns svg { width: 15px; height: 15px; }

  /* ── Status bar ── */
  .statusbar {
    height: 26px; background: #161b22; border-top: 1px solid #30363d;
    display: flex; align-items: center; padding: 0 12px; gap: 16px;
    font-size: 11px; color: #8b949e; flex-shrink: 0; white-space: nowrap; overflow: hidden;
  }
  .statusbar .tool-name { color: #58a6ff; font-weight: 600; }
  .statusbar .sb-right { margin-left: auto; display: flex; gap: 16px; }

  /* ── Popups, dialogs, toast ── */
  .popup-palette {
    position: fixed; z-index: 900; background: #161b22f5; border: 1px solid #30363d; border-radius: 12px;
    padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.6); display: none; width: 250px;
  }
  .popup-palette.show { display: block; }
  .popup-palette .presets { grid-template-columns: repeat(3, 1fr); }
  .popup-palette .preset canvas { height: 24px; }

  .modal-bg {
    position: fixed; inset: 0; background: #0009; z-index: 1000; display: none;
    align-items: center; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px; width: min(420px, calc(100vw - 32px));
    max-height: calc(100vh - 40px); overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,.6);
  }
  .modal h3 { font-size: 14px; padding: 14px 16px; border-bottom: 1px solid #30363d; }
  .modal .mbody { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .modal .mfoot { padding: 12px 16px; border-top: 1px solid #30363d; display: flex; justify-content: flex-end; gap: 8px; }
  .modal .frow { display: flex; align-items: center; gap: 10px; }
  .modal .frow > span { width: 110px; color: #8b949e; font-size: 12px; flex-shrink: 0; }
  .modal input, .modal select {
    flex: 1; min-width: 0; background: #0d1117; border: 1px solid #30363d; color: #e6edf3; border-radius: 4px;
    padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  .modal input[type=checkbox] { flex: 0; }
  .modal .note { font-size: 11px; color: #8b949e; }
  .btn {
    background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .btn:hover { background: #30363d; }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .btn.primary:hover { background: #388bfd; }
  .kbd-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .kbd-table td { padding: 4px 6px; border-bottom: 1px solid #21262d; }
  .kbd-table td:first-child { color: #58a6ff; font-family: 'JetBrains Mono', Consolas, monospace; white-space: nowrap; width: 45%; }

  .toast {
    position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%);
    background: #21262d; border: 1px solid #30363d; color: #e6edf3; padding: 8px 14px;
    border-radius: 6px; font-size: 12px; z-index: 1100; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  .recover-bar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 60;
    background: #161b22f0; border: 1px solid #f0b42966; border-radius: 8px; padding: 8px 12px;
    display: none; align-items: center; gap: 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  .recover-bar.show { display: flex; }

  .drop-hint {
    position: absolute; inset: 12px; border: 2px dashed #58a6ff; border-radius: 12px; background: #1f6feb22;
    display: none; align-items: center; justify-content: center; color: #58a6ff; font-size: 16px; font-weight: 600;
    pointer-events: none; z-index: 70;
  }
  .drop-hint.show { display: flex; }

  input[type=file] { display: none; }

  /* ── Narrow screens: dock becomes an overlay ── */
  .dock-toggle { display: none; }
  @media (max-width: 900px) {
    .dock { position: absolute; right: 0; top: 0; bottom: 0; z-index: 80; display: none; box-shadow: -8px 0 24px rgba(0,0,0,.5); }
    .dock.show { display: flex; }
    .dock-toggle { display: flex; }
    .topbar-crumb > span:not(.topbar-title) { display: none; }
    .doc-name { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="/">PortiCAD</a>
  <span class="topbar-sep">›</span>
  <div class="topbar-crumb">
    <span>Multi-Tools</span><span>›</span>
    <span class="topbar-title">Pintura Digital</span>
  </div>
  <span class="badge" style="background:#22d3ee22;border:1px solid #22d3ee55;color:#22d3ee;">Dibujo</span>
  <span class="badge" style="background:#f0b42922;border:1px solid #f0b42955;color:#f0b429;">🧪 Beta</span>
  <div class="topbar-right">
    <span class="doc-name" id="docName"></span>
  </div>
</div>

<div class="menubar" id="menubar">
  <div class="menu-item">
    <button class="menu-btn">Archivo</button>
    <div class="menu-dropdown">
      <button data-cmd="new">Nuevo… <span class="key">Ctrl+N</span></button>
      <button data-cmd="open">Abrir… <span class="key">Ctrl+O</span></button>
      <button data-cmd="importLayer">Importar imagen como capa…</button>
      <hr>
      <button data-cmd="save">Guardar (.ora, compatible con Krita) <span class="key">Ctrl+S</span></button>
      <button data-cmd="exportPng">Exportar PNG <span class="key">Ctrl+Shift+E</span></button>
      <button data-cmd="exportJpg">Exportar JPG</button>
    </div>
  </div>
  <div class="menu-item">
    <button class="menu-btn">Editar</button>
    <div class="menu-dropdown">
      <button data-cmd="undo">Deshacer <span class="key">Ctrl+Z</span></button>
      <button data-cmd="redo">Rehacer <span class="key">Ctrl+Shift+Z</span></button>
      <hr>
      <button data-cmd="copy">Copiar <span class="key">Ctrl+C</span></button>
      <button data-cmd="cut">Cortar <span class="key">Ctrl+X</span></button>
      <button data-cmd="paste">Pegar como capa nueva <span class="key">Ctrl+V</span></button>
      <hr>
      <button data-cmd="clearSel">Borrar <span class="key">Supr</span></button>
      <button data-cmd="fillFg">Rellenar con color frontal <span class="key">Retroceso</span></button>
      <button data-cmd="fillBg">Rellenar con color de fondo <span class="key">Shift+Retroceso</span></button>
    </div>
  </div>
  <div class="menu-item">
    <button class="menu-btn">Imagen</button>
    <div class="menu-dropdown">
      <button data-cmd="canvasSize">Tamaño del lienzo…</button>
      <button data-cmd="scaleImage">Escalar imagen…</button>
      <button data-cmd="cropSel">Recortar a la selección</button>
      <hr>
      <button data-cmd="imgFlipH">Voltear horizontalmente</button>
      <button data-cmd="imgFlipV">Voltear verticalmente</button>
      <button data-cmd="imgRotCW">Rotar 90° a la derecha</button>
      <button data-cmd="imgRotCCW">Rotar 90° a la izquierda</button>
    </div>
  </div>
  <div class="menu-item">
    <button class="menu-btn">Capa</button>
    <div class="menu-dropdown">
      <button data-cmd="newLayer">Nueva capa <span class="key">Insert</span></button>
      <button data-cmd="dupLayer">Duplicar capa <span class="key">Ctrl+J</span></button>
      <button data-cmd="delLayer">Eliminar capa</button>
      <hr>
      <button data-cmd="mergeDown">Combinar con la de abajo <span class="key">Ctrl+E</span></button>
      <button data-cmd="flatten">Aplanar imagen</button>
      <hr>
      <button data-cmd="layerFlipH">Voltear capa horizontalmente</button>
      <button data-cmd="layerFlipV">Voltear capa verticalmente</button>
      <button data-cmd="clearLayer">Limpiar capa</button>
    </div>
  </div>
  <div class="menu-item">
    <button class="menu-btn">Selección</button>
    <div class="menu-dropdown">
      <button data-cmd="selectAll">Seleccionar todo <span class="key">Ctrl+A</span></button>
      <button data-cmd="deselect">Deseleccionar <span class="key">Ctrl+Shift+A</span></button>
    </div>
  </div>
  <div class="menu-item">
    <button class="menu-btn">Vista</button>
    <div class="menu-dropdown">
      <button data-cmd="zoomIn">Acercar <span class="key">+</span></button>
      <button data-cmd="zoomOut">Alejar <span class="key">−</span></button>
      <button data-cmd="zoom100">Zoom 100% <span class="key">1</span></button>
      <button data-cmd="zoomFit">Ajustar a la ventana <span class="key">2</span></button>
      <hr>
      <button data-cmd="rotL">Rotar vista a la izquierda <span class="key">4</span></button>
      <button data-cmd="rotR">Rotar vista a la derecha <span class="key">6</span></button>
      <button data-cmd="rotReset">Restablecer rotación <span class="key">5</span></button>
      <button data-cmd="mirror">Espejo de vista <span class="key">M</span></button>
    </div>
  </div>
  <div class="menu-item">
    <button class="menu-btn">Ayuda</button>
    <div class="menu-dropdown">
      <button data-cmd="shortcuts">Atajos de teclado</button>
    </div>
  </div>
  <div class="menubar-sep"></div>
  <button class="menubar-btn" id="btnUndo" data-cmd="undo" title="Deshacer (Ctrl+Z)" disabled>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════════════════
//  Utilidades
// ════════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w); c.height = Math.max(1, h);
  return c;
}
function hexToRgb(hex) {
  let h = String(hex).trim().replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  const n = parseInt(h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex({ r, g, b }) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function hsvToRgb(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return { r: Math.round(f(5) * 255), g: Math.round(f(3) * 255), b: Math.round(f(1) * 255) };
}
function rgbToHsv({ r, g, b }) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { h, s: max ? d / max : 0, v: max };
}
function toast(msg, ms = 2200) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function canvasToBlob(c, type = 'image/png', q) {
  return new Promise(res => c.toBlob(res, type, q));
}
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

// ════════════════════════════════════════════════════════════════════════════
//  Documento y capas
// ════════════════════════════════════════════════════════════════════════════
const MAX_DIM = 8192;
const BLEND_MODES = [
  ['source-over', 'Normal'], ['multiply', 'Multiplicar'], ['screen', 'Trama'], ['overlay', 'Superponer'],
  ['darken', 'Oscurecer'], ['lighten', 'Aclarar'], ['color-dodge', 'Sobreexponer color'], ['color-burn', 'Subexponer color'],
  ['hard-light', 'Luz fuerte'], ['soft-light', 'Luz suave'], ['difference', 'Diferencia'], ['exclusion', 'Exclusión'],
  ['hue', 'Tono'], ['saturation', 'Saturación'], ['color', 'Color'], ['luminosity', 'Luminosidad'],
];

const doc = { width: 1920, height: 1080, name: 'dibujo', layers: [], activeId: null, selection: null };
let nextLayerId = 1;

function createLayer(name, w = doc.width, h = doc.height) {
  const canvas = makeCanvas(w, h);
  return { id: nextLayerId++, name, canvas, ctx: canvas.getContext('2d'),
           visible: true, opacity: 1, blend: 'source-over', alphaLock: false, locked: false, thumb: null };
}
function setLayerCanvas(layer, canvas) { layer.canvas = canvas; layer.ctx = canvas.getContext('2d'); }
function activeLayer() { return doc.layers.find(l => l.id === doc.activeId) || null; }
function layerIndex(layer) { return doc.layers.indexOf(layer); }
function setActive(layer) { if (layer) { doc.activeId = layer.id; renderLayersPanel(); } }
function cloneCanvas(src) { const c = makeCanvas(src.width, src.height); c.getContext('2d').drawImage(src, 0, 0); return c; }

// Canvases de trabajo del tamaño del documento
let composite, compCtx, strokeCanvas, strokeCtx, scratch, scratchCtx;
function allocWorkCanvases() {
  composite = makeCanvas(doc.width, doc.height); compCtx = composite.getContext('2d');
  strokeCanvas = makeCanvas(doc.width, doc.height); strokeCtx = strokeCanvas.getContext('2d');
  scratch = makeCanvas(doc.width, doc.height); scratchCtx = scratch.getContext('2d');
}

function newDocument(w, h, bg, name = 'dibujo') {
  cancelLive();
  doc.width = w; doc.height = h; doc.name = name; doc.layers = []; doc.selection = null;
  nextLayerId = 1;
  allocWorkCanvases();
  const base = createLayer(bg ? 'Fondo' : 'Capa 1');
  if (bg) { base.ctx.fillStyle = bg; base.ctx.fillRect(0, 0, w, h); }
  doc.layers.push(base);
  if (bg) { const l = createLayer('Capa 1'); doc.layers.push(l); doc.activeId = l.id; }
  else doc.activeId = base.id;
  clearHistory();
  savedSinceChange = true;
  afterDocReplaced();
}
function afterDocReplaced() {
  $('docName').textContent = doc.name + '  ·  ' + doc.width + '×' + doc.height;
  doc.layers.forEach(l => { l.thumb = null; });
  zoomFit();
  renderLayersPanel();
  compositeDirty = true; requestRender(); updateStatus();
}

// ════════════════════════════════════════════════════════════════════════════
//  Historial (deshacer / rehacer)
// ════════════════════════════════════════════════════════════════════════════
const HISTORY_MAX = 50;
const history = { undo: [], redo: [] };
let savedSinceChange = true;

function clearHistory() { history.undo.length = 0; history.redo.length = 0; updateHistoryButtons(); }
function pushHistory(entry) {
  history.undo.push(entry);
  if (history.undo.length > HISTORY_MAX) history.undo.shift();
  history.redo.length = 0;
  updateHistoryButtons();
  docChanged();
}
function doUndo() {
  cancelLive();
  const e = history.undo.pop(); if (!e) return;
  e.undo(); history.redo.push(e);
  afterHistoryJump(e);
}
function doRedo() {
  cancelLive();
  const e = history.redo.pop(); if (!e) return;
  e.redo(); history.undo.push(e);
  afterHistoryJump(e);
}
function afterHistoryJump(e) {
  if (e.structural) { if (!activeLayer() && doc.layers.length) doc.activeId = doc.layers[doc.layers.length - 1].id; }
  if (e.docLevel) afterDocResize();
  doc.layers.forEach(updateThumb);
  renderLayersPanel(); updateHistoryButtons();
  compositeDirty = true; requestRender(); docChanged();
  toast((history.undo.includes(e) ? 'Rehecho: ' : 'Deshecho: ') + e.label, 1200);
}
function updateHistoryButtons() {
  $('btnUndo').disabled = !history.undo.length;
  $('btnRedo').disabled = !history.redo.length;
}

// Copia de una región de un canvas (para guardar píxeles antes/después)
function snapRect(src, r) {
  const c = makeCanvas(r.w, r.h);
  c.getContext('2d').drawImage(src, -r.x, -r.y);
  return c;
}
function restoreRect(layer, r, snap) {
  layer.ctx.save();
  layer.ctx.globalCompositeOperation = 'source-over'; layer.ctx.globalAlpha = 1;
  layer.ctx.clearRect(r.x, r.y, r.w, r.h);
  layer.ctx.drawImage(snap, r.x, r.y);
  layer.ctx.restore();
}
function fullRect() { return { x: 0, y: 0, w: doc.width, h: doc.height }; }
function clipRectToDoc(r) {
  const x0 = clamp(Math.floor(r.x), 0, doc.width), y0 = clamp(Math.floor(r.y), 0, doc.height);
  const x1 = clamp(Math.ceil(r.x + r.w), 0, doc.width), y1 = clamp(Math.ceil(r.y + r.h), 0, doc.height);
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
// Ejecuta `paint()` sobre una capa registrando la región `rect` en el historial.
function paintWithHistory(layer, rect, label, paint) {
  const r = clipRectToDoc(rect);
  if (r.w <= 0 || r.h <= 0) return false;
  const before = snapRect(layer.canvas, r);
  paint(layer.ctx);
  const after = snapRect(layer.canvas, r);
  pushHistory({
    label,
    undo() { restoreRect(layer, r, before); },
    redo() { restoreRect(layer, r, after); },
  });
  updateThumb(layer);
  compositeDirty = true; requestRender();
  return true;
}
function canPaint(layer) {
  if (!layer) { toast('No hay capa activa'); return false; }
  if (!layer.visible) { toast('La capa está oculta'); return false; }
  if (layer.locked) { toast('La capa está bloqueada'); return false; }
  return true;
}

// ════════════════════════════════════════════════════════════════════════════
//  Vista (zoom, desplazamiento, rotación, espejo)
// ════════════════════════════════════════════════════════════════════════════
const viewCanvas = $('view');
const viewCtx = viewCanvas.getContext('2d');
const view = { zoom: 1, panX: 0, panY: 0, rot: 0, flip: false, w: 0, h: 0, dpr: 1 };
const ZOOM_MIN = 0.02, ZOOM_MAX = 64;

function docToScreen(x, y) {
  let dx = (x - doc.width / 2) * view.zoom, dy = (y - doc.height / 2) * view.zoom;
  if (view.flip) dx = -dx;
  const c = Math.cos(view.rot), s = Math.sin(view.rot);
  return { x: view.panX + dx * c - dy * s, y: view.panY + dx * s + dy * c };
}
function screenToDoc(sx, sy) {
  const dx = sx - view.panX, dy = sy - view.panY;
  const c = Math.cos(-view.rot), s = Math.sin(-view.rot);
  let rx = (dx * c - dy * s) / view.zoom, ry = (dx * s + dy * c) / view.zoom;
  if (view.flip) rx = -rx;
  return { x: rx + doc.width / 2, y: ry + doc.height / 2 };
}
function placeDocPointAt(p, screen) {
  view.panX = 0; view.panY = 0;
  const s = docToScreen(p.x, p.y);
  view.panX = screen.x - s.x; view.panY = screen.y - s.y;
}
function zoomAt(factor, sx, sy) {
  const p = screenToDoc(sx, sy);
  view.zoom = clamp(view.zoom * factor, ZOOM_MIN, ZOOM_MAX);
  placeDocPointAt(p, { x: sx, y: sy });
  requestRender(); updateStatus();
}
function zoomFit() {
  if (!view.w) return;
  view.zoom = clamp(Math.min(view.w / doc.width, view.h / doc.height) * 0.9, ZOOM_MIN, ZOOM_MAX);
  view.rot = 0;
  placeDocPointAt({ x: doc.width / 2, y: doc.height / 2 }, { x: view.w / 2, y: view.h / 2 });
  requestRender(); updateStatus();
}
function zoomTo(z) {
  const c = { x: view.w / 2, y: view.h / 2 };
  zoomAt(z / view.zoom, c.x, c.y);
}
function rotateView(deltaRad) {
  const c = { x: view.w / 2, y: view.h / 2 };
  const p = screenToDoc(c.x, c.y);
  view.rot = (view.rot + deltaRad) % (Math.PI * 2);
  placeDocPointAt(p, c);

function drawPresetPreview(preset, canvas) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth || 110, H = canvas.clientHeight || 34;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  const off = makeCanvas(W, H), octx = off.getContext('2d');
  const col = { r: 20, g: 24, b: 30 };
  const maxSize = Math.min(preset.size, H * 0.55);
  let prev = null, acc = 0;
  for (let i = 0; i <= 200; i++) {
    const t = i / 200;
    const x = 8 + t * (W - 16), y = H / 2 + Math.sin(t * Math.PI * 2) * H * 0.22;
    const p = Math.sin(t * Math.PI);
    if (prev) acc += Math.hypot(x - prev.x, y - prev.y);
    prev = { x, y };
    const size = Math.max(preset.shape === 'pixel' ? 1.5 : 0.8, maxSize * (preset.pressureSize ? 0.1 + 0.9 * p : 1));
    if (acc < Math.max(0.5, size * preset.spacing)) continue;
    acc = 0;
    octx.globalAlpha = clamp(preset.flow * (preset.pressureOpacity ? p : 1), 0, 1);
    if (preset.shape === 'pixel') { octx.fillStyle = '#14181e'; octx.fillRect(Math.round(x), Math.round(y), 2, 2); }
    else octx.drawImage(getTip(col, preset.hardness, preset.shape, size), x - size / 2, y - size / 2, size, size);
  }
  ctx.globalAlpha = preset.opacity; ctx.drawImage(off, 0, 0, W, H);
}
function renderPresets() {

}

// ── Operaciones de capa (con historial) ─────────────────────────────────────
function structuralEntry(label, before, after) {

  return {
    label, structural: true,
    undo() { doc.layers = before.layers.slice(); doc.activeId = before.activeId; },
    redo() { doc.layers = after.layers.slice(); doc.activeId = after.activeId; },
  };
}
function structuralChange(label, mutate) {
  cancelLive();
  const before = { layers: doc.layers.slice(), activeId: doc.activeId };
  if (mutate() === false) return;
  const after = { layers: doc.layers.slice(), activeId: doc.activeId };
  pushHistory(structuralEntry(label, before, after));
  compositeDirty = true; requestRender(); renderLayersPanel();
}
function nextLayerName() {
  let n = doc.layers.length + 1;
  while (doc.layers.some(l => l.name === 'Capa ' + n)) n++;
  return 'Capa ' + n;
}
function addLayer(layer, label = 'Nueva capa') {
  structuralChange(label, () => {
    const a = activeLayer();
    const idx = a ? layerIndex(a) + 1 : doc.layers.length;
    doc.layers.splice(idx, 0, layer);
    doc.activeId = layer.id;
  });
}
function reorderLayer(layer, to) {

    const from = layerIndex(layer);
    to = clamp(to, 0, doc.layers.length - 1);
    if (from === to) return false;
    doc.layers.splice(from, 1); doc.layers.splice(to, 0, layer);
  });
}

  structuralChange('Eliminar capa', () => {
    const i = layerIndex(a);
    doc.layers.splice(i, 1);
    doc.activeId = doc.layers[Math.max(0, i - 1)].id;
  });
}

}
function mergeDown() {

  const below = doc.layers[i - 1];
  const beforeLayers = doc.layers.slice(), beforeActive = doc.activeId;
  const beforePix = cloneCanvas(below.canvas);
  // Combina usando la opacidad y el modo de la capa superior
  const merged = cloneCanvas(below.canvas), mctx = merged.getContext('2d');
  if (below.visible && a.visible) {
    mctx.globalAlpha = a.opacity; mctx.globalCompositeOperation = a.blend;
    mctx.drawImage(a.canvas, 0, 0);
  } else if (!below.visible && a.visible) {
    mctx.clearRect(0, 0, doc.width, doc.height);
    mctx.globalAlpha = a.opacity; mctx.drawImage(a.canvas, 0, 0);
  }
  if (a.visible || below.visible) {
    below.ctx.save(); below.ctx.globalCompositeOperation = 'copy'; below.ctx.drawImage(merged, 0, 0); below.ctx.restore();
  }
  const wasVisible = below.visible;
  below.visible = below.visible || a.visible;
  doc.layers.splice(i, 1);
  doc.activeId = below.id;
  const afterPix = cloneCanvas(below.canvas);
  const afterLayers = doc.layers.slice();
  pushHistory({
    label: 'Combinar hacia abajo', structural: true,
    undo() { restoreRect(below, fullRect(), beforePix); below.visible = wasVisible; doc.layers = beforeLayers.slice(); doc.activeId = beforeActive; },
    redo() { restoreRect(below, fullRect(), afterPix); below.visible = wasVisible || a.visible; doc.layers = afterLayers.slice(); doc.activeId = below.id; },

function afterDocResize() {

  if (doc.selection) {
    const s = clipRectToDoc(doc.selection);
    doc.selection = s.w > 0 && s.h > 0 ? s : null;
  }
  $('docName').textContent = doc.name + '  ·  ' + doc.width + '×' + doc.height;
  compositeDirty = true; updateStatus();

// draw(ctx, oldCanvas) dibuja cada capa en su nuevo canvas de newW×newH

  cancelLive();
  const before = { w: doc.width, h: doc.height, canvases: doc.layers.map(l => [l, l.canvas]) };
  for (const l of doc.layers) {
    const c = makeCanvas(newW, newH);
    draw(c.getContext('2d'), l.canvas);
    setLayerCanvas(l, c);
  }
  doc.width = newW; doc.height = newH;
  const after = { w: newW, h: newH, canvases: doc.layers.map(l => [l, l.canvas]) };
  const apply = s => { doc.width = s.w; doc.height = s.h; for (const [l, c] of s.canvases) setLayerCanvas(l, c); };
  pushHistory({ label, docLevel: true, undo() { apply(before); }, redo() { apply(after); } });

  renderLayersPanel(); zoomFit();
}

  paintWithHistory(a, r, label, ctx => ctx.clearRect(r.x, r.y, r.w, r.h));

let internalClip = null;   // { canvas, x, y }
async function copySelection(cut) {
  const a = activeLayer(); if (!a) return;
  const r = doc.selection ? clipRectToDoc(doc.selection) : fullRect();
  if (r.w <= 0 || r.h <= 0) return;
  internalClip = { canvas: snapRect(a.canvas, r), x: r.x, y: r.y };
  try {
    const blob = await canvasToBlob(internalClip.canvas);
    if (navigator.clipboard && window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
  } catch {}
  if (cut) clearSelectionOrLayer('Cortar');
  toast(cut ? 'Cortado' : 'Copiado', 1000);
}
function pasteCanvas(c, x, y, name = 'Pegado') {
  const l = createLayer(name);
  if (x === undefined) { x = Math.round((doc.width - c.width) / 2); y = Math.round((doc.height - c.height) / 2); }
  l.ctx.drawImage(c, x, y);
  addLayer(l, 'Pegar');
  updateThumb(l);
}
document.addEventListener('paste', async e => {
  if (isTyping(e)) return;
  const items = e.clipboardData ? [...e.clipboardData.items] : [];
  const img = items.find(i => i.type.startsWith('image/'));
  if (img) {
    e.preventDefault();
    const file = img.getAsFile();
    const url = URL.createObjectURL(file);
    try { const im = await loadImage(url); const c = makeCanvas(im.naturalWidth, im.naturalHeight); c.getContext('2d').drawImage(im, 0, 0); pasteCanvas(c); }
    finally { URL.revokeObjectURL(url); }
  } else if (internalClip) {
    e.preventDefault();
    pasteCanvas(internalClip.canvas, internalClip.x, internalClip.y);
  }
});
async function pasteFromMenu() {
  try {
    if (navigator.clipboard && navigator.clipboard.read) {
      const items = await navigator.clipboard.read();
      for (const it of items) {
        const type = it.types.find(t => t.startsWith('image/'));
        if (type) {
          const blob = await it.getType(type);
          const url = URL.createObjectURL(blob);
          try { const im = await loadImage(url); const c = makeCanvas(im.naturalWidth, im.naturalHeight); c.getContext('2d').drawImage(im, 0, 0); pasteCanvas(c); }
          finally { URL.revokeObjectURL(url); }
          return;
        }
      }
    }
  } catch {}
  if (internalClip) pasteCanvas(internalClip.canvas, internalClip.x, internalClip.y);
  else toast('El portapapeles no contiene una imagen');
}

//  Archivos: abrir, importar, guardar (.ora), exportar
// ════════════════════════════════════════════════════════════════════════════
const ORA_OPS = { 'source-over': 'svg:src-over' };
function oraOp(blend) { return ORA_OPS[blend] || 'svg:' + blend; }
function blendFromOra(op) {
  if (!op) return 'source-over';
  const m = op.replace(/^svg:/, '');
  if (m === 'src-over') return 'source-over';
  return BLEND_MODES.some(b => b[0] === m) ? m : 'source-over';
}
function escXml(s) { return String(s).replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[c])); }

async function buildOra() {
  if (typeof JSZip === 'undefined') throw new Error('No se pudo cargar JSZip');
  recomposite();
  const zip = new JSZip();
  zip.file('mimetype', 'image/openraster', { compression: 'STORE' });
  let stack = '';
  const files = [];
  for (let i = doc.layers.length - 1; i >= 0; i--) {
    const l = doc.layers[i];
    const src = `data/layer${i}.png`;
    stack += `  <layer name="${escXml(l.name)}" src="${src}" x="0" y="0" opacity="${l.opacity.toFixed(3)}" visibility="${l.visible ? 'visible' : 'hidden'}" composite-op="${oraOp(l.blend)}"${l.alphaLock ? ' alpha-preserve="true"' : ''}${l.locked ? ' edit-locked="true"' : ''}/>\n`;
    files.push([src, canvasToBlob(l.canvas)]);
  }
  zip.file('stack.xml', `<?xml version='1.0' encoding='UTF-8'?>\n<image version="0.0.5" w="${doc.width}" h="${doc.height}">\n <stack>\n${stack} </stack>\n</image>\n`);
  for (const [name, p] of files) zip.file(name, await p);
  zip.file('mergedimage.png', await canvasToBlob(composite));
  const ts = Math.min(1, 256 / Math.max(doc.width, doc.height));
  const th = makeCanvas(Math.round(doc.width * ts), Math.round(doc.height * ts));
  th.getContext('2d').drawImage(composite, 0, 0, th.width, th.height);
  zip.file('Thumbnails/thumbnail.png', await canvasToBlob(th));
  return zip.generateAsync({ type: 'blob', mimeType: 'image/openraster' });
}
async function loadOra(blob, name) {
  if (typeof JSZip === 'undefined') throw new Error('No se pudo cargar JSZip');
  const zip = await JSZip.loadAsync(blob);
  const xmlText = await zip.file('stack.xml').async('string');
  const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
  const image = xml.querySelector('image');
  const w = parseInt(image.getAttribute('w')), h = parseInt(image.getAttribute('h'));
  if (!(w > 0 && h > 0) || w > MAX_DIM || h > MAX_DIM) throw new Error('Tamaño de imagen no soportado');
  // Aplana grupos: recorre todas las capas (primer elemento = arriba)
  const layerEls = [...xml.querySelectorAll('layer')];
  cancelLive();
  doc.width = w; doc.height = h; doc.name = name; doc.selection = null; doc.layers = [];
  nextLayerId = 1;
  allocWorkCanvases();
  for (let i = layerEls.length - 1; i >= 0; i--) {
    const el = layerEls[i];
    const f = zip.file(el.getAttribute('src'));
    const l = createLayer(el.getAttribute('name') || 'Capa');
    if (f) {
      const url = URL.createObjectURL(await f.async('blob'));
      try { const im = await loadImage(url); l.ctx.drawImage(im, parseFloat(el.getAttribute('x')) || 0, parseFloat(el.getAttribute('y')) || 0); }
      catch {} finally { URL.revokeObjectURL(url); }
    }
    const op = parseFloat(el.getAttribute('opacity'));
    l.opacity = isNaN(op) ? 1 : clamp(op, 0, 1);
    l.visible = el.getAttribute('visibility') !== 'hidden';
    l.blend = blendFromOra(el.getAttribute('composite-op'));
    l.alphaLock = el.getAttribute('alpha-preserve') === 'true';
    l.locked = el.getAttribute('edit-locked') === 'true';
    doc.layers.push(l);
  }
  if (!doc.layers.length) doc.layers.push(createLayer('Capa 1'));
  doc.activeId = doc.layers[doc.layers.length - 1].id;
  clearHistory();
  afterDocReplaced();
}
async function openFile(file) {
  const base = file.name.replace(/\.[^.]+$/, '') || 'dibujo';
  try {
    if (/\.ora$/i.test(file.name)) { await loadOra(file, base); savedSinceChange = true; toast('Abierto: ' + file.name); return; }
    const url = URL.createObjectURL(file);
    try {
      const im = await loadImage(url);
      const w = im.naturalWidth, h = im.naturalHeight;
      if (w > MAX_DIM || h > MAX_DIM) { toast(`Imagen demasiado grande (máx. ${MAX_DIM} px por lado)`); return; }
      newDocument(w, h, null, base);
      doc.layers[0].name = 'Fondo';
      doc.layers[0].ctx.drawImage(im, 0, 0);
      const l = createLayer('Capa 1'); doc.layers.push(l); doc.activeId = l.id;
      afterDocReplaced();
      toast('Abierto: ' + file.name);
    } finally { URL.revokeObjectURL(url); }
  } catch (err) {
    console.error(err); toast('No se pudo abrir el archivo: ' + (err.message || err));
  }
}
async function importAsLayer(file) {
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImage(url);
    let w = im.naturalWidth, h = im.naturalHeight;
    const c = makeCanvas(w, h); c.getContext('2d').drawImage(im, 0, 0);
    pasteCanvas(c, undefined, undefined, file.name.replace(/\.[^.]+$/, ''));
  } catch { toast('No se pudo leer la imagen'); }
  finally { URL.revokeObjectURL(url); }
}
async function saveOra() {
  try {
    toast('Guardando…', 5000);
    const blob = await buildOra();
    downloadBlob(blob, doc.name + '.ora');
    savedSinceChange = true;
    toast('Guardado ' + doc.name + '.ora');
  } catch (err) { console.error(err); toast('Error al guardar: ' + (err.message || err)); }
}
async function exportImage(type) {
  recomposite();
  let src = composite;
  if (type === 'image/jpeg') {
    src = makeCanvas(doc.width, doc.height);
    const c = src.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, doc.width, doc.height); c.drawImage(composite, 0, 0);
  }
  const blob = await canvasToBlob(src, type, 0.92);
  downloadBlob(blob, doc.name + (type === 'image/jpeg' ? '.jpg' : '.png'));
}
$('fileOpen').addEventListener('change', e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; });
$('fileImport').addEventListener('change', e => { const f = e.target.files[0]; if (f) importAsLayer(f); e.target.value = ''; });

const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
$('viewport').addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragDepth++; $('dropHint').classList.add('show'); });

// ── Autoguardado en el navegador (IndexedDB) ────────────────────────────────
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('porticad_pintura', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', mode), st = tx.objectStore('kv');
    const req = fn(st);
    tx.oncomplete = () => { res(req && req.result); db.close(); };
    tx.onerror = () => { rej(tx.error); db.close(); };
  });
}
let autosaveTimer = null, autosaving = false;
function docChanged() {
  savedSinceChange = false;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosave, 4000);
}
async function autosave() {
  if (live || autosaving) { autosaveTimer = setTimeout(autosave, 2000); return; }
  autosaving = true;
  try {
    const blob = await buildOra();
    await idbDo('readwrite', st => st.put({ blob, name: doc.name, time: Date.now(), w: doc.width, h: doc.height }, 'autosave'));
  } catch (err) { console.warn('Autoguardado falló', err); }
  autosaving = false;
}
async function checkAutosave() {
  try {
    const rec = await idbDo('readonly', st => st.get('autosave'));
    if (!rec || !rec.blob) return;
    const mins = Math.round((Date.now() - rec.time) / 60000);
    const ago = mins < 1 ? 'hace un momento' : mins < 60 ? `hace ${mins} min` : mins < 1440 ? `hace ${Math.round(mins / 60)} h` : `hace ${Math.round(mins / 1440)} días`;
    $('recoverText').textContent = `Dibujo autoguardado “${rec.name}” (${rec.w}×${rec.h}, ${ago}).`;
    $('recoverBar').classList.add('show');
    $('btnRecover').onclick = async () => {
      $('recoverBar').classList.remove('show');
      try { await loadOra(rec.blob, rec.name); toast('Dibujo recuperado'); } catch (err) { toast('No se pudo recuperar: ' + err.message); }
    };
    $('btnDiscard').onclick = async () => {
      $('recoverBar').classList.remove('show');
      try { await idbDo('readwrite', st => st.delete('autosave')); } catch {}
    };
  } catch {}
}

function runCmd(cmd) {
  closeMenus();
  switch (cmd) {
    case 'new': dialogNew(); break;
    case 'open': $('fileOpen').click(); break;
    case 'importLayer': $('fileImport').click(); break;
    case 'save': saveOra(); break;
    case 'exportPng': exportImage('image/png'); break;
    case 'exportJpg': exportImage('image/jpeg'); break;
    case 'undo': doUndo(); break;
    case 'redo': doRedo(); break;
    case 'copy': copySelection(false); break;
    case 'cut': copySelection(true); break;
    case 'paste': pasteFromMenu(); break;
    case 'clearSel': clearSelectionOrLayer(); break;
    case 'fillFg': fillSelectionOrLayer(fg, 'Rellenar'); break;
    case 'fillBg': fillSelectionOrLayer(bgc, 'Rellenar'); break;
    case 'canvasSize': dialogCanvasSize(); break;
    case 'scaleImage': dialogScale(); break;
    case 'cropSel': {
      if (!doc.selection) { toast('Primero haz una selección'); break; }
      const s = clipRectToDoc(doc.selection);
      doc.selection = null;
      transformDocument('Recortar', s.w, s.h, (ctx, old) => ctx.drawImage(old, -s.x, -s.y));
      break;
    }
    case 'imgFlipH': transformDocument('Voltear imagen H', doc.width, doc.height, (ctx, old) => { ctx.translate(doc.width, 0); ctx.scale(-1, 1); ctx.drawImage(old, 0, 0); }); break;
    case 'imgFlipV': transformDocument('Voltear imagen V', doc.width, doc.height, (ctx, old) => { ctx.translate(0, doc.height); ctx.scale(1, -1); ctx.drawImage(old, 0, 0); }); break;
    case 'imgRotCW': { const w = doc.width, h = doc.height; doc.selection = null; transformDocument('Rotar 90°', h, w, (ctx, old) => { ctx.translate(h, 0); ctx.rotate(Math.PI / 2); ctx.drawImage(old, 0, 0); }); break; }
    case 'imgRotCCW': { const w = doc.width, h = doc.height; doc.selection = null; transformDocument('Rotar −90°', h, w, (ctx, old) => { ctx.translate(0, w); ctx.rotate(-Math.PI / 2); ctx.drawImage(old, 0, 0); }); break; }
    case 'newLayer': addLayer(createLayer(nextLayerName())); break;
    case 'dupLayer': duplicateLayer(); break;
    case 'delLayer': deleteLayer(); break;
    case 'layerUp': { const a = activeLayer(); if (a) reorderLayer(a, layerIndex(a) + 1); break; }
    case 'layerDown': { const a = activeLayer(); if (a) reorderLayer(a, layerIndex(a) - 1); break; }
    case 'mergeDown': mergeDown(); break;
    case 'flatten': flattenImage(); break;
    case 'layerFlipH': flipLayer(true); break;
    case 'layerFlipV': flipLayer(false); break;
    case 'clearLayer': { const a = activeLayer(); if (canPaint(a)) paintWithHistory(a, fullRect(), 'Limpiar capa', ctx => ctx.clearRect(0, 0, doc.width, doc.height)); break; }
    case 'selectAll': doc.selection = fullRect(); requestRender(); break;
    case 'deselect': doc.selection = null; requestRender(); break;
    case 'zoomIn': zoomAt(1.25, view.w / 2, view.h / 2); break;
    case 'zoomOut': zoomAt(1 / 1.25, view.w / 2, view.h / 2); break;
    case 'zoom100': zoomTo(1); break;
    case 'zoomFit': zoomFit(); break;
    case 'rotL': rotateView(-Math.PI / 12); break;
    case 'rotR': rotateView(Math.PI / 12); break;
    case 'rotReset': setRotation(0); break;
    case 'mirror': toggleMirror(); break;
    case 'shortcuts': dialogShortcuts(); break;
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cmd]');
  if (b && !b.disabled) runCmd(b.dataset.cmd);
});

// Menús desplegables: clic abre, pasar el mouse cambia entre menús abiertos
function closeMenus() {
  document.querySelectorAll('.menu-dropdown.show').forEach(d => d.classList.remove('show'));
  document.querySelectorAll('.menu-btn.open').forEach(b => b.classList.remove('open'));
}
document.querySelectorAll('.menu-btn').forEach(btn => {
  const dd = btn.nextElementSibling;
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const open = dd.classList.contains('show');
    closeMenus();
    if (!open) { dd.classList.add('show'); btn.classList.add('open'); }
  });
  btn.addEventListener('mouseenter', () => {
    if (document.querySelector('.menu-dropdown.show') && !dd.classList.contains('show')) {
      closeMenus(); dd.classList.add('show'); btn.classList.add('open');
    }
  });
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.menu-item')) closeMenus(); });

document.querySelectorAll('.tool-btn').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
document.querySelectorAll('.panel-hd').forEach(h => h.addEventListener('click', () => {
  h.parentElement.classList.toggle('collapsed');
  if (h.parentElement.id === 'panelColor') requestAnimationFrame(sizeColorCanvases);
}));
$('btnDock').addEventListener('click', () => {
  $('dock').classList.toggle('show');
  requestAnimationFrame(() => { sizeColorCanvases(); renderPresets(); });
});

// ── Barra de estado ─────────────────────────────────────────────────────────
function updateStatus() {
  $('sbTool').textContent = TOOL_NAMES[tool];
  $('sbHint').textContent = TOOL_HINTS[tool];
  $('sbSize').textContent = `${doc.width}×${doc.height}`;
  let deg = Math.round(view.rot * 180 / Math.PI) % 360; if (deg < 0) deg += 360;
  $('sbView').textContent = `${Math.round(view.zoom * 1000) / 10}%` + (deg ? `  ·  ${deg}°` : '') + (view.flip ? '  ·  espejo' : '');
}

// ════════════════════════════════════════════════════════════════════════════
//  Inicio
// ════════════════════════════════════════════════════════════════════════════
new ResizeObserver(resizeViewport).observe($('viewport'));
new ResizeObserver(sizeColorCanvases).observe(svCanvas);
window.addEventListener('beforeunload', e => {
  if (!savedSinceChange && history.undo.length) { e.preventDefault(); e.returnValue = ''; }
});

(function init() {
  const last = lsGet('pintura.lastNew', { w: 1920, h: 1080, bg: 'white' });
  resizeViewport();
  newDocument(last.w, last.h, last.bg === 'transparent' ? null : '#ffffff', 'dibujo');
  setTool('brush');
  updateColorUI(); renderSwatches();
  checkAutosave();
})();
</script>
