  function editEnter() { editClick(lastMouseX, lastMouseY); }

  // ── Copy / Paste ──
  function copySelection() {
    const sel = selectedObjects.slice();
    if (!sel.length) { statusCoordsEl.textContent = 'Selecciona algo para copiar.'; return; }
    const ids = new Set();
    sel.forEach(o => { if (o.type === 'line' || o.type === 'polyface') { o.params.nodeIds.forEach(i => ids.add(i)); (o.params.topNodeIds || []).forEach(i => ids.add(i)); } });
    const box = selectionBox();
    clipboard = {
      nodes: Array.from(ids).map(id => ({ ...nodes.get(id) })),
      objects: sel.map(o => ({ type: o.type, params: JSON.parse(JSON.stringify(o.params)), height: o.height })),
      anchor: new THREE.Vector3((box.min.x + box.max.x) / 2, box.min.y, (box.min.z + box.max.z) / 2),
    };
    statusCoordsEl.textContent = 'Copiado: ' + sel.length + ' objeto(s). Ctrl+V para pegar.';
  }

  function instantiateClipboard() {
    const idMap = new Map();
    clipboard.nodes.forEach(n => idMap.set(n.id, createNode(n).id));
    const curveMap = new Map(); let nc = nextCurveId();
    return clipboard.objects.map(d => {
      const p = JSON.parse(JSON.stringify(d.params));
      if (p.nodeIds) p.nodeIds = p.nodeIds.map(i => idMap.get(i));
      if (p.topNodeIds) p.topNodeIds = p.topNodeIds.map(i => idMap.get(i));
      if (p.curveId) { if (!curveMap.has(p.curveId)) curveMap.set(p.curveId, nc++); p.curveId = curveMap.get(p.curveId); }
      return addObject(d.type, p, d.height);
    });
  }

  function startPaste(inPlace) {
    if (!clipboard) { statusCoordsEl.textContent = 'No hay nada copiado.'; return; }
    setTool('paste'); // also cancels any draw in progress
    const snapshot = snapshotState();
    const objs = instantiateClipboard();
    setSelection(objs);
    if (inPlace) {
      undoStack.push(snapshot); if (undoStack.length > UNDO_LIMIT) undoStack.shift(); redoStack = []; updateUndoRedoButtons();
      setTool('select');
      setSelection(objs);
      return;
    }
    const ids = new Set();
    objs.forEach(o => { if (o.type === 'line' || o.type === 'polyface') { o.params.nodeIds.forEach(i => ids.add(i)); (o.params.topNodeIds || []).forEach(i => ids.add(i)); } });
    pasteState = {
      objs, snapshot,
      baseline: objs.map(o => ({ params: JSON.parse(JSON.stringify(o.params)), height: o.height, type: o.type })),
      nodeBase: Array.from(ids).map(id => ({ id, pos: nodePos(id) })),
    };
    movePaste();
  }

  function movePaste() {
    if (!pasteState) return;
    const sp = resolveStartPoint(lastMouseX, lastMouseY);
    const pt = sp ? sp.point : clipboard.anchor.clone();
    if (sp && sp.snapped) showSnapMarker(sp.point, snapColorFor(sp.kind), sp.kind); else hideSnapMarker();
    pasteState.objs.forEach((o, i) => { o.params = JSON.parse(JSON.stringify(pasteState.baseline[i].params)); o.height = pasteState.baseline[i].height; });
    pasteState.nodeBase.forEach(({ id, pos }) => setNodePos(id, pos));
    const d = pt.clone().sub(clipboard.anchor);
    applyMatrixToObjects(pasteState.objs, new THREE.Matrix4().makeTranslation(d.x, d.y, d.z));
    setSelection(pasteState.objs.slice());
  }

  function commitPaste(clientX, clientY) {
    if (!pasteState) return;
    lastMouseX = clientX; lastMouseY = clientY;
    movePaste();
    const { snapshot, objs } = pasteState;
    pasteState = null;
    undoStack.push(snapshot); if (undoStack.length > UNDO_LIMIT) undoStack.shift(); redoStack = []; updateUndoRedoButtons();
    setTool('select');
    setSelection(objs);
  }
  function abortPaste() {
    if (!pasteState) return;
    const snap = pasteState.snapshot;
    pasteState = null;
    restoreState(snap);
  }


  // ── Offset (flat faces) and Fillet (rounded corners) ──
  let offFace = null;     // the flat face being offset
  let filletSel = null;   // the corner chosen for the fillet
  const OFFSET_LIFT = 0.004;

  function rayPlanePoint(clientX, clientY, normal, point) {
    const rect = dom.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal.clone().normalize(), point);
    const pt = new THREE.Vector3();
    return raycaster.ray.intersectPlane(plane, pt) ? pt : null;
  }

  function polyArea2D(pts) { let a = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; }
  function pointInPoly2D(q, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a[1] > q[1]) !== (b[1] > q[1]) && q[0] < (b[0] - a[0]) * (q[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
    }
    return inside;
  }
  function distSeg2D(q, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
    let t = l2 < 1e-12 ? 0 : ((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(q[0] - (a[0] + t * dx), q[1] - (a[1] + t * dy));
  }
  // Miter offset of a simple polygon by d (positive = outward, negative = inward).
  function offsetPolygon2D(pts, d) {
    const n = pts.length, sgn = polyArea2D(pts) >= 0 ? 1 : -1, lines = [];
    for (let i = 0; i < n; i++) {

      const ex = q[0] - p[0], ey = q[1] - p[1], len = Math.hypot(ex, ey) || 1;
      lines.push({ p: [p[0] + sgn * ey / len * d, p[1] - sgn * ex / len * d], e: [ex / len, ey / len] });

    const out = [];
    for (let i = 0; i < n; i++) {
      const a = lines[(i - 1 + n) % n], b = lines[i];
      const den = a.e[0] * b.e[1] - a.e[1] * b.e[0];
      if (Math.abs(den) < 1e-9) { out.push(b.p.slice()); continue; }
      const t = ((b.p[0] - a.p[0]) * b.e[1] - (b.p[1] - a.p[1]) * b.e[0]) / den;
      out.push([a.p[0] + t * a.e[0], a.p[1] + t * a.e[1]]);
    }

  }

  function faceOffsetInfo(o) {
    if (!o || o.height > 0) return null;
    if (o.type === 'circle') {
      const y = o.params.baseY || 0;
      return { kind: 'circle', orientation: 'xz', base: y, c2: [o.params.cx, o.params.cz], r: o.params.radius, y };
    }
    if (o.type === 'rect') {
      const { x1, z1, x2, z2 } = o.params, y = o.params.baseY || 0;
      const minx = Math.min(x1, x2), maxx = Math.max(x1, x2), minz = Math.min(z1, z2), maxz = Math.max(z1, z2);
      return { kind: 'rect', orientation: 'xz', base: y, y, bounds: [minx, minz, maxx, maxz], pts: [[minx, minz], [maxx, minz], [maxx, maxz], [minx, maxz]] };
    }
    if (o.type === 'polyface') {
      const orientation = o.params.orientation || 'xz';
      return { kind: 'poly', orientation, base: o.params.base || 0, pts: polyfacePoints2D(o) };
    }
    return null;
  }

  function computeOffsetStep(clientX, clientY) {
    const info = faceOffsetInfo(offFace);
    if (!info) return null;
    const b = POLYFACE_BASES[info.orientation] || POLYFACE_BASES.xz;
    const planePt = b.z.clone().multiplyScalar(info.base);
    const q3 = rayPlanePoint(clientX, clientY, b.z, planePt) || planePt;
    const [qu, qv] = polyfaceTo2D(info.orientation, q3);

    if (info.kind === 'circle') d = Math.hypot(qu - info.c2[0], qv - info.c2[1]) - info.r;
    else {

    const nums = typedNums();

      if (nx2 - nx1 > 1e-3 && nz2 - nz1 > 1e-3) {

  function commitFaceOffset(clientX, clientY) {

  // ── Fillet ──
  function filletCandidate(nodeId) {
    const lines = objects.filter(o => o.type === 'line' && o.params.nodeIds.includes(nodeId));
    if (lines.length !== 2) return null;
    // Only plain flat faces / loose lines: a solid's edges are tied to its extrusion.
    if (objects.some(o => o.type === 'polyface' && ((o.params.topNodeIds && (o.params.topNodeIds.includes(nodeId) || o.params.nodeIds.includes(nodeId))) || (o.params.nodeIds.includes(nodeId) && o.height > 0)))) return null;

    const other = l => l.params.nodeIds[0] === nodeId ? l.params.nodeIds[1] : l.params.nodeIds[0];
    const N = nodePos(nodeId), A = nodePos(other(l1)), B = nodePos(other(l2));
    const a = A.clone().sub(N), b = B.clone().sub(N);

    if (la < 1e-6 || lb < 1e-6) return null;

  function computeFilletStep(clientX, clientY) {
    const c = filletSel;

    const half = Math.tan(c.phi / 2);
    const tmax = Math.min(c.la, c.lb) * 0.98;
    let t = q.distanceTo(c.N);
    const nums = typedNums();
    if (nums.length) t = Math.abs(nums[0]) / half;

    const r = t * half;
    const T1 = c.N.clone().addScaledVector(c.a, t), T2 = c.N.clone().addScaledVector(c.b, t);

    replaceNode(c.l1, ids[0]); replaceNode(c.l2, ids[ids.length - 1]);

    for (let i = 0; i < ids.length - 1; i++) addObject('line', { nodeIds: [ids[i], ids[i + 1]], curveId });

  dom.addEventListener('contextmenu', e => e.preventDefault());

  dom.addEventListener('pointerdown', (e) => {

  document.getElementById('btnInvertSel').addEventListener('click', invertSelection);
  document.getElementById('btnFlipX').addEventListener('click', () => flipSelection('x'));
  document.getElementById('btnFlipZ').addEventListener('click', () => flipSelection('z'));
  document.getElementById('btnFlipY').addEventListener('click', () => flipSelection('y'));

  function doNew() {
    if (objects.length && !confirm('¿Descartar el dibujo actual y empezar uno nuevo?')) return;
    if (objects.length) pushUndo();
    clearAll();
  }

  function serialize() {
    return JSON.stringify({
      app: 'porticad-modelador-3d', version: 2,
      nodes: Array.from(nodes.values()),
      objects: objects.map(o => ({ type: o.type, params: o.params, height: o.height }))
    }, null, 2);
  }

  function downloadJSON(filename) {
    const blob = new Blob([serialize()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  let currentFilename = 'modelo.json';

  function doSave() { downloadJSON(currentFilename); }

  function doSaveAs() {
    const name = prompt('Nombre del archivo:', currentFilename.replace(/\.json$/, ''));
    if (!name) return;
    currentFilename = name.endsWith('.json') ? name : name + '.json';
    downloadJSON(currentFilename);
  }

  const fileInput = document.getElementById('fileInput');
  function doOpen() { fileInput.click(); }
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.objects)) throw new Error('formato inválido');
        if (objects.length) pushUndo();
        clearAll();
        // Nodes must exist before any line/polyface tries to resolve its nodeIds via meshFor.
        if (Array.isArray(data.nodes)) {
          data.nodes.forEach(n => {
            nodes.set(n.id, { id: n.id, x: n.x, y: n.y, z: n.z });
            if (n.id >= nextNodeId) nextNodeId = n.id + 1;
          });
        }
        data.objects.forEach(o => addObject(o.type, o.params, o.height || 0));
        currentFilename = file.name;
      } catch (err) {
        alert('No se pudo abrir el archivo: ' + err.message);
      }
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  document.getElementById('btnNew').addEventListener('click', doNew);
  document.getElementById('btnOpen').addEventListener('click', doOpen);
  document.getElementById('btnSave').addEventListener('click', doSave);
  document.getElementById('btnSaveAs').addEventListener('click', doSaveAs);
  document.getElementById('btnClearGuides').addEventListener('click', () => {
    const guides = objects.filter(o => o.type === 'guide');
    if (!guides.length) return;
    pushUndo();
    guides.forEach(o => removeObject(o));
  });
  btnUndo.addEventListener('click', doUndo);
  btnRedo.addEventListener('click', doRedo);

  // ───────────────────────── Render loop ─────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  setTool('select');
  updateUndoRedoButtons();
})();
</script>
</body>
</html>
