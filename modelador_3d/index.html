        const hit = pickObject(e.clientX, e.clientY);
        if (hit && (hit.type === 'line' || hit.type === 'guide')) {
          offsetSourceObj = hit;
          [offsetBaseA, offsetBaseB] = lineEndpoints(hit);
          typedValue = '';
          return;
        }
        const raw = groundPoint(e.clientX, e.clientY);
        if (!raw) return;
        const geomSnap = resolveGeometrySnap(raw, e.clientX, e.clientY);
        guideChainStart = (geomSnap ? geomSnap.point : raw).clone();
        typedValue = '';
      } else {
        const finalPt = lastGuideEndPoint ? lastGuideEndPoint.clone() : resolveDirectedEndpoint(guideChainStart, e.clientX, e.clientY).point;
        commitGuideSegment(finalPt);
      }
      return;
    }

    if (currentTool === 'rect') {
      const p = groundPoint(e.clientX, e.clientY);
      if (!p) return;
      if (drawStage === 0) {
        drawStart = p.clone();
        drawStage = 1;
      } else {
        pushUndo();
        addObject('rect', { x1: drawStart.x, z1: drawStart.z, x2: p.x, z2: p.z }, 0);
        cancelDraw();
      }
      return;
    }

    if (currentTool === 'circle') {
      const p = groundPoint(e.clientX, e.clientY);
      if (!p) return;
      if (drawStage === 0) {
        drawStart = p.clone();
        drawStage = 1;
      } else {
        const r = drawStart.distanceTo(p);
        pushUndo();
        addObject('circle', { cx: drawStart.x, cz: drawStart.z, radius: r }, 0);
        cancelDraw();
      }
      return;
    }

    if (currentTool === 'extrude') {
      if (extrudeObj) {
        // Second click: confirm and release — the object already reflects the cursor's
        // current position from the last pointermove, so finishing just stops tracking.
        endExtrudeDrag();
        return;
      }
      const hit = pickObjectWithFace(e.clientX, e.clientY);
      if (!hit || hit.obj.type === 'line' || hit.obj.type === 'guide') return;
      const faceKind = determineFace(hit.obj, hit.point);
      const wallMatch = /^wall(\d+)$/.exec(faceKind);
      pendingUndoSnapshot = snapshotState();
      extrudeObj = hit.obj;
      extrudeFaceKind = faceKind;
      extrudeHitPoint = hit.point.clone();
      extrudeSnapshotHeight = hit.obj.height;
      extrudeSnapshotParams = JSON.parse(JSON.stringify(hit.obj.params));
      typedValue = '';
      if (wallMatch) {
        extrudeWallIndex = parseInt(wallMatch[1], 10);
        extrudeBasePoints = polyfacePoints2D(hit.obj);
        extrudeNodeSnapshot = snapshotPolyfaceNodes(hit.obj);
        const [nu, nv] = polygonEdgeNormal(extrudeBasePoints, extrudeWallIndex);
        extrudeWorldNormal = polyface2DDirTo3D(hit.obj.params.orientation || 'xz', nu, nv);
      } else {
        extrudeWallIndex = null;
        extrudeBasePoints = null;
        extrudeNodeSnapshot = (hit.obj.type === 'polyface' && hit.obj.params.topNodeIds) ? snapshotPolyfaceNodes(hit.obj, true) : null;
        const info = faceInfo(hit.obj, faceKind);
        extrudeField = info.field;
        extrudeSign = info.sign;
        extrudeBaseValue = info.base;
        extrudeWorldNormal = worldNormalForFace(hit.obj, faceKind, hit.point);
      }
      controls.enabled = false;
      return;
    }

    if (currentTool === 'move') {
      // Priority 1: grab a shared node directly (by screen proximity, not raycast) — moving
      // it cascades to every line/face that references it, with no per-object special case.
      const nodeId = findNearestNode(e.clientX, e.clientY);
      if (nodeId !== null) {
        pendingUndoSnapshot = snapshotState();
        moveNodeId = nodeId;
        moveNodeOriginalPos = nodePos(nodeId).clone();
        moveAnchor = nodePos(nodeId);
        controls.enabled = false;
        return;
      }
      const hit = pickObjectWithFace(e.clientX, e.clientY);
      if (!hit) return;
      pendingUndoSnapshot = snapshotState();
      moveObj = hit.obj;
      moveAnchor = hit.point.clone();
      if (moveObj.type === 'line' || moveObj.type === 'polyface') {
        // Priority 2: grabbed the body of an edge/face away from any single node — translate
        // all of its own nodes together (still cascades to anything else sharing them).
        let ids = moveObj.params.nodeIds.slice();
        if (moveObj.type === 'polyface' && moveObj.params.topNodeIds) ids = ids.concat(moveObj.params.topNodeIds);
        moveNodeBase = ids.map(id => ({ id, pos: nodePos(id) }));
      } else {
        // Priority 3: rect/circle/guide — untouched parametric translate.
        moveBaseParams = JSON.parse(JSON.stringify(moveObj.params));
      }
      controls.enabled = false;
      return;
    }
  });

  dom.addEventListener('pointermove', (e) => {
    lastMouseX = e.clientX; lastMouseY = e.clientY;

    // coord readout
    const p = groundPoint(e.clientX, e.clientY);
    if (p) statusCoordsEl.textContent = 'x: ' + p.x.toFixed(2) + '  z: ' + p.z.toFixed(2);

    if (currentTool === 'select' && selectDragStart) {
      const dx = e.clientX - selectDragStart.x, dy = e.clientY - selectDragStart.y;
      if (!boxSelectActive && Math.hypot(dx, dy) > BOX_SELECT_THRESHOLD_PX) boxSelectActive = true;
      if (boxSelectActive) updateMarquee(selectDragStart.x, selectDragStart.y, e.clientX, e.clientY);
      return;
    }

    if (currentTool === 'line' && drawStage === 0 && p) {
      const geomSnap = resolveGeometrySnap(p, e.clientX, e.clientY);
      if (geomSnap) {
        const snapColor = geomSnap.kind === 'endpoint' ? SNAP_COLOR_ENDPOINT : geomSnap.kind === 'midpoint' ? SNAP_COLOR_MIDPOINT : SNAP_COLOR_ONEDGE;
        showSnapMarker(geomSnap.point, snapColor);
        statusCoordsEl.textContent += '  · ' + SNAP_LABEL[geomSnap.kind];
      } else {
        hideSnapMarker();
      }
    } else if (currentTool === 'line' && drawStage === 1 && p) {
      clearPreview();
      const resolved = resolveLineEndpoint(e.clientX, e.clientY);
      if (resolved.snapped && !typedValue) showSnapMarker(resolved.point, resolved.color); else hideSnapMarker();
      previewMesh = buildLineMesh(drawStart, resolved.point);
      previewMesh.traverse(n => { if (n.material && n.material.color) n.material.color.setHex(resolved.color); });
      scene.add(previewMesh);
      if (resolved.label && !typedValue) statusCoordsEl.textContent += '  · ' + resolved.label;
      if (typedValue) statusCoordsEl.textContent += '  → ' + typedValue + ' [Enter]';
      lastLineEndPoint = resolved.point.clone();
      lastLineEndNodeId = resolved.nodeId;
    } else if (currentTool === 'guide' && offsetSourceObj) {
      refreshOffsetPreview();
    } else if (currentTool === 'guide' && !guideChainStart && p) {
      const geomSnap = resolveGeometrySnap(p, e.clientX, e.clientY);
      if (geomSnap) {
        const snapColor = geomSnap.kind === 'endpoint' ? SNAP_COLOR_ENDPOINT : geomSnap.kind === 'midpoint' ? SNAP_COLOR_MIDPOINT : SNAP_COLOR_ONEDGE;
        showSnapMarker(geomSnap.point, snapColor);
        statusCoordsEl.textContent += '  · ' + SNAP_LABEL[geomSnap.kind];
      } else {
        hideSnapMarker();
      }
    } else if (currentTool === 'guide' && guideChainStart) {
      refreshGuidePreview();
    } else if ((currentTool === 'rect' || currentTool === 'circle') && drawStage === 1 && p) {
      clearPreview();
      const mat = new THREE.MeshBasicMaterial({ color: AXIS_COLOR_NONE, wireframe: true, transparent: true, opacity: 0.8 });
      if (currentTool === 'rect') {
        previewMesh = buildRectMesh(drawStart.x, drawStart.z, p.x, p.z, 0);
      } else {
        previewMesh = buildCircleMesh(drawStart.x, drawStart.z, drawStart.distanceTo(p), 0);
      }
      previewMesh.traverse(n => { if (n.material) n.material = mat; });
      scene.add(previewMesh);
    }

    if (currentTool === 'extrude') {
      if (extrudeObj) {
        refreshExtrudePreview(e.clientX, e.clientY);
      } else {
        const hit = pickObjectWithFace(e.clientX, e.clientY);
        if (hit && hit.obj.type !== 'line' && hit.obj.type !== 'guide') {
          showFaceHighlight(buildFaceHighlightMesh(hit.obj, determineFace(hit.obj, hit.point)));
        } else {
          hideFaceHighlight();
        }
      }
    }

    if (currentTool === 'move' && (moveNodeId !== null || moveObj)) {
      const axisSnap = resolveAxisSnap(moveAnchor, e.clientX, e.clientY);
      let current;
      if (axisSnap) {
        current = axisSnap.point;
        statusCoordsEl.textContent += '  · ' + axisSnap.label;
      } else {
        current = planePoint(e.clientX, e.clientY, moveAnchor.y) || moveAnchor;
      }
      if (moveNodeId !== null) {
        // moveAnchor was set to this node's own original position, so the new position is
        // simply wherever the cursor now resolves to along the drag plane/axis-lock.
        setNodePos(moveNodeId, current);
        nodeMoved(moveNodeId);
      } else if (moveNodeBase) {
        const delta = current.clone().sub(moveAnchor);
        moveNodeBase.forEach(({ id, pos }) => setNodePos(id, pos.clone().add(delta)));
        moveNodeBase.forEach(({ id }) => nodeMoved(id));
        selectObject(moveObj);
      } else {
        const delta = current.clone().sub(moveAnchor);
        moveObj.params = translatedParams(moveObj.type, moveBaseParams, delta.x, delta.y, delta.z);
        rebuildMesh(moveObj);
        selectObject(moveObj);
      }
    }
  });

  window.addEventListener('pointerup', (e) => {
    // Extrude no longer ends on mouseup — it's a click-to-grab / click-again-to-finish
    // gesture now (see the 'extrude' branch in pointerdown), so a plain click can start it
    // without the immediate mouseup instantly ending the grab.

    if (moveObj || moveNodeId !== null) {
      // A plain mouseup commits the drag as-is (unlike Escape, which reverts) — just stop
      // tracking, the node(s)/params are already left wherever the last pointermove put them.
      commitPendingUndo();
      moveObj = null;
      moveAnchor = null;
      moveBaseParams = null;
      moveNodeId = null;
      moveNodeOriginalPos = null;
      moveNodeBase = null;
      controls.enabled = true;
    }

    if (currentTool === 'select' && selectDragStart) {
      if (boxSelectActive) {
        finalizeBoxSelect(selectDragStart.x, selectDragStart.y, e.clientX, e.clientY);
        hideMarquee();
      } else {
        selectObject(pickObject(e.clientX, e.clientY));
      }
      selectDragStart = null;
      boxSelectActive = false;
    }
  });

  function isTypingTarget() {
    const tag = document.activeElement && document.activeElement.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA';
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { cancelDraw(); selectObject(null); }

    // VCB numeric entry: while placing a line's next point, or mid push/pull with Extrude,
    // digits/Enter set an exact value instead of falling through to delete-selection etc.
    const vcbLine = currentTool === 'line' && drawStage === 1;
    const vcbGuide = currentTool === 'guide' && !!guideChainStart;
    const vcbOffset = currentTool === 'guide' && !!offsetSourceObj;
    const vcbExtrude = currentTool === 'extrude' && !!extrudeObj;
    if ((vcbLine || vcbGuide || vcbOffset || vcbExtrude) && !isTypingTarget()) {
      if (/^[0-9.]$/.test(e.key) || (e.key === '-' && typedValue === '')) {
        typedValue += e.key;
        if (vcbLine) refreshLinePreview();
        else if (vcbGuide) refreshGuidePreview();
        else if (vcbOffset) refreshOffsetPreview();
        else refreshExtrudePreview(lastMouseX, lastMouseY);
        e.preventDefault();
        return;
      }
      if (e.key === 'Backspace' && typedValue) {
        typedValue = typedValue.slice(0, -1);
        if (vcbLine) refreshLinePreview();
        else if (vcbGuide) refreshGuidePreview();
        else if (vcbOffset) refreshOffsetPreview();
        else refreshExtrudePreview(lastMouseX, lastMouseY);
        e.preventDefault();
        return;
      }
      if (e.key === 'Enter') {
        if (vcbLine) {
          if (typedValue && lastLineEndPoint) commitLineSegment(lastLineEndPoint.clone(), lastLineEndNodeId);
        } else if (vcbGuide) {
          if (typedValue && lastGuideEndPoint) commitGuideSegment(lastGuideEndPoint.clone());
        } else if (vcbOffset) {
          if (typedValue) commitOffset();
        } else if (typedValue) {
          endExtrudeDrag();
        }
        e.preventDefault();
        return;
      }
    }

    if ((e.key === 'Delete' || e.key === 'Backspace') && !isTypingTarget()) {
      if (selectedObjects.length) {
        pushUndo();
        selectedObjects.slice().forEach(o => removeObject(o));
      }
    }
    if (e.ctrlKey && e.key.toLowerCase() === 'n') { e.preventDefault(); doNew(); }
    if (e.ctrlKey && e.key.toLowerCase() === 'o') { e.preventDefault(); doOpen(); }
    if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); doSave(); }
    if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); }
    if ((e.ctrlKey && e.key.toLowerCase() === 'y') || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'z')) { e.preventDefault(); doRedo(); }
    if (!e.ctrlKey && !e.metaKey && !isTypingTarget()) {
      const map = { s:'select', l:'line', r:'rect', c:'circle', e:'erase', p:'extrude', m:'move', g:'guide' };
      const t = map[e.key.toLowerCase()];
      if (t) setTool(t);
    }
  });

  // ───────────────────────── File menu ─────────────────────────
  const fileMenuBtn = document.getElementById('fileMenuBtn');
  const fileMenuDropdown = document.getElementById('fileMenuDropdown');
  fileMenuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    fileMenuDropdown.classList.toggle('show');
    fileMenuBtn.classList.toggle('open');
  });
  document.addEventListener('click', () => {
    fileMenuDropdown.classList.remove('show');
    fileMenuBtn.classList.remove('open');
  });

  function doNew() {
    if (objects.length && !confirm('¿Descartar el dibujo actual y empezar uno nuevo?')) return;
    if (objects.length) pushUndo();
    clearAll();
  }

  function serialize() {
    return JSON.stringify({
      app: 'porticad-modelador-3d', version: 2,
      nodes: Array.from(nodes.values()),
      objects: objects.map(o => ({ type: o.type, params: o.params, height: o.height }))
    }, null, 2);
  }

  function downloadJSON(filename) {
    const blob = new Blob([serialize()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  let currentFilename = 'modelo.json';

  function doSave() { downloadJSON(currentFilename); }

  function doSaveAs() {
    const name = prompt('Nombre del archivo:', currentFilename.replace(/\.json$/, ''));
    if (!name) return;
    currentFilename = name.endsWith('.json') ? name : name + '.json';
    downloadJSON(currentFilename);
  }

  const fileInput = document.getElementById('fileInput');
  function doOpen() { fileInput.click(); }
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.objects)) throw new Error('formato inválido');
        if (objects.length) pushUndo();
        clearAll();
        // Nodes must exist before any line/polyface tries to resolve its nodeIds via meshFor.
        if (Array.isArray(data.nodes)) {
          data.nodes.forEach(n => {
            nodes.set(n.id, { id: n.id, x: n.x, y: n.y, z: n.z });
            if (n.id >= nextNodeId) nextNodeId = n.id + 1;
          });
        }
        data.objects.forEach(o => addObject(o.type, o.params, o.height || 0));
        currentFilename = file.name;
      } catch (err) {
        alert('No se pudo abrir el archivo: ' + err.message);
      }
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  document.getElementById('btnNew').addEventListener('click', doNew);
  document.getElementById('btnOpen').addEventListener('click', doOpen);
  document.getElementById('btnSave').addEventListener('click', doSave);
  document.getElementById('btnSaveAs').addEventListener('click', doSaveAs);
  document.getElementById('btnClearGuides').addEventListener('click', () => {
    const guides = objects.filter(o => o.type === 'guide');
    if (!guides.length) return;
    pushUndo();
    guides.forEach(o => removeObject(o));
  });
  btnUndo.addEventListener('click', doUndo);
  btnRedo.addEventListener('click', doRedo);

  // ───────────────────────── Render loop ─────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  setTool('select');
  updateUndoRedoButtons();
})();
</script>
</body>
</html>
