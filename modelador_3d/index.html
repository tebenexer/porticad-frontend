<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>CrokisCAD 3D — PortiCAD Multi-Tools</title>
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="shortcut icon" href="/favicon.png" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Top bar ── */
  .topbar {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    flex-shrink: 0;
    z-index: 300;
    position: relative;
  }
  .topbar-logo { font-size: 16px; font-weight: 700; color: #58a6ff; text-decoration: none; }
  .topbar-sep  { color: #30363d; font-size: 18px; }
  .topbar-crumb { font-size: 14px; color: #8b949e; display: flex; align-items: center; gap: 6px; }
  .topbar-title { font-size: 15px; font-weight: 600; color: #e6edf3; }
  .badge { background: #f0b42922; border: 1px solid #f0b42955; color: #f0b429;
           font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 20px; margin-left: 6px; }

  /* ── Menu bar ── */
  .menubar {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    height: 34px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 2px;
    flex-shrink: 0;
    position: relative;
    z-index: 250;
  }
  .menu-item { position: relative; }
  .menu-btn {
    background: none; border: none; color: #c9d1d9; font-size: 13px;
    padding: 6px 12px; border-radius: 4px; cursor: pointer;
  }
  .menu-btn:hover, .menu-btn.open { background: #21262d; color: #e6edf3; }
  .menu-dropdown {
    position: absolute; top: 100%; left: 0; margin-top: 2px;
    background: #161b22; border: 1px solid #30363d; border-radius: 6px;
    min-width: 190px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    display: none; flex-direction: column; padding: 4px; z-index: 260;
  }
  .menu-dropdown.show { display: flex; }
  .menu-dropdown button {
    background: none; border: none; color: #e6edf3; text-align: left;
    padding: 7px 10px; border-radius: 4px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .menu-dropdown button:hover { background: #1f6feb22; }
  .menu-dropdown .key { color: #8b949e; font-size: 11px; }
  .menubar-sep { width: 1px; height: 20px; background: #30363d; margin: 0 4px; }
  .menubar-btn {
    background: none; border: none; color: #c9d1d9; padding: 6px 8px; border-radius: 4px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .menubar-btn:hover:not(:disabled) { background: #21262d; color: #e6edf3; }
  .menubar-btn:disabled { color: #484f58; cursor: default; }

  /* ── Layout ── */
  .workspace { flex: 1; display: flex; min-height: 0; }

  .toolbar {
    width: 52px; background: #161b22; border-right: 1px solid #30363d;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 0; flex-shrink: 0; overflow-y: auto;
  }
  .tool-btn {
    width: 38px; height: 38px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: #8b949e; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
  }
  .tool-btn:hover { background: #21262d; color: #e6edf3; }
  .tool-btn.active { background: #1f6feb22; border-color: #1f6feb55; color: #58a6ff; }
  .tool-sep { width: 26px; height: 1px; background: #30363d; margin: 4px 0; }

  .viewport { position: relative; flex: 1; min-width: 0; background: #0d1117; }
  .viewport canvas { display: block; width: 100%; height: 100%; }

  .hint {
    position: absolute; top: 10px; left: 10px; background: #161b22ee;
    border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px;
    font-size: 12px; color: #c9d1d9; max-width: 320px; pointer-events: none;
  }
  .hint b { color: #58a6ff; }

  .marquee {
    position: absolute; border: 1px solid #58a6ff; background: #58a6ff22;
    pointer-events: none; display: none; z-index: 50;
  }

  .statusbar {
    height: 26px; background: #161b22; border-top: 1px solid #30363d;
    display: flex; align-items: center; padding: 0 12px; gap: 16px;
    font-size: 11px; color: #8b949e; flex-shrink: 0;
  }
  .statusbar .tool-name { color: #58a6ff; font-weight: 600; }

  /* ── Caja de valores (VCB) + etiqueta de inferencia ── */
  .vcb {
    position: absolute; right: 14px; bottom: 14px; display: none; align-items: stretch;
    background: #161b22f2; border: 1px solid #30363d; border-radius: 8px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,.45); pointer-events: none; z-index: 40;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .vcb-label { background: #1f6feb22; color: #58a6ff; font-size: 11px; font-weight: 700;
               letter-spacing: .04em; text-transform: uppercase; padding: 8px 10px; display: flex; align-items: center; }
  .vcb-val { color: #e6edf3; font-size: 15px; font-weight: 600; padding: 7px 12px; min-width: 120px; text-align: right; }
  .vcb-val.typing { color: #f0b429; }
  .vcb-val.typing::after { content: '\23CE'; margin-left: 6px; color: #8b949e; font-weight: 400; }
  .snap-tip {
    position: absolute; display: none; z-index: 45; pointer-events: none;
    background: #0d1117ee; border: 1px solid #30363d; border-left-width: 3px; border-radius: 4px;
    padding: 3px 8px; font-size: 11px; font-weight: 600; color: #e6edf3; white-space: nowrap;
  }
  .viewport.drawing { cursor: crosshair; }

  /* ── Panel Organizar ── */
  .panel {
    position: absolute; top: 10px; right: 10px; width: 262px; max-height: calc(100% - 20px);
    background: #161b22f2; border: 1px solid #30363d; border-radius: 8px; z-index: 30;
    display: flex; flex-direction: column; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .p-head { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; cursor: pointer; font-weight: 700; color: #c9d1d9; letter-spacing: .02em; }
  .p-tabs { display: flex; border-top: 1px solid #30363d; border-bottom: 1px solid #30363d; }
  .p-tab { flex: 1; background: none; border: none; color: #8b949e; padding: 6px 2px; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; }
  .p-tab:hover { color: #e6edf3; }
  .p-tab.on { color: #58a6ff; border-bottom-color: #58a6ff; }
  .p-body { padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .p-row { display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 5px; border: 1px solid transparent; }
  .p-row.cur { background: #1f6feb22; border-color: #1f6feb55; }
  .p-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; color: #e6edf3; padding: 3px 2px; }
  .p-name i { color: #f0b429; font-style: normal; }
  .p-n { color: #8b949e; font-size: 11px; min-width: 18px; text-align: right; }
  .p-ico { width: 22px; height: 22px; background: none; border: none; color: #8b949e; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 14px; }
  .p-ico:hover { background: #21262d; color: #e6edf3; }
  .p-mini { background: #21262d; border: 1px solid #30363d; color: #e6edf3; font-size: 11px; padding: 2px 7px; border-radius: 4px; cursor: pointer; }
  .p-mini:hover { border-color: #58a6ff; }
  .p-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .p-btns button, .p-grid button, .p-seg button { background: #21262d; border: 1px solid #30363d; color: #e6edf3; font-size: 12px; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
  .p-btns button:hover, .p-grid button:hover, .p-seg button:hover { border-color: #58a6ff; }
  .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .p-seg { display: flex; gap: 4px; } .p-seg button { flex: 1; }
  .p-grid button.on, .p-seg button.on { background: #1f6feb33; border-color: #1f6feb; color: #79c0ff; }
  .p-sub { margin-top: 8px; color: #8b949e; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .p-note { color: #8b949e; font-size: 11px; line-height: 1.4; padding: 2px 2px; }
  .p-chk { display: flex; align-items: center; gap: 6px; color: #c9d1d9; padding: 2px 0; }
  .p-slide { display: flex; align-items: center; gap: 8px; } .p-slide input { flex: 1; } .p-slide span { min-width: 44px; text-align: right; font-family: ui-monospace, Menlo, monospace; color: #e6edf3; }
  .group-banner {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 35;
    display: none; align-items: center; gap: 10px; background: #1f6feb; color: #fff;
    padding: 5px 6px 5px 12px; border-radius: 20px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .group-banner button { background: #ffffff33; border: none; color: #fff; border-radius: 14px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .group-banner button:hover { background: #ffffff55; }

  input[type=file] { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="/">PortiCAD</a>
  <span class="topbar-sep">›</span>
  <div class="topbar-crumb">
    <span>Multi-Tools</span><span>›</span>
    <span class="topbar-title">CrokisCAD 3D</span>
  </div>
  <span class="badge">🧪 Beta</span>
</div>

<div class="menubar">
  <div class="menu-item">
    <button class="menu-btn" id="fileMenuBtn">Archivo</button>
    <div class="menu-dropdown" id="fileMenuDropdown">
      <button id="btnNew">Nuevo <span class="key">Ctrl+N</span></button>
      <button id="btnOpen">Abrir… <span class="key">Ctrl+O</span></button>
      <button id="btnSave">Guardar <span class="key">Ctrl+S</span></button>
      <button id="btnSaveAs">Guardar como…</button>
      <button id="btnClearGuides">Limpiar guías</button>
    </div>
  </div>
  <div class="menu-item">
    <button class="menu-btn" id="editMenuBtn">Editar</button>
    <div class="menu-dropdown" id="editMenuDropdown">
      <button id="btnCopy">Copiar <span class="key">Ctrl+C</span></button>
      <button id="btnPaste">Pegar <span class="key">Ctrl+V</span></button>
      <button id="btnPasteInPlace">Pegar en el mismo lugar <span class="key">Ctrl+Alt+V</span></button>
      <div style="height:1px;background:#30363d;margin:4px 0"></div>
      <button id="btnSelectAll">Seleccionar todo <span class="key">Ctrl+A</span></button>
      <button id="btnInvertSel">Invertir selección</button>
      <div style="height:1px;background:#30363d;margin:4px 0"></div>
      <button id="btnFlipX">Voltear en X (rojo)</button>
      <button id="btnFlipZ">Voltear en Z (verde)</button>
      <button id="btnFlipY">Voltear en Y (azul)</button>
      <div style="height:1px;background:#30363d;margin:4px 0"></div>
      <button id="btnGroup">Agrupar <span class="key">Ctrl+G</span></button>
      <button id="btnExplode">Descomponer <span class="key">Ctrl+Mayús+G</span></button>
      <button id="btnMakeComp">Crear componente…</button>
      <button id="btnHideSel">Ocultar selección <span class="key">H</span></button>
      <button id="btnShowAll">Mostrar todo lo oculto <span class="key">Mayús+H</span></button>
    </div>
  </div>
  <div class="menubar-sep"></div>
  <button class="menubar-btn" id="btnUndo" title="Deshacer (Ctrl+Z)" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
  </button>
  <button class="menubar-btn" id="btnRedo" title="Rehacer (Ctrl+Y)" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg>
  </button>
</div>

<div class="workspace">
  <div class="toolbar" id="toolbar">
    <button class="tool-btn active" data-tool="select" title="Seleccionar (S)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3l7 17 2.5-7L20 10.5 4 3z"/></svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="line" title="Línea (L)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/><circle cx="4" cy="20" r="1.5" fill="currentColor"/><circle cx="20" cy="4" r="1.5" fill="currentColor"/></svg>
    </button>
    <button class="tool-btn" data-tool="rect" title="Rectángulo (R)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12"/></svg>
    </button>
    <button class="tool-btn" data-tool="rrect" title="Rectángulo rotado (T): borde + ancho">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="3 14 14 3 21 10 10 21"/></svg>
    </button>
    <button class="tool-btn" data-tool="circle" title="Círculo (C)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button class="tool-btn" data-tool="polygon" title="Polígono (O): escribe 8s + Enter para 8 lados">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 2.5 20.5 8.5 17.5 19 6.5 19 3.5 8.5"/></svg>
    </button>
    <button class="tool-btn" data-tool="arc2" title="Arco 2 puntos (A): inicio, fin, flecha">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18 Q12 4 20 18"/><circle cx="4" cy="18" r="1.4" fill="currentColor"/><circle cx="20" cy="18" r="1.4" fill="currentColor"/></svg>
    </button>
    <button class="tool-btn" data-tool="arc3" title="Arco 3 puntos (Q): inicio, punto del arco, fin">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18 C6 6 18 6 20 18"/><circle cx="4" cy="18" r="1.4" fill="currentColor"/><circle cx="12" cy="7.2" r="1.4" fill="currentColor"/><circle cx="20" cy="18" r="1.4" fill="currentColor"/></svg>
    </button>
    <button class="tool-btn" data-tool="freehand" title="Mano alzada (F): mantén presionado y dibuja">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-9 5 2 8-5s4 5 10-6"/></svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="erase" title="Borrador (E)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3l4 4L9 19H5v-4L17 3z"/><line x1="13" y1="7" x2="17" y2="11"/></svg>
    </button>
    <button class="tool-btn" data-tool="extrude" title="Extruir (P)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10"/><path d="M8 8l4-4 4 4"/><rect x="5" y="14" width="14" height="8"/></svg>
    </button>
    <button class="tool-btn" data-tool="move" title="Mover (M)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
    </button>
    <button class="tool-btn" data-tool="rotate" title="Rotar con transportador (W): centro, referencia, ángulo. Ctrl = copiar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
    <button class="tool-btn" data-tool="scale" title="Escalar (K): base, referencia, nuevo tamaño. Ctrl = copiar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="9" height="9" rx="1"/><path d="M12 12l9-9"/><polyline points="15 3 21 3 21 9"/></svg>
    </button>
    <button class="tool-btn" data-tool="offset" title="Desfase de una cara (D)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><rect x="8" y="8" width="8" height="8" rx="1" stroke-dasharray="2 2"/></svg>
    </button>
    <button class="tool-btn" data-tool="fillet" title="Empalme / redondear esquina (I)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4v9a7 7 0 0 0 7 7h9"/></svg>
    </button>
    <button class="tool-btn" data-tool="followme" title="Sígueme (U): barrer un perfil por una trayectoria">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20c0-8 5-8 9-8s9 0 9-8"/><ellipse cx="4" cy="17" rx="2.2" ry="3.6" transform="rotate(-20 4 17)"/><ellipse cx="20" cy="6.5" rx="2.2" ry="3.6" transform="rotate(-30 20 6.5)" stroke-dasharray="2 2"/></svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="guide" title="Cinta métrica / guía (G)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4" stroke-dasharray="3 3"/><circle cx="4" cy="20" r="1.5" fill="currentColor"/><circle cx="20" cy="4" r="1.5" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="viewport" id="viewport">
    <div class="hint" id="hint">Selecciona una herramienta para empezar.</div>
    <div class="marquee" id="marquee"></div>
    <div class="snap-tip" id="snapTip"></div>
    <div class="group-banner" id="groupBanner" style="display:none"><span>Editando: <b></b></span><button id="btnExitGroup">Cerrar grupo</button></div>
    <div class="vcb" id="vcb"><span class="vcb-label" id="vcbLabel">Longitud</span><span class="vcb-val" id="vcbVal">0.00</span></div>
  </div>
</div>

<div class="statusbar">
  <span>Herramienta: <span class="tool-name" id="statusTool">Seleccionar</span></span>
  <span id="statusCoords"></span>
  <span id="statusCount" style="margin-left:auto"></span>
</div>

<input type="file" id="fileInput" accept="application/json,.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  'use strict';

  // ───────────────────────── Scene setup ─────────────────────────
  const viewport = document.getElementById('viewport');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);

  const perspCam = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);
  perspCam.position.set(14, 12, 14);
  const orthoCam = new THREE.OrthographicCamera(-10, 10, 10, -10, -2000, 4000);
  let camera = perspCam;   // el activo (perspectiva o paralela)

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  viewport.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  // Left button is reserved for drawing tools; orbit/pan use middle/right.
  controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.PAN };

  scene.add(new THREE.HemisphereLight(0xffffff, 0x30363d, 1.0));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7);
  sun.position.set(20, 30, 10);
  scene.add(sun);

  function resize() {
    const w = viewport.clientWidth, h = viewport.clientHeight;
    perspCam.aspect = w / h;
    perspCam.updateProjectionMatrix();
    fitOrthoFrustum(w / h);
    renderer.setSize(w, h);
  }
  // Cámara paralela: el tamaño visible sale de la distancia al objetivo, igual que en perspectiva.
  let orthoRefDist = 22;   // distancia de referencia que fija el tamaño visible en modo paralelo
  function fitOrthoFrustum(aspect) {
    const halfH = orthoRefDist * Math.tan(THREE.MathUtils.degToRad(perspCam.fov / 2));
    orthoCam.left = -halfH * aspect; orthoCam.right = halfH * aspect;
    orthoCam.top = halfH; orthoCam.bottom = -halfH;
    orthoCam.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ───────────────────────── Grid + axes ─────────────────────────
  const GRID_SIZE = 40, GRID_DIV = 40;
  // Cuadrícula infinita: un plano enorme con shader. Las líneas se calculan por píxel, cambian de escala
  // (1, 10, 100…) según el zoom y se desvanecen hacia el horizonte, así siempre hay más malla al acercar,
  // alejar o desplazar la vista. Se dibuja primero y sin escribir profundidad: nunca compite con las caras.
  const gridUniforms = {
    uCam: { value: new THREE.Vector3() }, uScale: { value: 10 },
    uBg: { value: new THREE.Color(0x0d1117) }, uMinor: { value: new THREE.Color(0x1d232b) }, uMajor: { value: new THREE.Color(0x343c46) },
  };
  const grid = new THREE.Mesh(
    new THREE.PlaneGeometry(200000, 200000).rotateX(-Math.PI / 2),
    new THREE.ShaderMaterial({
      uniforms: gridUniforms, depthWrite: false, side: THREE.DoubleSide, extensions: { derivatives: true },
      vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
      fragmentShader: [
        'varying vec3 vW; uniform vec3 uCam; uniform float uScale; uniform vec3 uBg; uniform vec3 uMinor; uniform vec3 uMajor;',
        'float gl(vec2 p, float size){ vec2 q = p/size; vec2 fw = fwidth(q); vec2 g = abs(fract(q-0.5)-0.5)/max(fw,vec2(1e-6));',
        '  float l = 1.0 - min(min(g.x,g.y),1.0); float f = max(fw.x,fw.y); return l * (1.0 - smoothstep(0.2,0.5,f)); }',
        'void main(){',
        '  float L = log2(max(uScale,1e-4)*0.2)/log2(10.0); float e = floor(L); float f = L - e;',
        '  float s0 = pow(10.0,e);',
        '  float a0 = gl(vW.xz,s0)*(1.0-f); float a1 = gl(vW.xz,s0*10.0); float a2 = gl(vW.xz,s0*100.0)*f;',
        '  float fade = 1.0 - smoothstep(uScale*6.0, uScale*45.0, length(vW.xz-uCam.xz));',
        '  vec3 c = mix(uBg, uMinor, a0*fade); c = mix(c, uMajor, max(a1,a2)*fade*0.9);',
        '  gl_FragColor = vec4(c,1.0);',
        '}',
      ].join('\n'),
    })
  );
  grid.renderOrder = -2;
  grid.raycast = () => {};
  grid.frustumCulled = false;
  scene.add(grid);

  function makeAxisLine(dir, color) {
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0,0,0), dir.clone().multiplyScalar(dir.y ? 60 : 20000)
    ]);
    const mat = new THREE.LineBasicMaterial({ color, linewidth: 2, depthWrite: false });
    const line = new THREE.Line(geo, mat);
    line.renderOrder = -1;
    return line;
  }
  scene.add(makeAxisLine(new THREE.Vector3(1,0,0), 0xf85149)); // X - red
  scene.add(makeAxisLine(new THREE.Vector3(-1,0,0), 0xf85149));
  scene.add(makeAxisLine(new THREE.Vector3(0,0,1), 0x3fb950)); // Z - green
  scene.add(makeAxisLine(new THREE.Vector3(0,0,-1), 0x3fb950));
  scene.add(makeAxisLine(new THREE.Vector3(0,1,0), 0x58a6ff)); // Y - blue (up)

  const AXIS_COLOR_X = 0xf85149; // red
  const AXIS_COLOR_Z = 0x3fb950; // green
  const AXIS_COLOR_Y = 0x58a6ff; // blue
  const AXIS_COLOR_NONE = 0xf0b429; // amber (no lock)
  const AXIS_LOCK_PIXEL_RADIUS = 22;

  // Closest point on the infinite line (linePoint + t*lineDir) to the ray (rayOrigin + s*rayDir).
  function closestPointOnLineToRay(linePoint, lineDir, rayOrigin, rayDir) {
    const w0 = new THREE.Vector3().subVectors(linePoint, rayOrigin);
    const a = lineDir.dot(lineDir), b = lineDir.dot(rayDir), c = rayDir.dot(rayDir);
    const d = lineDir.dot(w0), e = rayDir.dot(w0);
    const denom = a * c - b * b;
    const t = Math.abs(denom) < 1e-9 ? 0 : (b * e - c * d) / denom;
    return linePoint.clone().addScaledVector(lineDir, t);
  }

  // Axis inference: while drawing/dragging from `anchor`, lock onto whichever
  // of the red/green/blue axes (through anchor) the cursor's 3D ray currently passes closest to
  // on screen. Works regardless of anchor's height, so it also catches the blue (vertical) axis.
  const AXIS_X_DIR = new THREE.Vector3(1, 0, 0), AXIS_Y_DIR = new THREE.Vector3(0, 1, 0), AXIS_Z_DIR = new THREE.Vector3(0, 0, 1);
  function resolveAxisSnap(anchor, clientX, clientY, horizontalOnly) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const rayOrigin = raycaster.ray.origin, rayDir = raycaster.ray.direction.clone().normalize();
    const axes = [
      { key: 'x', dir: AXIS_X_DIR, color: AXIS_COLOR_X, label: 'Eje rojo' },
      { key: 'z', dir: AXIS_Z_DIR, color: AXIS_COLOR_Z, label: 'Eje verde' },
      { key: 'y', dir: AXIS_Y_DIR, color: AXIS_COLOR_Y, label: 'Eje azul' },
    ];
    let best = null;
    axes.forEach(ax => {
      if (horizontalOnly && ax.key === 'y') return;
      const candidate = closestPointOnLineToRay(anchor, ax.dir, rayOrigin, rayDir);
      const d = screenDistToPoint(clientX, clientY, candidate);
      if (d <= AXIS_LOCK_PIXEL_RADIUS && (!best || d < best.d)) best = { point: candidate, axis: ax.key, color: ax.color, label: ax.label, d };
    });
    return best;
  }

  // ───────────────────────── Model data ─────────────────────────
  // objects[]: { id, type:'line'|'guide'|'rect'|'circle'|'polyface', params:{...}, height, mesh }
  // 'line' and 'polyface' vertices are shared NODES (see `nodes` below), so two lines (or a
  // line and a face) that meet at the same point are actually the same point — move it once
  // and everything referencing it updates. rect/circle/guide stay independent/parametric.
  let objects = [];
  let nextId = 1;
  let selectedObjects = [];

  // ── Organización: capas, grupos, componentes, escenas y estilo de vista ──
  // Cada objeto lleva obj.layer (id de capa), obj.hidden (oculto a mano) y obj.gid (id de grupo, 0 = suelto).
  let panelEl = null;
  let layers = [{ id: 0, name: 'Capa 0', visible: true }];
  let nextLayerId = 1;
  let currentLayer = 0;
  let groups = new Map();        // id -> { id, name, comp (id de componente | null), m (matriz 4x4: definición -> mundo) }
  let nextGroupId = 1;
  let components = new Map();    // id -> { id, name, nodes:[], objects:[] }  (definición en su propio espacio)
  let nextCompId = 1;
  let editingGroup = null;       // id del grupo abierto para edición (doble clic) o null
  let scenes = [];
  let nextSceneId = 1;
  let styleMode = 'shaded';      // shaded | hidden | xray | wire
  const FACE_TYPES = ['rect', 'circle', 'polyface', 'solid'];
  function layerById(id) { return layers.find(l => l.id === id) || layers[0]; }
  function isShown(o) { return !o.hidden && layerById(o.layer || 0).visible; }
  function shownObjects() { return objects.filter(isShown); }
  // Lo que se puede tocar con el cursor: visible y, si hay un grupo abierto, solo su contenido.
  function pickableObjects() { return objects.filter(o => isShown(o) && (editingGroup == null || o.gid === editingGroup)); }
  function groupMembers(gid) { return objects.filter(o => o.gid === gid); }
  // Un clic sobre algo agrupado selecciona todo el grupo (salvo el grupo que se está editando).
  function expandGroups(arr) {
    const out = new Set(arr);
    arr.forEach(o => { if (o && o.gid && o.gid !== editingGroup) groupMembers(o.gid).forEach(m => out.add(m)); });
    return Array.from(out);
  }

  let nodes = new Map();   // id -> { id, x, y, z }
  let nextNodeId = 1;
  function createNode(v) { const n = { id: nextNodeId++, x: v.x, y: v.y, z: v.z }; nodes.set(n.id, n); return n; }
  function nodePos(id) { const n = nodes.get(id); return new THREE.Vector3(n.x, n.y, n.z); }
  function setNodePos(id, v) { const n = nodes.get(id); n.x = v.x; n.y = v.y; n.z = v.z; }

  // Every 'line'/'polyface' object that references node `id` — used to cascade a move.
  function objectsUsingNode(id) {
    return objects.filter(o => (o.type === 'line' || o.type === 'polyface') && (o.params.nodeIds.includes(id) || (o.params.holes && o.params.holes.some(h => h.includes(id)))));
  }
  function nodeMoved(id) { objectsUsingNode(id).forEach(rebuildMesh); }

  function pruneOrphanNodes() {
    const used = new Set();
    objects.forEach(o => {
      if (o.type === 'line' || o.type === 'polyface') o.params.nodeIds.forEach(id => used.add(id));
      // A polyface's top-edge nodes stay alive even if every line using them was erased —
      // they're still needed to keep tracking the solid's top surface (see spawnPolyfaceTopEdges).
      if (o.type === 'polyface' && o.params.topNodeIds) o.params.topNodeIds.forEach(id => used.add(id));
      if (o.type === 'polyface' && o.params.holes) o.params.holes.forEach(h => h.forEach(id => used.add(id)));
    });
    Array.from(nodes.keys()).forEach(id => { if (!used.has(id)) nodes.delete(id); });
  }

  // A "derived" node is a polyface's top-edge node (see spawnPolyfaceTopEdges): its position
  // is always kept in lockstep with the solid's actual top surface (base node + height), never
  // dragged independently — the solid mesh itself is still a straight extrusion of the base
  // loop, so letting the Move tool grab a top node on its own would desync the edge lines from
  // the solid they sit on.
  function isDerivedNode(id) {
    return objects.some(o => o.type === 'polyface' && o.params.topNodeIds && o.params.topNodeIds.includes(id));
  }

  // ───────────────────────── Undo / Redo ─────────────────────────
  // Whole-state snapshots (not per-action inverse operations) — simplest thing that's
  // actually correct given how tangled the shared-node graph can get (a single wall push can
  // touch a face, its perimeter lines, and its top-edge lines all at once). Object ids and
  // node ids are preserved across a snapshot so undo/redo doesn't disturb identity/selection
  // any more than necessary.
  const UNDO_LIMIT = 50;
  let undoStack = [];
  let redoStack = [];
  let pendingUndoSnapshot = null; // captured at grab time for a drag (move/extrude), pushed only on real commit

  function snapshotState() {
    return {
      nextId, nextNodeId,
      nodes: Array.from(nodes.values()).map(n => ({ ...n })),
      objects: objects.map(o => ({ id: o.id, type: o.type, params: JSON.parse(JSON.stringify(o.params)), height: o.height, layer: o.layer || 0, hidden: !!o.hidden, gid: o.gid || 0 })),
      org: JSON.parse(JSON.stringify({ layers, nextLayerId, currentLayer, groups: Array.from(groups.values()), nextGroupId, components: Array.from(components.values()), nextCompId })),
    };
  }

  function restoreState(snap) {
    objects.forEach(o => { scene.remove(o.mesh); disposeMesh(o.mesh); });
    objects = [];
    selectedObjects = [];
    nodes = new Map();
    snap.nodes.forEach(n => nodes.set(n.id, { ...n }));
    nextNodeId = snap.nextNodeId;
    if (snap.org) {
      const og = JSON.parse(JSON.stringify(snap.org));
      layers = og.layers; nextLayerId = og.nextLayerId; currentLayer = og.currentLayer;
      groups = new Map(og.groups.map(g => [g.id, g])); nextGroupId = og.nextGroupId;
      components = new Map(og.components.map(c => [c.id, c])); nextCompId = og.nextCompId;
      if (editingGroup != null && !groups.has(editingGroup)) editingGroup = null;
    }
    snap.objects.forEach(o => {
      const obj = { id: o.id, type: o.type, params: o.params, height: o.height || 0, layer: o.layer || 0, hidden: !!o.hidden, gid: o.gid || 0 };
      obj.mesh = meshFor(obj);
      obj.mesh.userData.objRef = obj;
      scene.add(obj.mesh);
      obj.mesh.updateMatrixWorld(true);
      applyColor(obj);
      objects.push(obj);
    });
    nextId = snap.nextId;
    updateStatusCount();
    refreshPanel();
  }

  function updateUndoRedoButtons() {
    btnUndo.disabled = undoStack.length === 0;
    btnRedo.disabled = redoStack.length === 0;
  }

  // Call BEFORE a mutation that commits in one shot (drawing a segment, adding a rect, an
  // erase, etc.) — captures the state to go back to if the user undoes this action.
  function pushUndo() {
    undoStack.push(snapshotState());
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    redoStack = [];
    updateUndoRedoButtons();
  }

  // Pushes the snapshot captured at grab time for a drag-based action (Move/Extrude) — used
  // instead of pushUndo() there because the "before" state has to be captured before the live
  // preview starts mutating things, but should only land on the stack if the drag is actually
  // committed (not if it's cancelled — see cancelDraw, which discards pendingUndoSnapshot).
  function commitPendingUndo() {
    if (!pendingUndoSnapshot) return;
    undoStack.push(pendingUndoSnapshot);
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    redoStack = [];
    pendingUndoSnapshot = null;
    updateUndoRedoButtons();
  }

  function doUndo() {
    if (!undoStack.length) return;
    cancelDraw(); // abandon any in-progress draw/drag before jumping to a different state
    redoStack.push(snapshotState());
    restoreState(undoStack.pop());
    updateUndoRedoButtons();
  }

  function doRedo() {
    if (!redoStack.length) return;
    cancelDraw();
    undoStack.push(snapshotState());
    restoreState(redoStack.pop());
    updateUndoRedoButtons();
  }

  const COLOR_DEFAULT = 0x58a6ff;
  const COLOR_SELECTED = 0xf0b429;
  const GUIDE_COLOR_DEFAULT = 0x8b949e; // muted gray, reads as "reference", not real geometry
  const LINE_COLOR_DEFAULT = 0xffffff;  // white vector lines read clearly on the dark background
  const TYPE_DEFAULT_COLOR = { guide: GUIDE_COLOR_DEFAULT, line: LINE_COLOR_DEFAULT };

  const COLOR_HIDDEN_LINE = 0xf0f6fc;
  function applyColor(obj) {
    let base = TYPE_DEFAULT_COLOR[obj.type] || COLOR_DEFAULT;
    if (styleMode === 'hidden' && FACE_TYPES.includes(obj.type)) base = COLOR_HIDDEN_LINE;
    const c = selectedObjects.includes(obj) ? COLOR_SELECTED : base;
    obj.mesh.traverse(n => { if (n.material && n.material.color && !n.userData.isEdgeOverlay) n.material.color.setHex(c); });
    applyDisplay(obj);
  }

  // Visibilidad (capa / ocultar), atenuado fuera del grupo abierto y estilo de vista
  // (sombreado, líneas ocultas, rayos X, alámbrico) — todo converge aquí para cada malla.
  function applyDisplay(obj) {
    obj.mesh.visible = isShown(obj);
    const dim = editingGroup != null && obj.gid !== editingGroup;
    const isFace = FACE_TYPES.includes(obj.type);
    obj.mesh.traverse(n => {
      if (!n.material) return;
      if (n.userData.isEdgeOverlay || n.isLine) {
        n.material.transparent = dim; n.material.opacity = dim ? 0.25 : 1;
        // Sobre fondo oscuro, las aristas negras desaparecen en alámbrico y rayos X: se aclaran.
        if (n.userData.isEdgeOverlay) n.material.color.setHex(styleMode === 'wire' || styleMode === 'xray' ? 0xc9d1d9 : 0x000000);
        return;
      }
      if (!isFace || !n.isMesh) return;
      const m = n.material;
      if (styleMode === 'wire') { m.visible = false; return; }
      m.visible = true;
      const ghost = styleMode === 'xray' || dim;
      m.transparent = ghost;
      m.opacity = dim ? 0.25 : (styleMode === 'xray' ? 0.35 : 1);
      m.depthWrite = !ghost;
    });
  }
  function applyAllDisplay() { objects.forEach(applyColor); }

  function disposeMesh(mesh) {
    mesh.traverse(n => {
      if (n.geometry) n.geometry.dispose();
      if (n.material) n.material.dispose();
    });
  }

  // Adds black edge lines along every border of a solid (top/bottom
  // perimeter + verticals). Raycasting is disabled on it so it never steals picks/faces.
  function attachEdges(mesh, thresholdAngle) {
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(mesh.geometry, thresholdAngle),
      new THREE.LineBasicMaterial({ color: 0x000000 })
    );
    edges.userData.isEdgeOverlay = true;
    edges.raycast = () => {};
    mesh.add(edges);
  }

  // Shared by Line and Guide: an invisible cylinder gives reliable, generous-radius
  // raycasting/picking (a true zero-width THREE.Line is hard to click precisely), while the
  // actual visible line is a real vector line (no 3D thickness) riding on top of it, with
  // raycasting disabled so it never competes with the pickable cylinder for the same hit.
  const EDGE_PICK_RADIUS = 0.045;
  function buildEdgeMesh(a, b, lineMaterial) {
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length() || 0.001;
    const geo = new THREE.CylinderGeometry(EDGE_PICK_RADIUS, EDGE_PICK_RADIUS, len, 6);
    geo.translate(0, len/2, 0);
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ visible: false }));
    mesh.position.copy(a);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());

    const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,len,0)]);
    const visLine = new THREE.Line(lineGeo, lineMaterial);
    if (lineMaterial.isLineDashedMaterial) visLine.computeLineDistances();
    visLine.raycast = () => {};
    mesh.add(visLine);
    return mesh;
  }

  function buildLineMesh(a, b) {
    return buildEdgeMesh(a, b, new THREE.LineBasicMaterial({ color: LINE_COLOR_DEFAULT }));
  }

  // Reference/guide line ("cinta métrica"): other tools can still snap to it (via
  // objectVertices/resolveGeometrySnap) but it's excluded from extrude and never forms a face.
  function buildGuideMesh(a, b) {
    return buildEdgeMesh(a, b, new THREE.LineDashedMaterial({ color: GUIDE_COLOR_DEFAULT, dashSize: 0.25, gapSize: 0.18 }));
  }

  function buildRectMesh(x1, z1, x2, z2, height, baseY, lift) {
    baseY = baseY || 0;
    const w = Math.max(Math.abs(x2 - x1), 0.001);
    const d = Math.max(Math.abs(z2 - z1), 0.001);
    const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
    const mat = new THREE.MeshStandardMaterial({ color: COLOR_DEFAULT, side: THREE.DoubleSide });
    let mesh;
    if (height > 0) {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(w, height, d), mat);
      mesh.position.set(cx, baseY + height/2, cz);
    } else {
      mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
      mesh.rotation.x = -Math.PI/2;
      mesh.position.set(cx, baseY + 0.002 + (lift || 0), cz);
    }
    attachEdges(mesh);
    return mesh;
  }

  function buildCircleMesh(cx, cz, radius, height, baseY, lift) {
    baseY = baseY || 0;
    radius = Math.max(radius, 0.001);
    const mat = new THREE.MeshStandardMaterial({ color: COLOR_DEFAULT, side: THREE.DoubleSide });
    let mesh;
    if (height > 0) {
      mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 32), mat);
      mesh.position.set(cx, baseY + height/2, cz);
    } else {
      mesh = new THREE.Mesh(new THREE.CircleGeometry(radius, 32), mat);
      mesh.rotation.x = -Math.PI/2;
      mesh.position.set(cx, baseY + 0.002 + (lift || 0), cz);
    }
    attachEdges(mesh, 30);
    return mesh;
  }

  // ── Arbitrary closed polygon (auto-created when a line chain closes back on itself) ──
  // Supports 3 axis-aligned planes so a closed loop can be a horizontal floor OR a
  // vertical wall (drawn using the blue-axis lock): 'xz' (horizontal, points=[x,z],
  // extrudes toward +Y), 'zy' (wall at x=base, points=[z,y], extrudes toward +X), 'xy'
  // (wall at z=base, points=[x,y], extrudes toward +Z). `base` is the polygon's offset
  // along whichever world axis is perpendicular to its plane.
  // Rotated / mirrored faces (Rotate, Flip, Scale tools) get an orientation key of the form
  // 'm:' + 9 numbers (x, y, z basis vectors); the Proxy below builds those bases on demand so
  // every existing POLYFACE_BASES[orientation] lookup keeps working unchanged.
  const POLYFACE_NAMED = {
    xz: { x: new THREE.Vector3(1,0,0), y: new THREE.Vector3(0,0,1), z: new THREE.Vector3(0,1,0) },
    zy: { x: new THREE.Vector3(0,0,1), y: new THREE.Vector3(0,1,0), z: new THREE.Vector3(1,0,0) },
    xy: { x: new THREE.Vector3(1,0,0), y: new THREE.Vector3(0,1,0), z: new THREE.Vector3(0,0,1) },
  };
  const POLYFACE_BASES = new Proxy(POLYFACE_NAMED, {
    get(t, k) {
      if (typeof k === 'string' && k.startsWith('m:') && !(k in t)) {
        const n = k.slice(2).split(',').map(Number);
        if (n.length === 9 && n.every(isFinite)) {
          t[k] = { x: new THREE.Vector3(n[0], n[1], n[2]), y: new THREE.Vector3(n[3], n[4], n[5]), z: new THREE.Vector3(n[6], n[7], n[8]) };
        }
      }
      return t[k];
    }
  });
  function orientationKey(bx, by, bz) {
    const arr = [bx, by, bz].flatMap(v => [v.x, v.y, v.z]).map(c => Math.round(c * 1e6) / 1e6 + 0);
    for (const name of ['xz', 'zy', 'xy']) {
      const b = POLYFACE_NAMED[name];
      const ref = [b.x, b.y, b.z].flatMap(v => [v.x, v.y, v.z]);
      if (ref.every((c, i) => Math.abs(c - arr[i]) < 1e-6)) return name;
    }
    return 'm:' + arr.join(',');
  }
  function polyfaceOffsetVector(orientation, offset) {
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    return b.z.clone().multiplyScalar(offset);
  }
  // Maps a point's local (u,v) polygon coords, at a given offset along the plane's
  // normal, back to world XYZ.
  function polyfaceTo3D(orientation, offset, u, v) {
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    return b.x.clone().multiplyScalar(u).add(b.y.clone().multiplyScalar(v)).add(polyfaceOffsetVector(orientation, offset));
  }
  // Inverse: a world point's (u,v) coords within the polygon's plane.
  function polyfaceTo2D(orientation, worldPoint) {
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    return [worldPoint.dot(b.x), worldPoint.dot(b.y)];
  }
  // The world coordinate that measures "how far along the normal" a point is.
  function polyfaceNormalCoord(orientation, worldPoint) {
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    return worldPoint.dot(b.z);
  }
  // A 2D in-plane direction (e.g. a wall's outward edge normal) mapped to world XYZ.
  function polyface2DDirTo3D(orientation, du, dv) {
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    return b.x.clone().multiplyScalar(du).add(b.y.clone().multiplyScalar(dv));
  }

  // A polyface's current 2D (u,v) outline, resolved live from its shared nodes — never
  // cached, so moving a node is automatically reflected next render.
  function polyfacePoints2D(face) {
    const orientation = face.params.orientation || 'xz';
    return face.params.nodeIds.map(id => polyfaceTo2D(orientation, nodePos(id)));
  }

  // Figures out which of the 3 axis-aligned planes a just-closed line chain lies in —
  // 'xz' (horizontal floor), 'zy' or 'xy' (a vertical wall, reached by drawing with the
  // blue-axis lock). Returns null if the loop isn't flat in any of them (e.g. drawn off
  // any axis lock), so the caller can leave the original lines alone instead of collapsing
  // them into a broken/degenerate face.
  const POLYGON_PLANAR_EPS = 0.02;
  function detectPolygonOrientation(points3D) {
    const xs = points3D.map(p => p.x), ys = points3D.map(p => p.y), zs = points3D.map(p => p.z);
    const spanX = Math.max(...xs) - Math.min(...xs);
    const spanY = Math.max(...ys) - Math.min(...ys);
    const spanZ = Math.max(...zs) - Math.min(...zs);
    if (spanY <= POLYGON_PLANAR_EPS) return { orientation: 'xz', base: ys[0], points: points3D.map(p => [p.x, p.z]) };
    if (spanX <= POLYGON_PLANAR_EPS) return { orientation: 'zy', base: xs[0], points: points3D.map(p => [p.z, p.y]) };
    if (spanZ <= POLYGON_PLANAR_EPS) return { orientation: 'xy', base: zs[0], points: points3D.map(p => [p.x, p.y]) };
    return null;
  }

  function flipWinding(geo) {
    const idx = geo.getIndex();
    if (idx) {
      const a = idx.array;
      for (let i = 0; i + 2 < a.length; i += 3) { const t = a[i + 1]; a[i + 1] = a[i + 2]; a[i + 2] = t; }
      idx.needsUpdate = true;
    } else {
      Object.keys(geo.attributes).forEach(name => {
        const at = geo.attributes[name], n = at.itemSize, arr = at.array;
        for (let i = 0; i + 2 < at.count; i += 3) {
          for (let k = 0; k < n; k++) { const i1 = (i + 1) * n + k, i2 = (i + 2) * n + k; const t = arr[i1]; arr[i1] = arr[i2]; arr[i2] = t; }
        }
        at.needsUpdate = true;
      });
    }
  }

  function buildPolyfaceMesh(points, height, orientation, base, lift, noEdges, holes) {
    orientation = orientation || 'xz';
    base = base || 0;
    const shape = new THREE.Shape(points.map(p => new THREE.Vector2(p[0], p[1])));
    if (holes && holes.length) shape.holes = holes.map(h => new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1]))));
    const mat = new THREE.MeshStandardMaterial({ color: COLOR_DEFAULT, side: THREE.DoubleSide });
    const geo = height > 0
      ? new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false })
      : new THREE.ShapeGeometry(shape);
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    const matrix = new THREE.Matrix4().makeBasis(b.x, b.y, b.z).setPosition(polyfaceOffsetVector(orientation, base));
    geo.applyMatrix4(matrix);
    // The horizontal ('xz') and 'zy' plane bases are left-handed, which silently reverses the
    // triangle winding once baked into the geometry — the top of a floor/solid then lit as its
    // back side (dark blue, unlike a Rectangle/Circle). Flip it back so every face shades alike.
    if (matrix.determinant() < 0) flipWinding(geo);
    const mesh = new THREE.Mesh(geo, mat);
    if (height <= 0) mesh.position.addScaledVector(b.z, 0.002 + (lift || 0)); // nudge off the plane, avoids z-fighting
    // Un cuerpo con aristas reales (líneas) no lleva además el contorno incrustado: dibujar dos aristas
    // en el mismo sitio es lo que hacía que se viera «temblar», y borrar una línea no quitaba la arista.
    if (!noEdges) attachEdges(mesh);
    return mesh;
  }

  function meshFor(obj) {
    if (obj.type === 'line') return buildLineMesh(nodePos(obj.params.nodeIds[0]), nodePos(obj.params.nodeIds[1]));
    if (obj.type === 'guide') return buildGuideMesh(new THREE.Vector3(...obj.params.a), new THREE.Vector3(...obj.params.b));
    if (obj.type === 'rect') return buildRectMesh(obj.params.x1, obj.params.z1, obj.params.x2, obj.params.z2, obj.height, obj.params.baseY, obj.params.lift);
    if (obj.type === 'circle') return buildCircleMesh(obj.params.cx, obj.params.cz, obj.params.radius, obj.height, obj.params.baseY, obj.params.lift);
    if (obj.type === 'polyface') return buildPolyfaceMesh(polyfacePoints2D(obj), obj.height, obj.params.orientation, obj.params.base, obj.params.lift, obj.height > 0 && !!obj.params.topNodeIds, (obj.params.holes || []).map(h => h.map(id => polyfaceTo2D(obj.params.orientation || 'xz', nodePos(id)))));
    if (obj.type === 'solid') return buildSolidMesh(obj.params.verts, obj.params.tris);
  }

  // Sólido libre (resultado de Sígueme): malla de triángulos con sus propios vértices.
  function buildSolidMesh(verts, tris) {
    const pos = new Float32Array(tris.length * 9);
    tris.forEach((t, i) => t.forEach((vi, k) => { const v = verts[vi]; pos[i * 9 + k * 3] = v[0]; pos[i * 9 + k * 3 + 1] = v[1]; pos[i * 9 + k * 3 + 2] = v[2]; }));
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: COLOR_DEFAULT, side: THREE.DoubleSide }));
    attachEdges(mesh, 30);
    return mesh;
  }

  function addObject(type, params, height, meta) {
    const obj = { id: nextId++, type, params, height: height || 0, layer: currentLayer, hidden: false, gid: editingGroup || 0 };
    if (meta) { if (meta.layer != null) obj.layer = meta.layer; if (meta.hidden != null) obj.hidden = !!meta.hidden; if (meta.gid != null) obj.gid = meta.gid; }
    obj.mesh = meshFor(obj);
    obj.mesh.userData.objRef = obj;
    scene.add(obj.mesh);
    obj.mesh.updateMatrixWorld(true);
    objects.push(obj);
    applyDisplay(obj);
    updateStatusCount();
    return obj;
  }

  function rebuildMesh(obj) {
    scene.remove(obj.mesh);
    disposeMesh(obj.mesh);
    obj.mesh = meshFor(obj);
    obj.mesh.userData.objRef = obj;
    scene.add(obj.mesh);
    obj.mesh.updateMatrixWorld(true);
    applyColor(obj);
  }

  // Every polyface whose BASE boundary loop uses (nodeIdA, nodeIdB) as one of its actual
  // edges (adjacent in the loop) — i.e. the fill(s) that would lose part of their perimeter
  // if this specific edge line were deleted. Deliberately checks only the base loop, not a
  // solid's derived top/vertical edges (spawnPolyfaceTopEdges) — those are cosmetic tracing,
  // not part of what defines the fill's shape, so erasing one shouldn't take the solid with it.
  function facesUsingEdge(nodeIdA, nodeIdB) {
    return objects.filter(o => o.type === 'polyface' && areAdjacentInLoop(o.params.nodeIds, nodeIdA, nodeIdB));
  }

  function removeObject(obj) {
    if (!objects.includes(obj)) return; // already gone (e.g. cascaded away with its fill already)
    if (obj.type === 'line') {
      // Erasing an edge that bounds a face takes the face's fill with it,
      // but leaves the face's other edges standing (now bounding nothing).
      const [a, b] = obj.params.nodeIds;
      facesUsingEdge(a, b).forEach(removeObject);
      // Un agujero (cara «recortada» en otra) se cierra si se borra una de sus aristas.
      objects.forEach(f => {
        if (f.type === 'polyface' && f.params.holes && f.params.holes.some(h => areAdjacentInLoop(h, a, b))) {
          f.params.holes = f.params.holes.filter(h => !areAdjacentInLoop(h, a, b));
          if (!f.params.holes.length) delete f.params.holes;
          rebuildMesh(f);
        }
      });
    }
    scene.remove(obj.mesh);
    disposeMesh(obj.mesh);
    objects = objects.filter(o => o !== obj);
    selectedObjects = selectedObjects.filter(o => o !== obj);
    pruneOrphanNodes();
    updateStatusCount();
  }

  function clearAll() {
    objects.forEach(o => { scene.remove(o.mesh); disposeMesh(o.mesh); });
    objects = [];
    selectedObjects = [];
    nodes = new Map();
    layers = [{ id: 0, name: 'Capa 0', visible: true }]; nextLayerId = 1; currentLayer = 0;
    groups = new Map(); nextGroupId = 1; components = new Map(); nextCompId = 1; editingGroup = null;
    updateStatusCount();
    refreshPanel();
  }

  function setSelection(arr) {
    const prev = selectedObjects;
    selectedObjects = arr.slice();
    prev.forEach(o => { if (!selectedObjects.includes(o)) applyColor(o); });
    selectedObjects.forEach(o => applyColor(o));
  }

  function selectObject(obj) {
    setSelection(obj ? [obj] : []);
  }

  // Face highlight for the Extrude tool — shows exactly which face will be pushed/pulled,
  // not the whole solid, both while hovering and live while dragging it.
  const FACE_HIGHLIGHT_COLOR = 0x79c0ff;
  let faceHighlightMesh = null;
  function showFaceHighlight(mesh) {
    hideFaceHighlight();
    if (!mesh) return;
    mesh.raycast = () => {};
    faceHighlightMesh = mesh;
    scene.add(faceHighlightMesh);
  }
  function hideFaceHighlight() {
    if (faceHighlightMesh) { scene.remove(faceHighlightMesh); disposeMesh(faceHighlightMesh); faceHighlightMesh = null; }
  }

  // Builds a thin overlay mesh matching exactly the geometry of one face of a solid,
  // so the Extrude tool can highlight/track that single face instead of the whole object.
  function buildFaceHighlightMesh(obj, faceKind) {
    if (!faceKind) return null;
    const mat = new THREE.MeshBasicMaterial({ color: FACE_HIGHLIGHT_COLOR, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false });
    const baseY = (obj.params && obj.params.baseY) || 0;
    const h = obj.height;
    const topY = baseY + (h > 0 ? h : 0) + 0.01;

    if (obj.type === 'rect') {
      const { x1, z1, x2, z2 } = obj.params;
      const xMin = Math.min(x1, x2), xMax = Math.max(x1, x2), zMin = Math.min(z1, z2), zMax = Math.max(z1, z2);
      if (faceKind === 'top') {
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(xMax - xMin, zMax - zMin), mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.set((xMin + xMax) / 2, topY, (zMin + zMax) / 2);
        return mesh;
      }
      if (faceKind === 'x+' || faceKind === 'x-') {
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(zMax - zMin, h), mat);
        mesh.rotation.y = Math.PI / 2;
        mesh.position.set(faceKind === 'x+' ? xMax : xMin, baseY + h / 2, (zMin + zMax) / 2);
        return mesh;
      }
      if (faceKind === 'z+' || faceKind === 'z-') {
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(xMax - xMin, h), mat);
        mesh.position.set((xMin + xMax) / 2, baseY + h / 2, faceKind === 'z+' ? zMax : zMin);
        return mesh;
      }
    }
    if (obj.type === 'circle') {
      const { cx, cz, radius } = obj.params;
      if (faceKind === 'top') {
        const mesh = new THREE.Mesh(new THREE.CircleGeometry(radius, 32), mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.set(cx, topY, cz);
        return mesh;
      }
      if (faceKind === 'radius') {
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, h, 32, 1, true), mat);
        mesh.position.set(cx, baseY + h / 2, cz);
        return mesh;
      }
    }
    if (obj.type === 'polyface') {
      const pts = polyfacePoints2D(obj);
      const orientation = obj.params.orientation || 'xz';
      const faceBase = obj.params.base || 0;
      if (faceKind === 'top') {
        const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
        const geo = new THREE.ShapeGeometry(shape);
        const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
        const topOffset = faceBase + (h > 0 ? h : 0) + 0.01;
        geo.applyMatrix4(new THREE.Matrix4().makeBasis(b.x, b.y, b.z).setPosition(polyfaceOffsetVector(orientation, topOffset)));
        return new THREE.Mesh(geo, mat);
      }
      const wallMatch = /^wall(\d+)$/.exec(faceKind);
      if (wallMatch) {
        const k = parseInt(wallMatch[1], 10);
        const a = pts[k], b2 = pts[(k + 1) % pts.length];
        const p0 = polyfaceTo3D(orientation, faceBase, a[0], a[1]);
        const p1 = polyfaceTo3D(orientation, faceBase, b2[0], b2[1]);
        const p2 = polyfaceTo3D(orientation, faceBase + h, b2[0], b2[1]);
        const p3 = polyfaceTo3D(orientation, faceBase + h, a[0], a[1]);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
          p0.x, p0.y, p0.z,  p1.x, p1.y, p1.z,  p2.x, p2.y, p2.z,
          p0.x, p0.y, p0.z,  p2.x, p2.y, p2.z,  p3.x, p3.y, p3.z,
        ]), 3));
        geo.computeVertexNormals();
        return new THREE.Mesh(geo, mat);
      }
    }
    return null;
  }

  // ───────────────────────── Tools / interaction ─────────────────────────
  let currentTool = 'select';
  const raycaster = new THREE.Raycaster();
  const mouseNDC = new THREE.Vector2();

  const hintEl = document.getElementById('hint');
  const statusToolEl = document.getElementById('statusTool');
  const statusCoordsEl = document.getElementById('statusCoords');
  const statusCountEl = document.getElementById('statusCount');
  const btnUndo = document.getElementById('btnUndo');
  const btnRedo = document.getElementById('btnRedo');

  const TOOL_HINTS = {

    rect: 'Clic en una esquina, clic en la esquina opuesta (engancha a puntos existentes). Escribe 200,100 + Enter para ancho y fondo exactos.',
