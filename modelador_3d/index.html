    }
    mates.forEach(removeObject);
  }

  // Borra un objeto entero sin dejar sus aristas sueltas flotando.
  function removeBodyClean(o) {
    if (!objects.includes(o)) return;
    if (o.type === 'polyface' && o.height > 0) {
      const base = o.params.nodeIds, top = o.params.topNodeIds || [], n = base.length, pairs = [];
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        pairs.push([base[i], base[j]]);
        if (top.length) { pairs.push([top[i], top[j]]); pairs.push([base[i], top[i]]); }
      }
      removeObject(o);
      pairs.forEach(([a, b]) => { const l = lineBetween(a, b); if (l && !facesUsingEdge(a, b).length) removeObject(l); });
    } else removeObject(o);
  }

  // ¿Es esta cara plana la tapa de un cuerpo abierto? (cada una de sus aristas la comparte una cara perpendicular)
  function shellFaceAttached(face) {
    const ids = face.params.nodeIds, n = ids.length;
    if (n < 3) return false;
    const nf = (POLYFACE_BASES[face.params.orientation || 'xz'] || POLYFACE_BASES.xz).z;
    for (let i = 0; i < n; i++) {
      const a = ids[i], b = ids[(i + 1) % n];
      const nb = objects.find(g => g !== face && g.type === 'polyface' && !(g.height > 0) &&
        areAdjacentInLoop(g.params.nodeIds, a, b) &&
        Math.abs((POLYFACE_BASES[g.params.orientation || 'xz'] || POLYFACE_BASES.xz).z.dot(nf)) < 1e-3);
      if (!nb) return false;
    }
    return true;
  }
  function faceEdgeLines(face) {
    const ids = face.params.nodeIds, out = [];
    for (let i = 0; i < ids.length; i++) { const l = lineBetween(ids[i], ids[(i + 1) % ids.length]); if (l) out.push(l); }
    return out;
  }
  // Toda la geometría conectada (por nodos compartidos) con la dada.
  function connectedGeometry(seed) {
    const seen = new Set(), todo = [seed], out = [];
    const nodeIdsOf = o => (o.type === 'line' || o.type === 'polyface') ? o.params.nodeIds.concat(o.params.topNodeIds || []) : [];
    while (todo.length) {
      const o = todo.pop();
      if (seen.has(o)) continue;
      seen.add(o); out.push(o);
      nodeIdsOf(o).forEach(id => objectsUsingNode(id).forEach(x => { if (!seen.has(x) && !x.hidden && !isLockedByGroup(x)) todo.push(x); }));
    }
    return out;
  }

  // ── Cerrar caras solas: al dibujar una línea que completa un lazo plano de aristas, se crea la cara ──
  // (también cuando se borró una arista y se vuelve a dibujar). Se recorre, en cada plano posible que
  // contiene la arista nueva, la cara que queda a cada lado.
  function faceNodeKey(ids) { return ids.slice().sort((x, y) => x - y).join(','); }
  function autoCloseFaces(a, b) {
    if (a == null || b == null || a === b) return 0;
    const adj = new Map();
    const link = (u, v) => { if (!adj.has(u)) adj.set(u, new Set()); adj.get(u).add(v); };
    objects.forEach(o => { if (o.type === 'line') { const [u, v] = o.params.nodeIds; if (u !== v) { link(u, v); link(v, u); } } });
    if (!adj.has(a) || !adj.has(b)) return 0;
    const A = nodePos(a), B = nodePos(b);
    const ex0 = B.clone().sub(A);
    if (ex0.lengthSq() < 1e-12) return 0;
    ex0.normalize();
    // planos candidatos: los que forman la arista nueva con cada vecino de sus extremos
    const planes = [];
    const addPlane = c => {
      const n = ex0.clone().cross(nodePos(c).sub(A));
      if (n.length() < 1e-6) return;
      n.normalize();
      if (planes.some(q => Math.abs(Math.abs(q.n.dot(n)) - 1) < 1e-6)) return;
      planes.push({ n });
    };
    adj.get(b).forEach(c => { if (c !== a) addPlane(c); });
    adj.get(a).forEach(c => { if (c !== b) addPlane(c); });
    const existing = new Set(objects.filter(o => o.type === 'polyface').map(o => faceNodeKey(o.params.nodeIds)));
    const baseLine = lineBetween(a, b);
    const meta = baseLine ? bodyMeta(baseLine) : null;
    let made = 0;
    const EPS = 1e-4;
    planes.forEach(({ n }) => {
      const onPlane = id => Math.abs(n.dot(nodePos(id).sub(A))) < EPS;
      const ey = n.clone().cross(ex0);
      const P = new Map();
      const pos2 = id => { if (!P.has(id)) { const d = nodePos(id).sub(A); P.set(id, [d.dot(ex0), d.dot(ey)]); } return P.get(id); };
      const nbrs = id => Array.from(adj.get(id) || []).filter(onPlane);
      const walk = (u, v) => {
        const loop = [u];
        let prev = u, cur = v;
        for (let step = 0; step < 80; step++) {
          if (cur === u) {
            // terminó: ¿volvió por la arista inicial?
            return loop;
          }
          if (loop.includes(cur)) return null;      // lazo no simple
          loop.push(cur);
          const pc = pos2(cur), pp = pos2(prev);
          const r = Math.atan2(pp[1] - pc[1], pp[0] - pc[0]);
          let best = null, bestAng = Infinity;
          for (const w of nbrs(cur)) {
            if (w === prev) continue;
            const pw = pos2(w);
            let ang = r - Math.atan2(pw[1] - pc[1], pw[0] - pc[0]);
            ang = ((ang % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
            if (ang < 1e-9) ang = 2 * Math.PI;
            if (ang < bestAng) { bestAng = ang; best = w; }
          }
          if (best == null) return null;               // arista colgando: no hay lazo
          prev = cur; cur = best;
        }
        return null;
      };
      [[a, b], [b, a]].forEach(([u, v]) => {
        const loop = walk(u, v);
        if (!loop || loop.length < 3) return;
        let area = 0;
        for (let i = 0; i < loop.length; i++) { const p1 = pos2(loop[i]), p2 = pos2(loop[(i + 1) % loop.length]); area += p1[0] * p2[1] - p2[0] * p1[1]; }
        if (area <= 1e-6) return;                      // cara exterior (sin acotar)
        const key = faceNodeKey(loop);
        if (existing.has(key)) return;
        // plano y base de la cara nueva
        const P0 = nodePos(loop[0]);
        let orientation, base;
        const AX = [['xz', 'y'], ['zy', 'x'], ['xy', 'z']];
        const hit = AX.find(([, c]) => Math.abs(Math.abs(n[c]) - 1) < 1e-6);
        if (hit) { orientation = hit[0]; base = POLYFACE_BASES[orientation].z.dot(P0); }
        else {
          const xv = ex0.clone();
          const yv = n.clone().cross(xv);
          orientation = orientationKey(xv, yv, n.clone());
          base = POLYFACE_BASES[orientation].z.dot(P0);
        }
        existing.add(key);
        addObject('polyface', { nodeIds: loop, orientation, base }, 0, meta);
        made++;
      });
    });
    return made;
  }

  // Seleccionar partes: la arista bajo el cursor (se «abre» el cuerpo si hace falta); con doble clic sobre
  // un cuerpo, solo la cara tocada. Un clic sobre una cara de un cuerpo entero sigue seleccionándolo entero.
  function selectPartAt(clientX, clientY, dbl, additive) {
    const merge = list => setSelection(additive ? Array.from(new Set(selectedObjects.concat(list))) : list);
    const cand = nearestEdge(clientX, clientY, 6);
    if (cand && !isLockedByGroup(cand.obj)) {
      if (cand.kind === 'body') {
        pushUndo();
        explodeBody(cand.obj);
        const l = lineBetween(nodeAt(cand.a), nodeAt(cand.b));
        if (l) { merge(curveMates(l)); return true; }
        return true;
      }
      merge(expandGroups(curveMates(cand.obj)));
      return true;
    }
    const obj = pickObject(clientX, clientY);
    if (obj && dbl && isBody(obj) && !isLockedByGroup(obj)) {
      pushUndo();
      explodeBody(obj);
      const f = pickObject(clientX, clientY);
      merge(f ? [f] : []);
      return true;
    }
    merge(expandGroups(curveMates(obj)));
    return false;
  }

  // ── Elegir qué arista se va a borrar: la más cercana al cursor (en píxeles) que no esté tapada ──
  const ERASE_EDGE_PX = 9;
  function segScreenDist(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
    const t = l2 < 1e-9 ? 0 : Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / l2));
    return { d: Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t)), t };
  }
  function behindCamera(p) { return p.clone().applyMatrix4(camera.matrixWorldInverse).z > -1e-4; }
  function edgeOccluded(p) {
    if (styleMode === 'wire' || styleMode === 'xray') return false;
    const ndc = p.clone().project(camera);
    raycaster.setFromCamera({ x: ndc.x, y: ndc.y }, camera);
    const dist = p.clone().sub(raycaster.ray.origin).dot(raycaster.ray.direction);
    const faces = pickableObjects().filter(o => FACE_TYPES.includes(o.type)).map(o => o.mesh);
    const hits = raycaster.intersectObjects(faces, true);
    return hits.length > 0 && hits[0].distance < dist - (0.03 + 0.002 * dist);
  }
  function bodyEdgeSegments(o) {
    const segs = [];

      const { x1, z1, x2, z2 } = o.params, y0 = o.params.baseY || 0, y1 = y0 + o.height;
      [y0, y1].forEach(y => {
        const c = [[x1, z1], [x2, z1], [x2, z2], [x1, z2]].map(([x, z]) => new THREE.Vector3(x, y, z));
        for (let i = 0; i < 4; i++) segs.push([c[i], c[(i + 1) % 4]]);
      });
      [[x1, z1], [x2, z1], [x2, z2], [x1, z2]].forEach(([x, z]) => segs.push([new THREE.Vector3(x, y0, z), new THREE.Vector3(x, y1, z)]));
    } else if (o.type === 'circle') {
      const y0 = o.params.baseY || 0;
      [y0, y0 + o.height].forEach(y => {
        const c = circlePoints(new THREE.Vector3(o.params.cx, y, o.params.cz), o.params.radius, 32);
        for (let i = 0; i < 32; i++) segs.push([c[i], c[(i + 1) % 32]]);
      });
    }

  }
  function nearestEdge(clientX, clientY, maxPx) {
    const lim = maxPx || ERASE_EDGE_PX;
    const r = dom.getBoundingClientRect(), px = clientX - r.left, py = clientY - r.top;
    let best = null;
    const consider = (a, b, make) => {
      if (behindCamera(a) || behindCamera(b)) return;
      const sa = projectToScreen(a, r), sb = projectToScreen(b, r);
      const { d, t } = segScreenDist(px, py, sa, sb);
      if (d > lim || (best && d >= best.d)) return;
      const pt = a.clone().lerp(b, t);
      if (edgeOccluded(pt)) return;
      best = { d, a, b, ...make() };
    };
    pickableObjects().forEach(o => {
      if (o.type === 'line') { const [a, b] = lineEndpoints(o); consider(a, b, () => ({ kind: 'line', obj: o })); }
      else if (o.type === 'guide') { const [a, b] = lineEndpoints(o); consider(a, b, () => ({ kind: 'guide', obj: o })); }
      else if ((o.type === 'rect' || o.type === 'circle') && o.height > 0) bodyEdgeSegments(o).forEach(([a, b]) => consider(a, b, () => ({ kind: 'body', obj: o })));
    });
    return best;
  }

  function eraseAt(clientX, clientY) {
    const cand = nearestEdge(clientX, clientY);
    if (cand) {
      if (isLockedByGroup(cand.obj)) { pushUndo(); expandGroups([cand.obj]).forEach(removeBodyClean); cleanupGroups(); return; }
      pushUndo();
      if (cand.kind === 'body') {
        explodeBody(cand.obj);
        const l = lineBetween(nodeAt(cand.a), nodeAt(cand.b));
        if (l) eraseEdgeLine(l);
      } else if (cand.kind === 'line') eraseEdgeLine(cand.obj);
      else removeObject(cand.obj);
      pruneOrphanNodes();
      return;
    }
    const obj = pickObject(clientX, clientY);
    if (!obj) return;
    pushUndo();
    expandGroups(curveMates(obj)).forEach(removeBodyClean);
    cleanupGroups();
  }

  // Vista previa en naranja de la arista que se borraría.
  function eraseHover(clientX, clientY, maxPx) {
    const cand = nearestEdge(clientX, clientY, maxPx);
    setPreview(cand ? buildPreviewShape([cand.a, cand.b], false, false) : null);
  }

  // Suprimir sobre la selección: aristas por la vía de arriba, el resto sin dejar restos sueltos.
  function deleteSelectionSmart() {
    pushUndo();
    selectedObjects.slice().forEach(o => { if (o.type === 'line') eraseEdgeLine(o); else removeBodyClean(o); });
    pruneOrphanNodes();
    cleanupGroups();
  }

  // ═════════════ Grupos, componentes, capas y ocultar ═════════════
  const IDENT_M = () => new THREE.Matrix4().identity().toArray();
  function say(msg) { statusCoordsEl.textContent = msg; }
  function isLockedByGroup(o) { return !!o && !!o.gid && o.gid !== editingGroup; }

  // Mover un grupo entero: se conserva el estado de partida y cada movimiento se reaplica desde ahí.
  function startGroupMove(gid, anchor) {
    const mem = groupMembers(gid);
    if (!mem.length) return;
    pendingUndoSnapshot = snapshotState();
    const ids = new Set();
    mem.forEach(o => { if (o.type === 'line' || o.type === 'polyface') { o.params.nodeIds.forEach(i => ids.add(i)); (o.params.topNodeIds || []).forEach(i => ids.add(i)); } });
    moveGroup = {
      objs: mem,
      nodes: Array.from(ids).map(id => ({ id, pos: nodePos(id) })),
      params: new Map(mem.map(o => [o, { params: JSON.parse(JSON.stringify(o.params)), height: o.height }])),
      gm: [{ gid, m: groups.get(gid).m ? groups.get(gid).m.slice() : null }],
    };
    moveAnchor = anchor.clone();
    setSelection(mem);
    controls.enabled = false;
  }
  function restoreMoveGroup() {
    if (!moveGroup) return;
    moveGroup.objs.forEach(o => { const b = moveGroup.params.get(o); o.params = JSON.parse(JSON.stringify(b.params)); o.height = b.height; });
    moveGroup.nodes.forEach(({ id, pos }) => setNodePos(id, pos));
    moveGroup.gm.forEach(({ gid, m }) => { if (groups.get(gid)) groups.get(gid).m = m ? m.slice() : null; });
    moveGroup.objs.forEach(rebuildMesh);
  }

  function cleanupGroups() {
    const used = new Set(objects.map(o => o.gid).filter(Boolean));
    Array.from(groups.keys()).forEach(id => { if (!used.has(id)) groups.delete(id); });
    if (editingGroup != null && !groups.has(editingGroup)) { editingGroup = null; applyAllDisplay(); }
    refreshPanel();
  }

  function makeGroup() {
    if (editingGroup != null) { say('Cierra el grupo abierto antes de crear otro (no se anidan).'); return; }
    if (!selectedObjects.length) { say('Selecciona algo para agrupar.'); return; }
    pushUndo();
    const gid0 = nextGroupId++;
    const g = { id: gid0, name: 'Grupo ' + gid0, comp: null, m: IDENT_M() };
    groups.set(g.id, g);
    const sel = selectedObjects.slice();
    sel.forEach(o => { o.gid = g.id; });
    cleanupGroups();
    setSelection(sel);
    say('Grupo creado con ' + sel.length + ' objeto(s). Doble clic para editarlo.');
  }

  function explodeGroup() {
    const gids = new Set(selectedObjects.map(o => o.gid).filter(Boolean));
    if (!gids.size) { say('Selecciona un grupo o componente para descomponer.'); return; }
    pushUndo();
    objects.forEach(o => { if (gids.has(o.gid)) o.gid = 0; });
    if (editingGroup != null && gids.has(editingGroup)) editingGroup = null;
    cleanupGroups();
    applyAllDisplay();
    say('Descompuesto.');
  }

  // Paquete portable de objetos (nodos + objetos), sin grupos.
  function packObjects(objs) {
    const ids = new Set();
    objs.forEach(o => { if (o.type === 'line' || o.type === 'polyface') { o.params.nodeIds.forEach(i => ids.add(i)); (o.params.topNodeIds || []).forEach(i => ids.add(i)); } });
    return {
      nodes: Array.from(ids).map(id => ({ ...nodes.get(id) })),
      objects: objs.map(o => ({ type: o.type, params: JSON.parse(JSON.stringify(o.params)), height: o.height, layer: o.layer || 0, hidden: false, gid: 0 })),
      groups: [],
    };
  }

  function makeComponent(nameArg) {
    if (editingGroup != null) { say('Cierra el grupo abierto antes.'); return; }
    if (!selectedObjects.length) { say('Selecciona algo para convertir en componente.'); return; }
    const name = (nameArg != null ? nameArg : prompt('Nombre del componente:', 'Componente ' + nextCompId) || '').trim();
    if (!name) return;
    pushUndo();
    const sel = selectedObjects.slice();
    const g = { id: nextGroupId++, name, comp: null, m: IDENT_M() };
    groups.set(g.id, g);
    sel.forEach(o => { o.gid = g.id; });
    const box = selectionBox();
    const comp = { id: nextCompId++, name, anchor: [(box.min.x + box.max.x) / 2, box.min.y, (box.min.z + box.max.z) / 2], ...packObjects(sel) };
    g.comp = comp.id;
    components.set(comp.id, comp);
    cleanupGroups();
    setSelection(sel);
    say('Componente "' + name + '" creado. Insértalo desde el panel Grupos; al editar una instancia, las demás se actualizan.');
  }

  function insertComponent(compId) {
    const c = components.get(compId);
    if (!c) return;
    if (editingGroup != null) exitGroupEdit();
    const src = {
      nodes: c.nodes,
      objects: c.objects.map(d => ({ ...d, gid: -1 })),
      groups: [{ id: -1, name: c.name, comp: c.id, m: IDENT_M() }],
      anchor: new THREE.Vector3(...c.anchor),
    };
    startPaste(false, src);
  }

  function deleteComponentDef(compId) {
    const inst = Array.from(groups.values()).filter(g => g.comp === compId);
    if (inst.length && !confirm('Hay ' + inst.length + ' instancia(s). Se convertirán en grupos normales. ¿Continuar?')) return;
    pushUndo();
    inst.forEach(g => { g.comp = null; });
    components.delete(compId);
    refreshPanel();
  }

  // Re-genera las demás instancias de un componente a partir de la que se acaba de editar.
  function syncComponent(gid) {
    const g = groups.get(gid), comp = g && components.get(g.comp);
    if (!comp) return;
    const mem = groupMembers(gid);
    if (!mem.length) return;
    const others = Array.from(groups.values()).filter(h => h.comp === comp.id && h.id !== gid);
    if (others.length) pushUndo();
    const inv = new THREE.Matrix4().fromArray(g.m).invert();
    const tmp = instantiateClipboard(packObjects(mem), false);
    applyMatrixToObjects(tmp, inv);
    const def = packObjects(tmp);
    tmp.forEach(removeObject);
    comp.nodes = def.nodes; comp.objects = def.objects;
    others.forEach(h => {
      const old = groupMembers(h.id);
      const layer = old.length ? old[0].layer : 0, hidden = old.length ? old[0].hidden : false;
      old.forEach(removeObject);
      const objs = instantiateClipboard(def, false);
      applyMatrixToObjects(objs, new THREE.Matrix4().fromArray(h.m));
      objs.forEach(o => { o.gid = h.id; o.layer = layer; o.hidden = hidden; });
    });
    pruneOrphanNodes();
  }

  function enterGroup(gid) {
    if (!groups.has(gid) || editingGroup === gid) return;
    if (editingGroup != null) exitGroupEdit();
    editingGroup = gid;
    setSelection([]);
    applyAllDisplay();
    refreshPanel();
    say('Editando "' + groups.get(gid).name + '". Doble clic fuera del grupo o Esc para cerrarlo.');
  }
  function exitGroupEdit() {
    if (editingGroup == null) return;
    const gid = editingGroup;
    editingGroup = null;
    const g = groups.get(gid);
    if (g && g.comp) syncComponent(gid);
    applyAllDisplay();
    setSelection(groupMembers(gid));
    refreshPanel();
  }

  // ── ocultar / mostrar ──
  function hideSelection() {
    if (!selectedObjects.length) { say('Selecciona algo para ocultar.'); return; }
    pushUndo();
    selectedObjects.forEach(o => { o.hidden = true; });
    setSelection([]);
    applyAllDisplay();
  }
  function showAllHidden() {
    if (!objects.some(o => o.hidden)) { say('No hay objetos ocultos.'); return; }
    pushUndo();
    objects.forEach(o => { o.hidden = false; });
    applyAllDisplay();
  }

  // ── capas ──
  function addLayer(nameArg) {
    const name = (nameArg != null ? nameArg : prompt('Nombre de la capa:', 'Capa ' + nextLayerId) || '').trim();
    if (!name) return;
    pushUndo();
    const l = { id: nextLayerId++, name, visible: true };
    layers.push(l);
    currentLayer = l.id;
    refreshPanel();
  }
  function setLayerVisible(id, v) {
    layerById(id).visible = v;
    setSelection(selectedObjects.filter(isShown));
    applyAllDisplay();
    refreshPanel();
  }
  function deleteLayer(id) {
    if (id === 0) return;
    pushUndo();
    objects.forEach(o => { if (o.layer === id) o.layer = 0; });
    layers = layers.filter(l => l.id !== id);
    if (currentLayer === id) currentLayer = 0;
    applyAllDisplay();
    refreshPanel();
  }
  function moveSelectionToLayer(id) {
    if (!selectedObjects.length) { say('Selecciona algo para moverlo a la capa.'); return; }
    pushUndo();
    selectedObjects.forEach(o => { o.layer = id; });
    setSelection(selectedObjects.filter(isShown));
    applyAllDisplay();
    refreshPanel();
  }
  function renameLayer(id) {
    const l = layerById(id), name = (prompt('Nombre de la capa:', l.name) || '').trim();
    if (name) { l.name = name; refreshPanel(); }
  }
  function renameGroup(id) {
    const g = groups.get(id); if (!g) return;
    const name = (prompt('Nombre:', g.name) || '').trim();
    if (!name) return;
    g.name = name;
    if (g.comp && components.get(g.comp)) components.get(g.comp).name = name;
    refreshPanel();
  }

  // Triple clic con Seleccionar: toda la geometría conectada.
  dom.addEventListener('click', (e) => {
    if (currentTool !== 'select' || e.detail !== 3) return;
    const o = pickObject(e.clientX, e.clientY);
    if (o && !isLockedByGroup(o)) setSelection(connectedGeometry(o));
  });

  // Doble clic con Seleccionar: abre el grupo bajo el cursor; fuera de él, lo cierra.
  dom.addEventListener('dblclick', (e) => {
    if (currentTool !== 'select') return;
    const o = pickObject(e.clientX, e.clientY);
    if (o && isBody(o) && !(o.gid && o.gid !== editingGroup)) { selectPartAt(e.clientX, e.clientY, true, false); return; }
    if (o && o.type === 'polyface' && !(o.height > 0) && !(o.gid && o.gid !== editingGroup)) { setSelection([o].concat(faceEdgeLines(o))); return; }
    if (o && o.gid && o.gid !== editingGroup) enterGroup(o.gid);
    else if (!o && editingGroup != null) exitGroupEdit();
  });

  // ═════════════ Sígueme (Follow Me): barrer un perfil a lo largo de una trayectoria ═════════════
  let fmFace = null;   // cara elegida como perfil
  let fmPath = null;   // { lines, nodeIds, closed }

  // El perfil, como lazo 3D (sin repetir el primer punto). Solo caras planas (rectángulo, círculo, polígono).
  function profileLoop3D(o) {
    if (!o || o.type === 'solid') return null;
    const info = faceOffsetInfo(o);
    if (!info) return null;
    if (info.kind === 'circle') return circlePoints(new THREE.Vector3(info.c2[0], info.y, info.c2[1]), info.r, 48);
    return info.pts.map(([u, v]) => polyfaceTo3D(info.orientation, info.base, u, v));
  }

  // Cadena de líneas conectadas que contiene `seed`: se sigue por los nodos donde se unen exactamente dos líneas.
  function pathChain(seed, restrict) {
    const pool = restrict ? Array.from(restrict) : objects.filter(o => o.type === 'line' && isShown(o));
    const byNode = new Map();
    pool.forEach(l => l.params.nodeIds.forEach(id => { if (!byNode.has(id)) byNode.set(id, []); byNode.get(id).push(l); }));
    const used = new Set([seed]);
    let closed = false;
    const walk = (startNode, fromLine) => {
      const out = [], lines = [];
      let cur = startNode, line = fromLine;
      for (;;) {
        const here = byNode.get(cur) || [];
        if (here.length !== 2) break;
        const next = here.find(l => l !== line);
        if (!next) break;
        if (used.has(next)) { closed = true; break; }
        used.add(next);
        const other = next.params.nodeIds[0] === cur ? next.params.nodeIds[1] : next.params.nodeIds[0];
        out.push(other); lines.push(next);
        cur = other; line = next;
      }
      return { out, lines };
    };
    const [a, b] = seed.params.nodeIds;
    const fw = walk(b, seed);
    if (closed) {
      // fw.out termina en `a`: el anillo es a, b, ...resto
      return { lines: [seed, ...fw.lines], nodeIds: [a, b, ...fw.out.slice(0, -1)], closed: true };
    }
    const bw = walk(a, seed);
    const ids = [...bw.out.reverse(), a, b, ...fw.out];
    // Un anillo que pasa por un nodo con ramal (p. ej. donde se apoya el perfil) también es una trayectoria cerrada.
    if (ids.length > 3 && ids[0] === ids[ids.length - 1]) return { lines: [...bw.lines.reverse(), seed, ...fw.lines], nodeIds: ids.slice(0, -1), closed: true };
    return { lines: [...bw.lines.reverse(), seed, ...fw.lines], nodeIds: ids, closed: false };
  }

  function newellNormal(pts) {
    const n = new THREE.Vector3();
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      n.x += (p.y - q.y) * (p.z + q.z);
      n.y += (p.z - q.z) * (p.x + q.x);
      n.z += (p.x - q.x) * (p.y + q.y);
    }
    return n;
  }

  // Barrido con juntas a inglete: cada anillo se obtiene proyectando el anterior, a lo largo del tramo,
  // sobre el plano bisector del vértice (así el grosor se conserva en las esquinas).
  function sweepSolid(loop, P, closed) {
    const m = P.length, nSeg = closed ? m : m - 1;
    if (m < 2 || loop.length < 3) return null;
    const dirs = [];
    for (let i = 0; i < nSeg; i++) {
      const d = P[(i + 1) % m].clone().sub(P[i]);
      if (d.lengthSq() < 1e-12) return null;
      dirs.push(d.normalize());
    }
    const L = loop.map(v => v.clone());
    const nl = newellNormal(L);
    if (nl.lengthSq() < 1e-12) return null;
    nl.normalize();
    const planeN = (i) => {
      if (!closed && i === m - 1) return dirs[m - 2].clone();
      const n = dirs[(i - 1 + nSeg) % nSeg].clone().add(dirs[i % nSeg]);
      return n.lengthSq() < 1e-6 ? null : n.normalize();
    };
    const proj = (pts, d, Q, N) => {
      const den = d.dot(N);
      if (Math.abs(den) < 1e-3) return null;
      return pts.map(p => p.clone().addScaledVector(d, Q.clone().sub(p).dot(N) / den));
    };
    const rings = [];
    if (closed) {
      // El perfil se lleva al plano bisector del vértice de partida, proyectando por el tramo que menos lo roce.
      const dp = Math.abs(nl.dot(dirs[0])) >= Math.abs(nl.dot(dirs[m - 1])) ? dirs[0] : dirs[m - 1];
      if (Math.abs(nl.dot(dp)) < 0.05) return null;       // el perfil contiene la trayectoria
      const N0 = planeN(0); if (!N0) return null;
      const r0 = proj(L, dp, P[0], N0); if (!r0) return null;
      if (newellNormal(r0).dot(dirs[0]) < 0) r0.reverse();
      rings.push(r0);
    } else {
      if (Math.abs(nl.dot(dirs[0])) < 0.05) return null;   // el perfil es paralelo a la trayectoria
      if (nl.dot(dirs[0]) < 0) L.reverse();
      rings.push(L);
    }
    for (let i = 1; i < m; i++) {
      const N = planeN(i); if (!N) return null;
      const r = proj(rings[i - 1], dirs[i - 1], P[i], N); if (!r) return null;
      rings.push(r);
    }
    const n = rings[0].length, verts = [], tris = [];
    rings.forEach(r => r.forEach(v => verts.push([v.x, v.y, v.z])));
    const idx = (r, k) => r * n + (k % n);
    const bands = closed ? m : m - 1;
    for (let b = 0; b < bands; b++) {
      const r0 = b, r1 = (b + 1) % m;
      for (let k = 0; k < n; k++) tris.push([idx(r0, k), idx(r0, k + 1), idx(r1, k + 1)], [idx(r0, k), idx(r1, k + 1), idx(r1, k)]);
    }
    if (!closed) {
      const cap = (ri, outward) => {
        const ring = rings[ri], nn = newellNormal(ring).normalize();
        const u = Math.abs(nn.x) < 0.9 ? new THREE.Vector3(1, 0, 0).cross(nn).normalize() : new THREE.Vector3(0, 1, 0).cross(nn).normalize();
        const v = nn.clone().cross(u);
        const contour = ring.map(p => new THREE.Vector2(p.dot(u), p.dot(v)));
        THREE.ShapeUtils.triangulateShape(contour, []).forEach(t => {
          const a = ring[t[0]], b = ring[t[1]], c = ring[t[2]];
          const tn = b.clone().sub(a).cross(c.clone().sub(a));
          if (tn.dot(outward) < 0) tris.push([idx(ri, t[0]), idx(ri, t[2]), idx(ri, t[1])]);
          else tris.push([idx(ri, t[0]), idx(ri, t[1]), idx(ri, t[2])]);
        });
      };
      cap(0, dirs[0].clone().negate());
      cap(m - 1, dirs[m - 2].clone());
    }
    return { verts, tris };
  }

  function followRun() {
    const loop = profileLoop3D(fmFace);
    if (!loop) { say('Sígueme: el perfil debe ser una cara plana.'); return; }
    let P = fmPath.nodeIds.map(nodePos);
    const c = loop.reduce((acc, v) => acc.add(v), new THREE.Vector3()).multiplyScalar(1 / loop.length);
    if (fmPath.closed) {
      let bi = 0, bd = Infinity;
      P.forEach((p, i) => { const d = p.distanceTo(c); if (d < bd) { bd = d; bi = i; } });
      P = P.slice(bi).concat(P.slice(0, bi));
    } else if (P[P.length - 1].distanceTo(c) < P[0].distanceTo(c)) P.reverse();
    const res = sweepSolid(loop, P, fmPath.closed);
    if (!res) { say('Sígueme: no se pudo barrer (perfil paralelo a la trayectoria o giro de 180°).'); return; }
    pushUndo();
    const loopIds = fmFace.type === 'polyface' ? fmFace.params.nodeIds.slice() : [];
    const pathLines = new Set(fmPath.lines);
    const solid = addObject('solid', { verts: res.verts, tris: res.tris }, 0);
    removeObject(fmFace);
    if (loopIds.length) {
      // el contorno del perfil queda dentro del sólido: se retira (menos lo que también sea trayectoria)
      objects.filter(o => o.type === 'line' && !pathLines.has(o) && areAdjacentInLoop(loopIds, o.params.nodeIds[0], o.params.nodeIds[1])).forEach(removeObject);
    }
    fmFace = null; fmPath = null;
    hideFaceHighlight();
    setSelection([solid]);
    say('Sígueme: sólido creado (' + res.tris.length + ' triángulos).');
  }

  function followClick(x, y) {
    const preLines = selectedObjects.filter(o => o.type === 'line');
    const o = pickObject(x, y);
    if (!o) return;
    if (o.type === 'line') {
      fmPath = pathChain(o, null);
      setSelection(fmPath.lines);
    } else if (profileLoop3D(o)) {
      fmFace = o;
      showFaceHighlight(buildFaceHighlightMesh(o, 'top'));
    } else { say('Sígueme: el perfil debe ser una cara plana (altura 0).'); return; }
    if (!fmPath && fmFace && preLines.length) fmPath = pathChain(preLines[0], new Set(preLines));
    if (fmFace && fmPath) followRun();
    else say(fmFace ? 'Ahora haz clic en la trayectoria (una línea o arco).' : 'Ahora haz clic en la cara que será el perfil.');
  }

  function followHover() {
    if (fmFace) return;
    const hit = pickObjectWithFace(lastMouseX, lastMouseY);
    showFaceHighlight(hit && profileLoop3D(hit.obj) ? buildFaceHighlightMesh(hit.obj, 'top') : null);
  }


  // ═════════════ Vistas, estilos, plano de sección y escenas ═════════════
  let camAnim = null;
  const STD_VIEWS = { top: [0, 1, 0], front: [0, 0, 1], back: [0, 0, -1], left: [-1, 0, 0], right: [1, 0, 0], iso: [1, 0.85, 1] };

  function sceneBounds() {
    const b = new THREE.Box3();
    shownObjects().forEach(o => b.expandByObject(o.mesh));
    if (b.isEmpty()) b.set(new THREE.Vector3(-8, 0, -8), new THREE.Vector3(8, 4, 8));
    return b;
  }

  function animateCamera(pos, target, zoom, ms) {
    camAnim = {
      t0: performance.now(), dur: ms == null ? 450 : ms,
      fp: camera.position.clone(), tp: pos.clone(),
      ft: controls.target.clone(), tt: target.clone(),
      fz: camera.zoom, tz: zoom == null ? camera.zoom : zoom,
    };
  }
  function stepCameraAnim(now) {
    if (!camAnim) return;
    let t = Math.min(1, (now - camAnim.t0) / Math.max(camAnim.dur, 1));
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    camera.position.lerpVectors(camAnim.fp, camAnim.tp, e);
    controls.target.lerpVectors(camAnim.ft, camAnim.tt, e);
    if (camera === orthoCam) { camera.zoom = camAnim.fz + (camAnim.tz - camAnim.fz) * e; camera.updateProjectionMatrix(); }
    if (t >= 1) camAnim = null;
  }
  controls.addEventListener('start', () => { camAnim = null; });

  function viewportAspect() { return Math.max(viewport.clientWidth, 1) / Math.max(viewport.clientHeight, 1); }

  function setProjection(ortho) {
    if ((camera === orthoCam) === !!ortho) return;
    const from = camera, to = ortho ? orthoCam : perspCam;
    to.up.copy(from.up);
    if (ortho) {
      orthoRefDist = Math.max(from.position.distanceTo(controls.target), 0.5);
      to.position.copy(from.position); to.quaternion.copy(from.quaternion);
      orthoCam.zoom = 1; fitOrthoFrustum(viewportAspect());
    } else {
      const dir = from.position.clone().sub(controls.target).normalize();
      to.position.copy(controls.target).addScaledVector(dir, orthoRefDist / Math.max(orthoCam.zoom, 1e-3));
      to.quaternion.copy(from.quaternion);
    }
    camera = to; controls.object = to;
    controls.update();
    refreshPanel();
  }

  function fitDistance(radius) {
    return Math.max(radius, 1.5) / Math.sin(THREE.MathUtils.degToRad(perspCam.fov / 2)) * 1.15;
  }
  function goView(name) {
    const b = sceneBounds(), c = b.getCenter(new THREE.Vector3());
    const dist = fitDistance(b.getSize(new THREE.Vector3()).length() / 2);
    const dir = new THREE.Vector3(...STD_VIEWS[name]).normalize();
    if (camera === orthoCam) { orthoRefDist = dist; fitOrthoFrustum(viewportAspect()); }
    animateCamera(c.clone().addScaledVector(dir, dist), c, 1);
  }
  function zoomExtents() {
    const b = sceneBounds(), c = b.getCenter(new THREE.Vector3());
    const dist = fitDistance(b.getSize(new THREE.Vector3()).length() / 2);
    const dir = camera.position.clone().sub(controls.target);
    if (dir.lengthSq() < 1e-9) dir.set(1, 1, 1);
    dir.normalize();
    if (camera === orthoCam) { orthoRefDist = dist; fitOrthoFrustum(viewportAspect()); }
    animateCamera(c.clone().addScaledVector(dir, dist), c, 1);
  }

  function setStyle(mode) {
    styleMode = mode;
    applyAllDisplay();
    refreshPanel();
  }

  // ── plano de sección: recorta todo lo que queda de un lado ──
  let sectionState = { on: false, axis: 'y', pos: 1, flip: false, show: true };
  const secPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
  let secHelper = null;
  const AXIS_VEC = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
  function updateSection() {
    const st = sectionState, av = AXIS_VEC[st.axis];
    const sign = st.flip ? 1 : -1;               // por defecto se retira la parte de mayor coordenada
    secPlane.normal.copy(av).multiplyScalar(sign);
    secPlane.constant = -sign * st.pos;
    renderer.clippingPlanes = st.on ? [secPlane] : [];
    if (secHelper) { scene.remove(secHelper); disposeMesh(secHelper); secHelper = null; }
    if (st.on && st.show) {
      const g = new THREE.Group();
      const quad = new THREE.Mesh(new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE), new THREE.MeshBasicMaterial({ color: COLOR_SELECTED, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false }));
      const h = GRID_SIZE / 2;
      const border = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([[-h, -h], [h, -h], [h, h], [-h, h]].map(([x, y]) => new THREE.Vector3(x, y, 0))), new THREE.LineBasicMaterial({ color: COLOR_SELECTED }));
      g.add(quad, border);
      g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), av);
      g.position.copy(av).multiplyScalar(st.pos + sign * -0.01);   // apenas del lado que se conserva
      g.traverse(n => { n.raycast = () => {}; });
      secHelper = g;
      scene.add(secHelper);
    }
  }

  // ── escenas: cámara + proyección + estilo + capas visibles + sección ──
  function captureScene(name) {
    return {
      id: nextSceneId++, name,
      pos: camera.position.toArray(), target: controls.target.toArray(),
      ortho: camera === orthoCam, zoom: orthoCam.zoom, refDist: orthoRefDist,
      style: styleMode, layers: Object.fromEntries(layers.map(l => [l.id, l.visible])),
      section: { ...sectionState },
    };
  }
  function addScene(nameArg) {
    const name = (nameArg != null ? nameArg : prompt('Nombre de la escena:', 'Escena ' + nextSceneId) || '').trim();
    if (!name) return;
    scenes.push(captureScene(name));
    refreshPanel();
  }
  function updateScene(id) {
    const i = scenes.findIndex(s => s.id === id);
    if (i < 0) return;
    const fresh = captureScene(scenes[i].name); fresh.id = id; nextSceneId--;
    scenes[i] = fresh;
    refreshPanel();
  }
  function deleteScene(id) { scenes = scenes.filter(s => s.id !== id); refreshPanel(); }
  function renameScene(id) {
    const sc = scenes.find(s => s.id === id); if (!sc) return;
    const name = (prompt('Nombre de la escena:', sc.name) || '').trim();
    if (name) { sc.name = name; refreshPanel(); }
  }
  function applyScene(id, instant) {
    const sc = scenes.find(s => s.id === id);
    if (!sc) return;
    layers.forEach(l => { if (sc.layers[l.id] !== undefined) l.visible = sc.layers[l.id]; });
    styleMode = sc.style;
    sectionState = { ...sc.section };
    updateSection();
    if (sc.ortho !== (camera === orthoCam)) setProjection(sc.ortho);
    if (sc.ortho) { orthoRefDist = sc.refDist; fitOrthoFrustum(viewportAspect()); }
    animateCamera(new THREE.Vector3(...sc.pos), new THREE.Vector3(...sc.target), sc.zoom, instant ? 1 : 600);
    setSelection(selectedObjects.filter(isShown));
    applyAllDisplay();
    refreshPanel();
  }

  // ═════════════ Panel lateral: Capas · Grupos · Escenas · Vista ═════════════
  let panelTab = 'capas';
  let panelCollapsed = false;
  function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  const EYE_ON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19 19 0 0 1 5.1-5.9M9.9 4.2A10 10 0 0 1 12 4c7 0 11 7 11 7a19 19 0 0 1-3.2 4.2"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  function panelHTML() {
    const tabs = [['capas', 'Capas'], ['grupos', 'Grupos'], ['escenas', 'Escenas'], ['vista', 'Vista']];
    let h = '<div class="p-head" data-act="collapse"><span>Organizar</span><span class="p-chev">' + (panelCollapsed ? '▸' : '▾') + '</span></div>';
    if (panelCollapsed) return h;
    h += '<div class="p-tabs">' + tabs.map(([k, n]) => '<button class="p-tab' + (panelTab === k ? ' on' : '') + '" data-act="tab" data-id="' + k + '">' + n + '</button>').join('') + '</div><div class="p-body">';
    if (panelTab === 'capas') {
      layers.forEach(l => {
        const n = objects.filter(o => (o.layer || 0) === l.id).length;
        h += '<div class="p-row' + (currentLayer === l.id ? ' cur' : '') + '"><button class="p-ico" data-act="layer-vis" data-id="' + l.id + '" title="Mostrar / ocultar">' + (l.visible ? EYE_ON : EYE_OFF) + '</button>'
          + '<span class="p-name" data-act="layer-cur" data-id="' + l.id + '" title="Clic: capa activa · doble clic: renombrar">' + esc(l.name) + '</span><span class="p-n">' + n + '</span>'
          + (l.id ? '<button class="p-ico" data-act="layer-del" data-id="' + l.id + '" title="Eliminar capa">×</button>' : '<span class="p-ico"></span>') + '</div>';
      });
      h += '<div class="p-btns"><button data-act="layer-add">+ Capa</button><button data-act="layer-move">Mover selección a la capa activa</button></div>';
      h += '<div class="p-note">Lo que dibujes va a la capa activa (la marcada).</div>';
    } else if (panelTab === 'grupos') {
      h += '<div class="p-btns"><button data-act="group-make">Agrupar</button><button data-act="comp-make">Crear componente</button><button data-act="group-explode">Descomponer</button></div>';
      h += '<div class="p-sub">Grupos y componentes en el modelo</div>';
      const gl = Array.from(groups.values());
      if (!gl.length) h += '<div class="p-note">Sin grupos todavía. Selecciona algo y pulsa Agrupar (Ctrl+G).</div>';
      gl.forEach(g => {
        const n = groupMembers(g.id).length;
        h += '<div class="p-row' + (editingGroup === g.id ? ' cur' : '') + '"><span class="p-name" data-act="group-sel" data-id="' + g.id + '" title="Clic: seleccionar · doble clic: renombrar">' + esc(g.name) + (g.comp ? ' <i>▣</i>' : '') + '</span><span class="p-n">' + n + '</span>'
          + '<button class="p-ico" data-act="group-edit" data-id="' + g.id + '" title="Editar contenido">✎</button></div>';
      });
      h += '<div class="p-sub">Definiciones de componentes</div>';
      const cl = Array.from(components.values());
      if (!cl.length) h += '<div class="p-note">Un componente se repite: al editar una copia, las demás se actualizan.</div>';
      cl.forEach(c => {
        const n = Array.from(groups.values()).filter(g => g.comp === c.id).length;
        h += '<div class="p-row"><span class="p-name">' + esc(c.name) + '</span><span class="p-n">' + n + '×</span>'
          + '<button class="p-mini" data-act="comp-insert" data-id="' + c.id + '">Insertar</button><button class="p-ico" data-act="comp-del" data-id="' + c.id + '" title="Eliminar definición">×</button></div>';
      });
      h += '<div class="p-btns"><button data-act="hide-sel">Ocultar selección (H)</button><button data-act="show-all">Mostrar todo (Shift+H)</button></div>';
    } else if (panelTab === 'escenas') {
      h += '<div class="p-btns"><button data-act="scene-add">+ Escena con la vista actual</button></div>';
      if (!scenes.length) h += '<div class="p-note">Una escena guarda la cámara, el estilo, las capas visibles y el plano de sección. Haz clic en una para volver a ella.</div>';
      scenes.forEach(sc => {
        h += '<div class="p-row"><span class="p-name" data-act="scene-go" data-id="' + sc.id + '" title="Clic: ir a la escena · doble clic: renombrar">' + esc(sc.name) + '</span>'
          + '<button class="p-ico" data-act="scene-upd" data-id="' + sc.id + '" title="Actualizar con la vista actual">⟳</button><button class="p-ico" data-act="scene-del" data-id="' + sc.id + '" title="Eliminar">×</button></div>';
      });
    } else {
      h += '<div class="p-sub">Vistas estándar</div><div class="p-grid">'
        + [['top', 'Superior'], ['front', 'Frontal'], ['back', 'Posterior'], ['left', 'Izquierda'], ['right', 'Derecha'], ['iso', 'Isométrica']].map(([k, n]) => '<button data-act="view" data-id="' + k + '">' + n + '</button>').join('') + '</div>';
      h += '<div class="p-btns"><button data-act="extents">Encuadrar todo</button></div>';
      h += '<div class="p-sub">Cámara</div><div class="p-seg"><button class="' + (camera === perspCam ? 'on' : '') + '" data-act="proj" data-id="persp">Perspectiva</button><button class="' + (camera === orthoCam ? 'on' : '') + '" data-act="proj" data-id="ortho">Paralela</button></div>';
      h += '<div class="p-sub">Estilo</div><div class="p-grid">'
        + [['shaded', 'Sombreado'], ['hidden', 'Líneas ocultas'], ['xray', 'Rayos X'], ['wire', 'Alámbrico']].map(([k, n]) => '<button class="' + (styleMode === k ? 'on' : '') + '" data-act="style" data-id="' + k + '">' + n + '</button>').join('') + '</div>';
      const st = sectionState;
      h += '<div class="p-sub">Plano de sección</div>'
        + '<label class="p-chk"><input type="checkbox" id="secOn"' + (st.on ? ' checked' : '') + '> Activar corte</label>'
        + '<div class="p-seg">' + ['x', 'y', 'z'].map(a => '<button class="' + (st.axis === a ? 'on' : '') + '" data-act="sec-axis" data-id="' + a + '">' + (a === 'x' ? 'X rojo' : a === 'y' ? 'Y azul' : 'Z verde') + '</button>').join('') + '</div>'
        + '<div class="p-slide"><input type="range" id="secPos" min="-20" max="20" step="0.05" value="' + st.pos + '"><span id="secPosVal">' + Number(st.pos).toFixed(2) + '</span></div>'
        + '<label class="p-chk"><input type="checkbox" id="secFlip"' + (st.flip ? ' checked' : '') + '> Invertir lado</label>'
        + '<label class="p-chk"><input type="checkbox" id="secShow"' + (st.show ? ' checked' : '') + '> Mostrar el plano</label>';
    }
    return h + '</div>';
  }

  function refreshPanel() {
    updateGroupBanner();
    if (!panelEl) return;
    panelEl.innerHTML = panelHTML();
  }

  function updateGroupBanner() {
    const el = document.getElementById('groupBanner');
    if (!el) return;
    const g = editingGroup != null ? groups.get(editingGroup) : null;
    el.style.display = g ? 'flex' : 'none';
    if (g) el.querySelector('b').textContent = g.name + (g.comp ? ' (componente)' : '');
  }

  panelEl = document.createElement('div');
  panelEl.className = 'panel';
  panelEl.id = 'panel';
  viewport.appendChild(panelEl);

  panelEl.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act, id = t.dataset.id, nid = Number(id);
    if (e.detail >= 2 && (act === 'layer-cur' || act === 'group-sel' || act === 'scene-go')) {
      if (act === 'layer-cur') renameLayer(nid); else if (act === 'group-sel') renameGroup(nid); else renameScene(nid);
      return;
    }
    if (act === 'collapse') { panelCollapsed = !panelCollapsed; }
    else if (act === 'tab') { panelTab = id; }
    else if (act === 'layer-vis') { setLayerVisible(nid, !layerById(nid).visible); return; }
    else if (act === 'layer-cur') { currentLayer = nid; }
    else if (act === 'layer-del') { deleteLayer(nid); return; }
    else if (act === 'layer-add') { addLayer(); return; }
    else if (act === 'layer-move') { moveSelectionToLayer(currentLayer); return; }
    else if (act === 'group-make') { makeGroup(); return; }
    else if (act === 'group-explode') { explodeGroup(); return; }
    else if (act === 'comp-make') { makeComponent(); return; }
    else if (act === 'comp-insert') { insertComponent(nid); return; }
    else if (act === 'comp-del') { deleteComponentDef(nid); return; }
    else if (act === 'group-sel') { setSelection(groupMembers(nid).filter(isShown)); }
    else if (act === 'group-edit') { setTool('select'); enterGroup(nid); return; }
    else if (act === 'hide-sel') { hideSelection(); }
    else if (act === 'show-all') { showAllHidden(); }
    else if (act === 'scene-add') { addScene(); return; }
    else if (act === 'scene-go') { applyScene(nid); return; }
    else if (act === 'scene-upd') { updateScene(nid); return; }
    else if (act === 'scene-del') { deleteScene(nid); return; }
    else if (act === 'view') { goView(id); return; }
    else if (act === 'extents') { zoomExtents(); return; }
    else if (act === 'proj') { setProjection(id === 'ortho'); return; }
    else if (act === 'style') { setStyle(id); return; }
    else if (act === 'sec-axis') { sectionState.axis = id; updateSection(); }
    refreshPanel();
  });
  panelEl.addEventListener('input', (e) => {
    if (e.target.id === 'secPos') {
      sectionState.pos = parseFloat(e.target.value) || 0;
      document.getElementById('secPosVal').textContent = sectionState.pos.toFixed(2);
      updateSection();
    }
  });
  panelEl.addEventListener('change', (e) => {
    if (e.target.id === 'secOn') { sectionState.on = e.target.checked; updateSection(); }
    else if (e.target.id === 'secFlip') { sectionState.flip = e.target.checked; updateSection(); }
    else if (e.target.id === 'secShow') { sectionState.show = e.target.checked; updateSection(); }
  });
  ['pointerdown', 'pointerup', 'dblclick'].forEach(ev => panelEl.addEventListener(ev, e => e.stopPropagation()));
  document.getElementById('btnExitGroup').addEventListener('click', exitGroupEdit);


  // ───────────────────────── File menu ─────────────────────────
  const fileMenuBtn = document.getElementById('fileMenuBtn');
  const fileMenuDropdown = document.getElementById('fileMenuDropdown');
  const editMenuBtn = document.getElementById('editMenuBtn');
  const editMenuDropdown = document.getElementById('editMenuDropdown');
  function closeMenus() {
    [fileMenuDropdown, editMenuDropdown].forEach(d => d.classList.remove('show'));
    [fileMenuBtn, editMenuBtn].forEach(b => b.classList.remove('open'));
  }
  [[fileMenuBtn, fileMenuDropdown], [editMenuBtn, editMenuDropdown]].forEach(([btn, dd]) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = dd.classList.contains('show');
      closeMenus();
      if (!wasOpen) { dd.classList.add('show'); btn.classList.add('open'); }
    });
  });
  document.addEventListener('click', closeMenus);
  document.getElementById('btnCopy').addEventListener('click', copySelection);
  document.getElementById('btnPaste').addEventListener('click', () => startPaste(false));
  document.getElementById('btnPasteInPlace').addEventListener('click', () => startPaste(true));
  document.getElementById('btnSelectAll').addEventListener('click', selectAll);
  document.getElementById('btnInvertSel').addEventListener('click', invertSelection);
  document.getElementById('btnFlipX').addEventListener('click', () => flipSelection('x'));
  document.getElementById('btnFlipZ').addEventListener('click', () => flipSelection('z'));
  document.getElementById('btnFlipY').addEventListener('click', () => flipSelection('y'));
  document.getElementById('btnGroup').addEventListener('click', makeGroup);
  document.getElementById('btnExplode').addEventListener('click', explodeGroup);
  document.getElementById('btnMakeComp').addEventListener('click', () => makeComponent());
  document.getElementById('btnHideSel').addEventListener('click', hideSelection);
  document.getElementById('btnShowAll').addEventListener('click', showAllHidden);

  function doNew() {
    if (objects.length && !confirm('¿Descartar el dibujo actual y empezar uno nuevo?')) return;
    if (objects.length) pushUndo();
    clearAll();
  }

  function serialize() {
    return JSON.stringify({
      app: 'porticad-modelador-3d', version: 3,
      nodes: Array.from(nodes.values()),
      objects: objects.map(o => ({ type: o.type, params: o.params, height: o.height, layer: o.layer || 0, hidden: !!o.hidden, gid: o.gid || 0 })),
      layers, currentLayer,
      groups: Array.from(groups.values()),
      components: Array.from(components.values()),
      scenes,
      view: { style: styleMode, ortho: camera === orthoCam, section: sectionState, pos: camera.position.toArray(), target: controls.target.toArray(), refDist: orthoRefDist, zoom: orthoCam.zoom },
    }, null, 2);
  }

  function downloadJSON(filename) {
    const blob = new Blob([serialize()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  let currentFilename = 'modelo.json';

  function doSave() { downloadJSON(currentFilename); }

  function doSaveAs() {
    const name = prompt('Nombre del archivo:', currentFilename.replace(/\.json$/, ''));
    if (!name) return;
    currentFilename = name.endsWith('.json') ? name : name + '.json';
    downloadJSON(currentFilename);
  }

  const fileInput = document.getElementById('fileInput');
  function doOpen() { fileInput.click(); }
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.objects)) throw new Error('formato inválido');
        if (objects.length) pushUndo();
        clearAll();
        // Nodes must exist before any line/polyface tries to resolve its nodeIds via meshFor.
        if (Array.isArray(data.nodes)) {
          data.nodes.forEach(n => {
            nodes.set(n.id, { id: n.id, x: n.x, y: n.y, z: n.z });
            if (n.id >= nextNodeId) nextNodeId = n.id + 1;
          });
        }
        // Organización (versión 3): capas, grupos, componentes y escenas — antes que los objetos que las usan.
        if (Array.isArray(data.layers) && data.layers.length) { layers = data.layers; nextLayerId = 1 + layers.reduce((m, l) => Math.max(m, l.id), 0); currentLayer = layers.some(l => l.id === data.currentLayer) ? data.currentLayer : 0; }
        if (Array.isArray(data.groups)) { groups = new Map(data.groups.map(g => [g.id, g])); nextGroupId = 1 + data.groups.reduce((m, g) => Math.max(m, g.id), 0); }
        if (Array.isArray(data.components)) { components = new Map(data.components.map(c => [c.id, c])); nextCompId = 1 + data.components.reduce((m, c) => Math.max(m, c.id), 0); }
        scenes = Array.isArray(data.scenes) ? data.scenes : []; nextSceneId = 1 + scenes.reduce((m, sc) => Math.max(m, sc.id), 0);
        if (data.view) {
          styleMode = data.view.style || 'shaded';
          sectionState = Object.assign({ on: false, axis: 'y', pos: 1, flip: false, show: true }, data.view.section || {});
          updateSection();
        }
        data.objects.forEach(o => addObject(o.type, o.params, o.height || 0, { layer: o.layer || 0, hidden: !!o.hidden, gid: o.gid || 0 }));
        objects.filter(o => (o.type === 'rect' || o.type === 'circle') && !(o.height > 0)).forEach(flatShapeToParts);
    objects.filter(isBody).forEach(o => explodeBody(o));   // archivos antiguos: los cuerpos de una pieza se abren en sus partes
        applyAllDisplay();
        refreshPanel();
        currentFilename = file.name;
      } catch (err) {
        alert('No se pudo abrir el archivo: ' + err.message);
      }
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  document.getElementById('btnNew').addEventListener('click', doNew);
  document.getElementById('btnOpen').addEventListener('click', doOpen);
  document.getElementById('btnSave').addEventListener('click', doSave);
  document.getElementById('btnSaveAs').addEventListener('click', doSaveAs);
  document.getElementById('btnClearGuides').addEventListener('click', () => {
    const guides = objects.filter(o => o.type === 'guide');
    if (!guides.length) return;
    pushUndo();
    guides.forEach(o => removeObject(o));
  });
  btnUndo.addEventListener('click', doUndo);
  btnRedo.addEventListener('click', doRedo);

  // ───────────────────────── Render loop ─────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    stepCameraAnim(performance.now());
    controls.update();
    // Plano cercano/lejano ajustados a la distancia: más precisión de profundidad = menos parpadeo.
    if (camera === perspCam) {
      const d = camera.position.distanceTo(controls.target);
      const near = Math.max(0.05, d * 0.02), far = Math.max(300, d * 120);
      if (Math.abs(near - camera.near) > camera.near * 0.05 || Math.abs(far - camera.far) > camera.far * 0.05) { camera.near = near; camera.far = far; camera.updateProjectionMatrix(); }
    }
    // La malla infinita sigue a la cámara: escala según el zoom (perspectiva: distancia; ortogonal: alto visible).
    gridUniforms.uCam.value.copy(camera.position);
    gridUniforms.uScale.value = camera === orthoCam ? (orthoCam.top - orthoCam.bottom) / orthoCam.zoom * 1.1 : Math.max(camera.position.distanceTo(controls.target), 0.05);
    if (camera === orthoCam) gridUniforms.uCam.value.set(controls.target.x, 0, controls.target.z);
    renderer.render(scene, camera);
  }
  animate();

  setTool('select');
  updateUndoRedoButtons();
  refreshPanel();
})();
</script>
</body>
</html>
