    extrude: 'Pasa el cursor para ver resaltada la cara exacta. Clic para agarrarla, mueve el mouse (la cara sigue al cursor), clic de nuevo para soltar — o escribe un número + Enter. Esc cancela.',
    move: 'Clic sobre una figura y arrastra para reubicarla. Acércate a un eje rojo/verde/azul para moverla solo en esa dirección (incluye subir/bajar del plano).',
    guide: 'Cinta métrica: clic en vacío para trazar una guía punto a punto (como la Línea). Clic sobre una línea o guía existente para crear una paralela a ella — mueve el mouse o escribe un número + Enter para fijar el offset. Archivo › Limpiar guías las borra todas.'
  };

  function updateStatusCount() {
    statusCountEl.textContent = objects.length + ' objeto(s)';
  }

  function setTool(tool) {
    cancelDraw();
    currentTool = tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
    const names = { select:'Seleccionar', line:'Línea', rect:'Rectángulo', rrect:'Rectángulo rotado', circle:'Círculo', polygon:'Polígono', arc2:'Arco 2 puntos', arc3:'Arco 3 puntos', freehand:'Mano alzada', rotate:'Rotar', scale:'Escalar', paste:'Pegar', offset:'Desfase', fillet:'Empalme', erase:'Borrador', extrude:'Extruir', move:'Mover', guide:'Cinta métrica' };
    statusToolEl.textContent = names[tool];
    hintEl.textContent = TOOL_HINTS[tool];
    viewport.classList.toggle('drawing', DRAW_TOOLS.includes(tool));
    if (DRAW_TOOLS.includes(tool)) lastDrawTool = tool;
  }

  document.getElementById('toolbar').addEventListener('click', (e) => {
    const btn = e.target.closest('.tool-btn');
    if (btn) setTool(btn.dataset.tool);
  });

  // Intersects the cursor ray with the horizontal plane at height y (generalizes groundPoint
  // to any elevation, so drawing can continue level with an already-elevated point).
  function planePoint(clientX, clientY, y) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -y);
    const pt = new THREE.Vector3();
    const hit = raycaster.ray.intersectPlane(plane, pt);
    return hit ? pt : null;
  }

  function groundPoint(clientX, clientY) { return planePoint(clientX, clientY, 0); }

  function objRefOf(hit) {
    let n = hit.object;
    while (n && !n.userData.objRef) n = n.parent;
    return n ? n.userData.objRef : null;
  }

  function raycastAll(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    return raycaster.intersectObjects(objects.map(o => o.mesh), true);
  }

  // A kept perimeter line/guide sits flush on its face's own edge once that face has real
  // volume (extruded), so the two compete for the same ray hit almost exactly at tie. Since
  // clicking a thin edge is usually the more deliberate/precise action, prefer a line/guide
  // hit that's about as close as the closest hit, rather than blindly trusting hits[0].
  const COINCIDENT_HIT_EPS = 0.05;
  function pickObject(clientX, clientY) {
    const hits = raycastAll(clientX, clientY);
    if (!hits.length) return null;
    const closestDist = hits[0].distance;
    const edgeHit = hits.find(h => {
      const ref = objRefOf(h);
      return ref && (ref.type === 'line' || ref.type === 'guide') && h.distance <= closestDist + COINCIDENT_HIT_EPS;
    });
    return objRefOf(edgeHit || hits[0]);
  }

  // Like pickObject, but also returns which face was hit (for per-face push/pull). Extrude
  // can never act on a line/guide, so here it's the opposite preference: skip past one if
  // an actual face/solid was also hit, so pushing a face doesn't get blocked by its own
  // kept perimeter edge sitting on top of it.
  function pickObjectWithFace(clientX, clientY) {
    const hits = raycastAll(clientX, clientY);
    if (!hits.length) return null;
    const faceHit = hits.find(h => {
      const ref = objRefOf(h);
      return ref && ref.type !== 'line' && ref.type !== 'guide';
    }) || hits[0];
    const obj = objRefOf(faceHit);
    if (!obj) return null;
    return { obj, normal: faceHit.face ? faceHit.face.normal.clone() : null, point: faceHit.point.clone() };
  }

  // World-space outward normal for a given face kind (used to read the true push/pull
  // direction off the screen, instead of assuming "up on screen" always means "outward").
  function worldNormalForFace(obj, faceKind, hitPoint) {
    if (faceKind === 'top') {
      // For a polyface this is also hit when it's still flat (first-time extrude) — push
      // along the plane's own normal, not always +Y, so a vertical wall extrudes sideways.
      if (obj.type === 'polyface') return (POLYFACE_BASES[obj.params.orientation || 'xz'] || POLYFACE_BASES.xz).z.clone();
      return new THREE.Vector3(0, 1, 0);
    }
    if (faceKind === 'x+') return new THREE.Vector3(1, 0, 0);
    if (faceKind === 'x-') return new THREE.Vector3(-1, 0, 0);
    if (faceKind === 'z+') return new THREE.Vector3(0, 0, 1);
    if (faceKind === 'z-') return new THREE.Vector3(0, 0, -1);
    if (faceKind === 'radius') {
      const dir = new THREE.Vector3(hitPoint.x - obj.params.cx, 0, hitPoint.z - obj.params.cz);
      return dir.lengthSq() > 1e-9 ? dir.normalize() : new THREE.Vector3(1, 0, 0);
    }
    return new THREE.Vector3(0, 1, 0);
  }

  // Exact push/pull amount: intersects the cursor ray with the infinite line through the
  // original hit point along the face's outward normal, and returns the signed distance
  // from the hit point to that intersection. The face then tracks precisely under the
  // cursor along that one axis — no arbitrary pixel-to-world scale factor to get "backwards".
  function computePushDelta(hitPoint, worldNormal, clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const onAxis = closestPointOnLineToRay(hitPoint, worldNormal, raycaster.ray.origin, raycaster.ray.direction.clone().normalize());
    return onAxis.clone().sub(hitPoint).dot(worldNormal);
  }

  // Outward-pointing 2D normal of polygon edge k (points[k] -> points[k+1]), in XZ.
  // "Outward" is resolved as "away from the polygon's centroid" so it's correct
  // regardless of the vertex winding order.
  function polygonEdgeNormal(points, k) {
    const n = points.length;
    const a = points[k], b = points[(k + 1) % n];
    const dx = b[0] - a[0], dz = b[1] - a[1];
    const len = Math.hypot(dx, dz) || 1;
    let nx = dz / len, nz = -dx / len;
    let cx = 0, cz = 0;
    points.forEach(p => { cx += p[0]; cz += p[1]; });
    cx /= n; cz /= n;
    const midX = (a[0] + b[0]) / 2 - cx, midZ = (a[1] + b[1]) / 2 - cz;
    if (nx * midX + nz * midZ < 0) { nx = -nx; nz = -nz; }
    return [nx, nz];
  }

  // Intersection of line1 (p1 + t*d1) and line2 (p2 + s*d2), or null if ~parallel.
  function lineIntersect2D(p1, d1, p2, d2) {
    const denom = d1[0] * d2[1] - d1[1] * d2[0];
    if (Math.abs(denom) < 1e-9) return null;
    const dx = p2[0] - p1[0], dz = p2[1] - p1[1];
    const t = (dx * d2[1] - dz * d2[0]) / denom;
    return [p1[0] + d1[0] * t, p1[1] + d1[1] * t];
  }

  // Pushes/pulls one wall of a closed polygon by `distance` along its outward normal,
  // keeping it connected to its neighbors: only the shared edge's LINE shifts, and the
  // two adjacent vertices are recomputed as intersections with the (unmoved) neighbor
  // edges — so the rest of the polygon stays put, exactly like an independent wall push.
  function offsetPolygonEdge(points, edgeIndex, distance) {
    const n = points.length;
    const [nx, nz] = polygonEdgeNormal(points, edgeIndex);
    const a = points[edgeIndex], b = points[(edgeIndex + 1) % n];
    const shiftedA = [a[0] + nx * distance, a[1] + nz * distance];
    const dir = [b[0] - a[0], b[1] - a[1]];

    const prevA = points[(edgeIndex - 1 + n) % n];
    const prevDir = [a[0] - prevA[0], a[1] - prevA[1]];
    const newA = lineIntersect2D(prevA, prevDir, shiftedA, dir) || shiftedA;

    const nextB = points[(edgeIndex + 2) % n];
    const nextDir = [nextB[0] - b[0], nextB[1] - b[1]];
    const shiftedB = [b[0] + nx * distance, b[1] + nz * distance];
    const newB = lineIntersect2D(shiftedA, dir, b, nextDir) || shiftedB;

    const result = points.map(p => p.slice());
    result[edgeIndex] = newA;
    result[(edgeIndex + 1) % n] = newB;
    return result;
  }

  // Which face was hit, decided from the hit POINT's position, not the raycaster's face
  // normal — ExtrudeGeometry (used for closed-loop faces) can hand back an inverted local
  // normal depending on winding, which was making the wrong (opposite) wall get pushed.
  // Position is ground truth regardless of any geometry's winding quirks.
  function determineFace(obj, hitPoint) {
    if (!hitPoint || obj.height <= 0) return 'top'; // flat face: only "pull up to create height" applies
    const baseY = (obj.params && obj.params.baseY) || 0;
    const topY = baseY + obj.height;
    const capDist = Math.min(Math.abs(hitPoint.y - topY), Math.abs(hitPoint.y - baseY));

    if (obj.type === 'rect') {
      const { x1, z1, x2, z2 } = obj.params;
      const xMin = Math.min(x1, x2), xMax = Math.max(x1, x2), zMin = Math.min(z1, z2), zMax = Math.max(z1, z2);
      const candidates = [
        { kind: 'top', d: capDist },
        { kind: 'x-', d: Math.abs(hitPoint.x - xMin) }, { kind: 'x+', d: Math.abs(hitPoint.x - xMax) },
        { kind: 'z-', d: Math.abs(hitPoint.z - zMin) }, { kind: 'z+', d: Math.abs(hitPoint.z - zMax) },
      ];
      candidates.sort((a, b) => a.d - b.d);
      return candidates[0].kind;
    }
    if (obj.type === 'circle') {
      const { cx, cz, radius } = obj.params;
      const radiusDist = Math.abs(Math.hypot(hitPoint.x - cx, hitPoint.z - cz) - radius);
      return capDist < radiusDist ? 'top' : 'radius';
    }
    if (obj.type === 'polyface') {
      const orientation = obj.params.orientation || 'xz';
      const base = obj.params.base || 0;
      const alongNormal = polyfaceNormalCoord(orientation, hitPoint);
      const faceCapDist = Math.min(Math.abs(alongNormal - (base + obj.height)), Math.abs(alongNormal - base));
      const [hu, hv] = polyfaceTo2D(orientation, hitPoint);
      const pts = polyfacePoints2D(obj);
      let bestIdx = 0, bestDist = Infinity;
      for (let k = 0; k < pts.length; k++) {
        const a = pts[k], b = pts[(k + 1) % pts.length];
        const cp = closestPointOnSegment2D(hu, hv, a, b);
        const d = Math.hypot(hu - cp[0], hv - cp[1]);
        if (d < bestDist) { bestDist = d; bestIdx = k; }
      }
      return faceCapDist < bestDist ? 'top' : 'wall' + bestIdx;
    }
    return 'top';
  }

  function closestPointOnSegment2D(px, pz, a, b) {
    const dx = b[0] - a[0], dz = b[1] - a[1];
    const lenSq = dx * dx + dz * dz || 1;
    const t = Math.max(0, Math.min(1, ((px - a[0]) * dx + (pz - a[1]) * dz) / lenSq));
    return [a[0] + dx * t, a[1] + dz * t];
  }

  // Resolves a face kind to the exact param field to edit, the base value to drag from,
  // and the sign that makes "drag away from the box" increase that field.
  function faceInfo(obj, faceKind) {
    if (faceKind === 'top') return { field: 'height', sign: 1, base: obj.height };
    if (faceKind === 'radius') return { field: 'radius', sign: 1, base: obj.params.radius };
    const p = obj.params;
    if (faceKind === 'x+') { const f = p.x1 >= p.x2 ? 'x1' : 'x2'; return { field: f, sign: 1, base: p[f] }; }
    if (faceKind === 'x-') { const f = p.x1 <= p.x2 ? 'x1' : 'x2'; return { field: f, sign: -1, base: p[f] }; }
    if (faceKind === 'z+') { const f = p.z1 >= p.z2 ? 'z1' : 'z2'; return { field: f, sign: 1, base: p[f] }; }
    { const f = p.z1 <= p.z2 ? 'z1' : 'z2'; return { field: f, sign: -1, base: p[f] }; } // 'z-'
  }

  const MIN_FACE_SIZE = 0.05;
  function applyFaceDrag(obj, field, sign, baseValue, delta) {
    const newValue = baseValue + sign * delta;
    if (field === 'height') { obj.height = Math.max(MIN_FACE_SIZE, newValue); return; }
    if (field === 'radius') { obj.params.radius = Math.max(MIN_FACE_SIZE, newValue); return; }
    const otherField = { x1: 'x2', x2: 'x1', z1: 'z2', z2: 'z1' }[field];
    const otherValue = obj.params[otherField];
    obj.params[field] = sign > 0 ? Math.max(newValue, otherValue + MIN_FACE_SIZE) : Math.min(newValue, otherValue - MIN_FACE_SIZE);
  }

  // The first time a polyface actually gains volume, spawn real, independent, erasable
  // 'line' objects for its top perimeter and its vertical edges — before this, extruding a
  // shape only drew a cosmetic (unpickable) EdgesGeometry outline baked into the solid mesh,
  // so the user had no way to select/erase just one edge of the resulting box. Each top
  // corner gets its own real shared node (topNodeIds, parallel to the base nodeIds), kept in
  // lockstep with the solid's actual top surface by refreshExtrudePreview on every later
  // height/wall push — see isDerivedNode for why these nodes can't be dragged independently.
  function spawnPolyfaceTopEdges(face) {
    const orientation = face.params.orientation || 'xz';
    const topOffset = (face.params.base || 0) + face.height;
    const baseIds = face.params.nodeIds;
    const topNodeIds = baseIds.map(id => {
      const [u, v] = polyfaceTo2D(orientation, nodePos(id));
      return createNode(polyfaceTo3D(orientation, topOffset, u, v)).id;
    });
    face.params.topNodeIds = topNodeIds;
    const n = topNodeIds.length;
    for (let i = 0; i < n; i++) {
      addObject('line', { nodeIds: [topNodeIds[i], topNodeIds[(i + 1) % n]] }); // top perimeter
      addObject('line', { nodeIds: [baseIds[i], topNodeIds[i]] }); // vertical edge
    }
  }

  // Snapshot of a polyface's node positions (base, plus top-edge nodes if it has them) for
  // Escape-revert during a push/pull drag.
  function snapshotPolyfaceNodes(face, topOnly) {
    const list = [];
    if (!topOnly) face.params.nodeIds.forEach(id => list.push({ id, pos: nodePos(id) }));
    if (face.params.topNodeIds) face.params.topNodeIds.forEach(id => list.push({ id, pos: nodePos(id) }));
    return list;
  }

  // Applies the current push/pull (from the live cursor, or the typed VCB value if any),
  // rebuilds the mesh, and keeps the face highlight tracking the exact face being pushed.
  function refreshExtrudePreview(clientX, clientY) {
    if (currentTool !== 'extrude' || !extrudeObj) return;
    const delta = typedValue !== '' ? (parseFloat(typedValue) || 0) : computePushDelta(extrudeHitPoint, extrudeWorldNormal, clientX, clientY);
    const orientation = extrudeObj.params.orientation || 'xz';
    const base = extrudeObj.params.base || 0;
    if (extrudeWallIndex !== null) {
      const newPts = offsetPolygonEdge(extrudeBasePoints, extrudeWallIndex, delta);
      const nodeIds = extrudeObj.params.nodeIds;
      newPts.forEach((p, idx) => setNodePos(nodeIds[idx], polyfaceTo3D(orientation, base, p[0], p[1])));
      nodeIds.forEach(id => nodeMoved(id));
      if (extrudeObj.params.topNodeIds) {
        // Keep the top-edge nodes tracking the same (u,v) as their base counterparts, at the
        // solid's top offset, so the top perimeter/vertical edge lines stay glued to the wall.
        const topOffset = base + extrudeObj.height;
        newPts.forEach((p, idx) => setNodePos(extrudeObj.params.topNodeIds[idx], polyfaceTo3D(orientation, topOffset, p[0], p[1])));
        extrudeObj.params.topNodeIds.forEach(id => nodeMoved(id));
      }
    } else {
      applyFaceDrag(extrudeObj, extrudeField, extrudeSign, extrudeBaseValue, delta);
      if (extrudeObj.type === 'polyface' && extrudeObj.params.topNodeIds) {
        // A top push changes only the offset-along-normal component of each top node — same
        // (u,v) as its base counterpart, new offset = base + the just-updated height.
        const topOffset = base + extrudeObj.height;
        extrudeObj.params.nodeIds.forEach((baseId, idx) => {
          const [u, v] = polyfaceTo2D(orientation, nodePos(baseId));
          setNodePos(extrudeObj.params.topNodeIds[idx], polyfaceTo3D(orientation, topOffset, u, v));
        });
        extrudeObj.params.topNodeIds.forEach(id => nodeMoved(id));
      }
    }
    rebuildMesh(extrudeObj);
    selectObject(extrudeObj);
    showFaceHighlight(buildFaceHighlightMesh(extrudeObj, extrudeFaceKind));
    setVCB('Distancia', delta.toFixed(2));
    let txt = 'distancia: ' + delta.toFixed(2);
    if (typedValue !== '') txt += '  → ' + typedValue + ' [Enter]';
    statusCoordsEl.textContent = txt;
  }

  function endExtrudeDrag() {
    if (extrudeObj && extrudeObj.type === 'polyface' && extrudeObj.height > 0 && !extrudeObj.params.topNodeIds) {
      spawnPolyfaceTopEdges(extrudeObj);
    }
    commitPendingUndo();
    extrudeObj = null;
    extrudeSnapshotParams = null;
    extrudeWallIndex = null;
    extrudeBasePoints = null;
    extrudeNodeSnapshot = null;
    extrudeFaceKind = null;
    extrudeHitPoint = null;
    extrudeWorldNormal = null;
    typedValue = '';
    hideFaceHighlight();
    controls.enabled = true;
  }

  // ── Box (marquee) select: drag with the Select tool to grab every object the rectangle touches ──
  const marqueeEl = document.getElementById('marquee');
  const BOX_SELECT_THRESHOLD_PX = 4;
  let selectDragStart = null;   // {x,y} in client coords
  let boxSelectActive = false;

  function screenBoundsOf(obj, canvasRect) {
    const box = new THREE.Box3().setFromObject(obj.mesh);
    const corners = [
      [box.min.x, box.min.y, box.min.z], [box.min.x, box.min.y, box.max.z],
      [box.min.x, box.max.y, box.min.z], [box.min.x, box.max.y, box.max.z],
      [box.max.x, box.min.y, box.min.z], [box.max.x, box.min.y, box.max.z],
      [box.max.x, box.max.y, box.min.z], [box.max.x, box.max.y, box.max.z],
    ];
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const v = new THREE.Vector3();
    corners.forEach(c => {
      v.set(c[0], c[1], c[2]).project(camera);
      const sx = (v.x + 1) / 2 * canvasRect.width;
      const sy = (1 - v.y) / 2 * canvasRect.height;
      minX = Math.min(minX, sx); maxX = Math.max(maxX, sx);
      minY = Math.min(minY, sy); maxY = Math.max(maxY, sy);
    });
    return { minX, minY, maxX, maxY };
  }

  function rectsIntersect(a, b) {
    return !(a.maxX < b.minX || a.minX > b.maxX || a.maxY < b.minY || a.minY > b.maxY);
  }

  function projectToScreen(worldVec3, canvasRect) {
    const v = worldVec3.clone().project(camera);
    return { x: (v.x + 1) / 2 * canvasRect.width, y: (1 - v.y) / 2 * canvasRect.height };
  }

  // Exact 2D segment-vs-rectangle test — a diagonal line's own AABB is mostly empty
  // space, so the loose bbox check used for solids would false-positive on it.
  function segmentIntersectsRect(p1, p2, rect) {
    if (p1.x < rect.minX && p2.x < rect.minX) return false;
    if (p1.x > rect.maxX && p2.x > rect.maxX) return false;
    if (p1.y < rect.minY && p2.y < rect.minY) return false;
    if (p1.y > rect.maxY && p2.y > rect.maxY) return false;
    const inside = (p) => p.x >= rect.minX && p.x <= rect.maxX && p.y >= rect.minY && p.y <= rect.maxY;
    if (inside(p1) || inside(p2)) return true;
    const ccw = (p, q, r) => (r.y - p.y) * (q.x - p.x) > (q.y - p.y) * (r.x - p.x);
    const segsCross = (a, b, c, d) => ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d);
    const corners = [
      { x: rect.minX, y: rect.minY }, { x: rect.maxX, y: rect.minY },
      { x: rect.maxX, y: rect.maxY }, { x: rect.minX, y: rect.maxY },
    ];
    for (let i = 0; i < 4; i++) {
      if (segsCross(p1, p2, corners[i], corners[(i + 1) % 4])) return true;
    }
    return false;
  }

  function updateMarquee(x1, y1, x2, y2) {
    const vpRect = viewport.getBoundingClientRect();
    marqueeEl.style.left = (Math.min(x1, x2) - vpRect.left) + 'px';
    marqueeEl.style.top = (Math.min(y1, y2) - vpRect.top) + 'px';
    marqueeEl.style.width = Math.abs(x2 - x1) + 'px';
    marqueeEl.style.height = Math.abs(y2 - y1) + 'px';
    marqueeEl.style.display = 'block';
  }

  function hideMarquee() { marqueeEl.style.display = 'none'; }

  function finalizeBoxSelect(x1, y1, x2, y2) {
    const canvasRect = dom.getBoundingClientRect();
    const dragBox = {
      minX: Math.min(x1, x2) - canvasRect.left, maxX: Math.max(x1, x2) - canvasRect.left,
      minY: Math.min(y1, y2) - canvasRect.top, maxY: Math.max(y1, y2) - canvasRect.top,
    };
    const matches = objects.filter(o => {
      if (o.type === 'line' || o.type === 'guide') {
        const [pa, pb] = lineEndpoints(o);
        const a = projectToScreen(pa, canvasRect), b = projectToScreen(pb, canvasRect);
        return segmentIntersectsRect(a, b, dragBox);
      }
      return rectsIntersect(screenBoundsOf(o, canvasRect), dragBox);
    });
    setSelection(matches);
  }

  // ── Line-drawing inference: snap to existing endpoints / midpoints / on-edge points ──
  const SNAP_PIXEL_RADIUS = 14;
  const SNAP_COLOR_ENDPOINT = 0x2dd4bf; // teal
  const SNAP_COLOR_MIDPOINT = 0xa78bfa; // violet
  const SNAP_COLOR_ONEDGE = 0xf472b6;   // pink
  const SNAP_LABEL = { endpoint: 'Punto final', midpoint: 'Punto medio', onedge: 'Sobre línea' };

  function screenDistToPoint(clientX, clientY, worldPt) {
    const canvasRect = dom.getBoundingClientRect();
    const s = projectToScreen(worldPt, canvasRect);
    return Math.hypot((clientX - canvasRect.left) - s.x, (clientY - canvasRect.top) - s.y);
  }

  // Nearest real shared node to the cursor (screen-space), for the Move tool's node-drag
  // priority — checked against every node regardless of which object(s) reference it.
  function findNearestNode(clientX, clientY) {
    let best = null;
    nodes.forEach((n, id) => {
      if (isDerivedNode(id)) return; // a top-edge node moves only as part of its whole solid
      const d = screenDistToPoint(clientX, clientY, nodePos(id));
      if (d <= SNAP_PIXEL_RADIUS && (!best || d < best.d)) best = { id, d };
    });
    return best ? best.id : null;
  }

  // The two world-space endpoints of a 'line' (via its shared nodes) or 'guide' (via its
  // own stored coords) — the two types that midpoint/on-edge snapping applies to.
  function lineEndpoints(o) {
    if (o.type === 'line') return [nodePos(o.params.nodeIds[0]), nodePos(o.params.nodeIds[1])];
    return [new THREE.Vector3(...o.params.a), new THREE.Vector3(...o.params.b)];
  }

  function closestPointOnSegment(p, a, b) {
    const ab = new THREE.Vector3().subVectors(b, a);
    const lenSq = ab.lengthSq();
    if (lenSq < 1e-9) return a.clone();
    const t = THREE.MathUtils.clamp(new THREE.Vector3().subVectors(p, a).dot(ab) / lenSq, 0, 1);
    return a.clone().addScaledVector(ab, t);
  }

  // Every vertex of an object worth snapping to, as { point, nodeId } — nodeId is the real
  // shared node to reuse when a new line/face is drawn onto it (null for a synthesized
  // vertex, e.g. rect/circle corners, or a solid's top layer, which don't correspond to a
  // single stored node). For a solid this is every corner at its base AND (if extruded) at
  // its top, so a line can connect down to the ground or up to any corner, same as SketchUp.
  function objectVertices(o) {
    if (o.type === 'line') return o.params.nodeIds.map(id => ({ point: nodePos(id), nodeId: id }));
    if (o.type === 'guide') return [{ point: new THREE.Vector3(...o.params.a), nodeId: null }, { point: new THREE.Vector3(...o.params.b), nodeId: null }];
    const baseY = o.params.baseY || 0;
    const ys = o.height > 0 ? [baseY, baseY + o.height] : [baseY];
    if (o.type === 'rect') {
      const { x1, z1, x2, z2 } = o.params;
      const pts = [];
      ys.forEach(y => pts.push(
        new THREE.Vector3(x1, y, z1), new THREE.Vector3(x1, y, z2),
        new THREE.Vector3(x2, y, z1), new THREE.Vector3(x2, y, z2)
      ));
      return pts.map(point => ({ point, nodeId: null }));
    }
    if (o.type === 'circle') return ys.map(y => ({ point: new THREE.Vector3(o.params.cx, y, o.params.cz), nodeId: null }));
    if (o.type === 'polyface') {
      const orientation = o.params.orientation || 'xz';
      const base = o.params.base || 0;
      const pts = [];
      o.params.nodeIds.forEach(id => pts.push({ point: nodePos(id), nodeId: id }));
      if (o.height > 0) {
        if (o.params.topNodeIds) {
          // Real top-edge nodes exist (spawnPolyfaceTopEdges already ran) — reuse them so a
          // new line snapped onto a box's top corner shares the same point, not a duplicate.
          o.params.topNodeIds.forEach(id => pts.push({ point: nodePos(id), nodeId: id }));
        } else {
          o.params.nodeIds.forEach(id => pts.push({ point: polyfaceTo3D(orientation, base + o.height, ...polyfaceTo2D(orientation, nodePos(id))), nodeId: null }));
        }
      }
      return pts;
    }
    return [];
  }

  // Priority: endpoint > midpoint > on-edge (matches SketchUp's inference order).
  function resolveGeometrySnap(rawPoint, clientX, clientY) {
    let best = null;
    objects.forEach(o => {
      objectVertices(o).forEach(({ point, nodeId }) => {
        const d = screenDistToPoint(clientX, clientY, point);
        if (d <= SNAP_PIXEL_RADIUS && (!best || d < best.d)) best = { point, d, kind: 'endpoint', nodeId };
      });
    });
    if (best) return { point: best.point.clone(), kind: best.kind, nodeId: best.nodeId };

    objects.forEach(o => {
      if (o.type !== 'line' && o.type !== 'guide') return;
      const [a, b] = lineEndpoints(o);
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const d = screenDistToPoint(clientX, clientY, mid);
      if (d <= SNAP_PIXEL_RADIUS && (!best || d < best.d)) best = { point: mid, d, kind: 'midpoint', nodeId: null };
    });
    if (best) return { point: best.point.clone(), kind: best.kind, nodeId: best.nodeId };

    objects.forEach(o => {
      if (o.type !== 'line' && o.type !== 'guide') return;
      const [a, b] = lineEndpoints(o);
      const cp = closestPointOnSegment(rawPoint, a, b);
      const d = screenDistToPoint(clientX, clientY, cp);
      if (d <= SNAP_PIXEL_RADIUS && (!best || d < best.d)) best = { point: cp, d, kind: 'onedge', nodeId: null };
    });
    if (best) return { point: best.point.clone(), kind: best.kind, nodeId: best.nodeId };

    return null;
  }

  // ── Inference feedback (SketchUp/IngeTrazo style): a shape-coded marker per snap kind that
  // keeps a constant on-screen size, a small label next to the cursor, and a long dashed guide
  // along the locked axis. All three live and die together via showSnapMarker/hideSnapMarker.
  const SNAP_SHAPE = { endpoint: 'square', midpoint: 'triangle', onedge: 'cross' };
  const snapSpriteCache = {};
  function snapSpriteTexture(shape, color) {
    const key = shape + color;
    if (snapSpriteCache[key]) return snapSpriteCache[key];
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const css = '#' + color.toString(16).padStart(6, '0');
    g.lineWidth = 7; g.lineJoin = 'round'; g.lineCap = 'round';
    const stroke = () => { g.strokeStyle = '#0d1117'; g.lineWidth = 11; g.stroke(); g.strokeStyle = css; g.lineWidth = 6; g.stroke(); };
    g.beginPath();
    if (shape === 'square') { g.rect(14, 14, 36, 36); stroke(); g.fillStyle = css + '55'; g.fill(); }
    else if (shape === 'triangle') { g.moveTo(32, 10); g.lineTo(54, 50); g.lineTo(10, 50); g.closePath(); stroke(); g.fillStyle = css + '55'; g.fill(); }
    else if (shape === 'cross') { g.moveTo(14, 14); g.lineTo(50, 50); g.moveTo(50, 14); g.lineTo(14, 50); stroke(); }
    else { g.arc(32, 32, 16, 0, Math.PI * 2); stroke(); g.fillStyle = css + '55'; g.fill(); }
    const tex = new THREE.CanvasTexture(c);
    snapSpriteCache[key] = tex;
    return tex;
  }

  const snapTipEl = document.getElementById('snapTip');
  const vcbEl = document.getElementById('vcb');
  const vcbLabelEl = document.getElementById('vcbLabel');
  const vcbValEl = document.getElementById('vcbVal');

  function showSnapTip(point, text, color) {
    if (!text) { snapTipEl.style.display = 'none'; return; }
    const s = projectToScreen(point, dom.getBoundingClientRect());
    snapTipEl.textContent = text;
    snapTipEl.style.borderLeftColor = '#' + color.toString(16).padStart(6, '0');
    snapTipEl.style.left = (s.x + 16) + 'px';
    snapTipEl.style.top = (s.y + 14) + 'px';
    snapTipEl.style.display = 'block';
  }

  let snapMarkerMesh = null;
  let axisGuideMesh = null;
  function showSnapMarker(point, color, kind, labelOverride) {
    hideSnapMarker();
    const mat = new THREE.SpriteMaterial({
      map: snapSpriteTexture(SNAP_SHAPE[kind] || 'circle', color),
      depthTest: false, transparent: true, sizeAttenuation: false
    });
    snapMarkerMesh = new THREE.Sprite(mat);
    snapMarkerMesh.scale.set(0.034, 0.034, 1);
    snapMarkerMesh.renderOrder = 999;
    snapMarkerMesh.position.copy(point);
    snapMarkerMesh.raycast = () => {};
    scene.add(snapMarkerMesh);
    showSnapTip(point, labelOverride || SNAP_LABEL[kind], color);
  }
  function showAxisGuide(anchor, axisKey, color) {
    const dir = axisKey === 'x' ? AXIS_X_DIR : axisKey === 'y' ? AXIS_Y_DIR : AXIS_Z_DIR;
    const geo = new THREE.BufferGeometry().setFromPoints([
      anchor.clone().addScaledVector(dir, -GRID_SIZE), anchor.clone().addScaledVector(dir, GRID_SIZE)
    ]);
    axisGuideMesh = new THREE.Line(geo, new THREE.LineDashedMaterial({ color, dashSize: 0.35, gapSize: 0.22, transparent: true, opacity: 0.75 }));
    axisGuideMesh.computeLineDistances();
    axisGuideMesh.raycast = () => {};
    scene.add(axisGuideMesh);
  }
  function hideSnapMarker() {
    if (snapMarkerMesh) { scene.remove(snapMarkerMesh); snapMarkerMesh.material.dispose(); snapMarkerMesh = null; }
    if (axisGuideMesh) { scene.remove(axisGuideMesh); disposeMesh(axisGuideMesh); axisGuideMesh = null; }
    snapTipEl.style.display = 'none';
  }

  // One call that turns a resolveDirectedEndpoint() result into on-screen feedback.
  function showInference(resolved, anchor) {
    hideSnapMarker();
    if (typedValue) return; // a typed exact value overrides whatever the cursor is inferring
    if (resolved.snapped) showSnapMarker(resolved.point, resolved.color, resolved.kind);
    else if (resolved.axis && anchor) {
      showAxisGuide(anchor, resolved.axis, resolved.color);
      showSnapTip(resolved.point, resolved.label, resolved.color);
    }
  }
  function snapColorFor(kind) {
    return kind === 'endpoint' ? SNAP_COLOR_ENDPOINT : kind === 'midpoint' ? SNAP_COLOR_MIDPOINT : SNAP_COLOR_ONEDGE;
  }

  // Value Control Box: shows the live measurement for the active tool, or the typed value
  // (amber, with an Enter mark) once the user starts typing.
  function setVCB(label, measured) {
    vcbEl.style.display = 'flex';
    vcbLabelEl.textContent = label;
    vcbValEl.textContent = typedValue ? typedValue : measured;
    vcbValEl.classList.toggle('typing', !!typedValue);
  }
  function hideVCB() { vcbEl.style.display = 'none'; }

  // draw state
  let drawStage = 0;       // 0 = idle, 1 = first point placed
  let drawStart = null;    // THREE.Vector3
  let drawStartNodeId = null; // shared node id backing drawStart, for the line tool
  let previewMesh = null;
  let extrudeObj = null;
  let extrudeFaceKind = null;   // 'top' | 'radius' | 'x+' | 'x-' | 'z+' | 'z-' | 'wallN' — for the live highlight
  let extrudeHitPoint = null;   // THREE.Vector3 — where the face was originally clicked
  let extrudeWorldNormal = null; // THREE.Vector3 — that face's outward normal, the push axis
  let extrudeField = null;   // 'height' | 'radius' | 'x1' | 'x2' | 'z1' | 'z2' — which param this drag edits
  let extrudeSign = 1;
  let extrudeBaseValue = 0;
  let extrudeWallIndex = null;  // set instead of extrudeField when pushing one wall of a polyface
  let extrudeBasePoints = null; // snapshot of polyface 2D points at drag start, for offsetPolygonEdge's math
  let extrudeNodeSnapshot = null; // [{id, pos}] snapshot of the face's nodes at drag start, for Escape-revert
  let extrudeSnapshotHeight = 0;   // full pre-grab snapshot, restored if the grab is cancelled (Escape)
  let extrudeSnapshotParams = null;
  let chainOrigin = null;  // first vertex of the active line chain (for auto-close detection)
  let chainPoints = [];    // vertices placed so far in the active chain, in order
  let chainNodeIds = [];   // node ids placed so far in the active chain, parallel to chainPoints
  let chainLineObjs = [];  // the 'line' objects created for the active chain's segments
  let moveObj = null;
  let moveAnchor = null;      // THREE.Vector3 — world point clicked at drag start
  let moveBaseParams = null;  // deep clone of obj.params at drag start, translated fresh each move
  let moveNodeId = null;         // set instead of moveObj when dragging a single shared node
  let moveNodeOriginalPos = null; // that node's position at grab start, for Escape-revert
  let moveNodeBase = null;       // [{id, pos}] snapshot when dragging a whole line/polyface's nodes together

  // Rewrites obj.params (from a snapshot) shifted by (dx,dy,dz) — used by the Move tool for
  // the independent/parametric types. 'line' and 'polyface' move via their shared nodes
  // instead (see the Move tool's node-drag / whole-edge-drag branches), not through here.
  function translatedParams(type, baseParams, dx, dy, dz) {
    const p = JSON.parse(JSON.stringify(baseParams));
    if (type === 'guide') {
      p.a = [p.a[0] + dx, p.a[1] + dy, p.a[2] + dz];
      p.b = [p.b[0] + dx, p.b[1] + dy, p.b[2] + dz];
    } else if (type === 'rect') {
      p.x1 += dx; p.x2 += dx; p.z1 += dz; p.z2 += dz;
      p.baseY = (p.baseY || 0) + dy;
    } else if (type === 'circle') {
      p.cx += dx; p.cz += dz;
      p.baseY = (p.baseY || 0) + dy;
    }
    return p;
  }

  // ── SketchUp-style "type a length" (VCB): after clicking a point, typing a number and
  // pressing Enter places the line's next point exactly that far along whatever direction
  // (snap or axis-lock) is currently showing, instead of wherever the mouse happens to be.
  let typedValue = '';
  let lastLineEndPoint = null;
  let lastLineEndNodeId = null; // shared node id backing lastLineEndPoint, if it's an exact snap
  let guideChainStart = null; // anchor for the Guide tool's current segment (continues like Line)
  let lastGuideEndPoint = null;

  // Guide tool, offset mode: click an existing line/guide, move the mouse (or type a
  // value + Enter) to lay a new guide parallel to it at that perpendicular distance —
  // same idea as SketchUp's Tape Measure offset.
  let offsetSourceObj = null;
  let offsetBaseA = null, offsetBaseB = null; // snapshot of the source line's endpoints
  let lastOffsetVec = null;

  // The perpendicular vector from the source line to wherever the cursor currently points:
  // finds the mutual closest points between the (infinite) line and the cursor's 3D ray —
  // the segment connecting them is, by construction, perpendicular to the line.
  function computeOffsetVec(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const rayOrigin = raycaster.ray.origin, rayDir = raycaster.ray.direction.clone().normalize();
    const lineDir = offsetBaseB.clone().sub(offsetBaseA).normalize();
    const closestOnLine = closestPointOnLineToRay(offsetBaseA, lineDir, rayOrigin, rayDir);
    const t = closestOnLine.clone().sub(rayOrigin).dot(rayDir);
    const closestOnRay = rayOrigin.clone().addScaledVector(rayDir, t);
    return closestOnRay.clone().sub(closestOnLine);
  }

  function refreshOffsetPreview() {
    if (currentTool !== 'guide' || !offsetSourceObj) return;
    clearPreview();
    let offsetVec = computeOffsetVec(lastMouseX, lastMouseY);
    if (offsetVec.lengthSq() < 1e-9) offsetVec = new THREE.Vector3(0.001, 0, 0);
    if (typedValue) {
      const len = parseFloat(typedValue);
      if (!isNaN(len)) offsetVec = offsetVec.clone().normalize().multiplyScalar(len);
    }
    lastOffsetVec = offsetVec.clone();
    const newA = offsetBaseA.clone().add(offsetVec), newB = offsetBaseB.clone().add(offsetVec);
    previewMesh = buildGuideMesh(newA, newB);
    previewMesh.traverse(n => { if (n.material && n.material.color) n.material.color.setHex(AXIS_COLOR_NONE); });
    scene.add(previewMesh);
    setVCB('Desfase', offsetVec.length().toFixed(2));
    let txt = 'offset: ' + offsetVec.length().toFixed(2);
    if (typedValue) txt += '  → ' + typedValue + ' [Enter]';
    statusCoordsEl.textContent = txt;
  }

  function commitOffset() {
    if (offsetSourceObj && lastOffsetVec) {
      pushUndo();
      const newA = offsetBaseA.clone().add(lastOffsetVec), newB = offsetBaseB.clone().add(lastOffsetVec);
      addObject('guide', { a: [newA.x, newA.y, newA.z], b: [newB.x, newB.y, newB.z] });
    }
    cancelDraw();
  }

  // Shared by the Line and Guide tools: resolves where the "next point" should land —
  // geometry snap first, then axis lock, then a free point on the plane through `anchor`
  // — and overrides it with the typed VCB length along that same direction if one is set.
  function resolveDirectedEndpoint(anchor, clientX, clientY, planar) {
    const raw = (planar ? planePoint(clientX, clientY, anchor.y) : groundPoint(clientX, clientY)) || anchor.clone();
    let geomSnap = resolveGeometrySnap(raw, clientX, clientY);
    // Planar mode (shape tools): only snap to geometry that sits in the drawing plane.
    if (planar && geomSnap && Math.abs(geomSnap.point.y - anchor.y) > 1e-3) geomSnap = null;
    let endPoint, color, label, nodeId = null, axisKey = null;
    if (geomSnap) {
      endPoint = geomSnap.point;
      color = geomSnap.kind === 'endpoint' ? SNAP_COLOR_ENDPOINT : geomSnap.kind === 'midpoint' ? SNAP_COLOR_MIDPOINT : SNAP_COLOR_ONEDGE;
      label = SNAP_LABEL[geomSnap.kind];
      nodeId = geomSnap.nodeId;
    } else {
      const axisSnap = resolveAxisSnap(anchor, clientX, clientY, !!planar);
      if (axisSnap) {
        endPoint = axisSnap.point; color = axisSnap.color; label = axisSnap.label; axisKey = axisSnap.axis;
      } else {
        endPoint = planePoint(clientX, clientY, anchor.y) || anchor.clone();
        color = AXIS_COLOR_NONE; label = null;
      }
    }
    if (planar) endPoint.y = anchor.y;
    const direction = endPoint.clone().sub(anchor);
    if (direction.lengthSq() > 1e-9) direction.normalize(); else direction.set(1, 0, 0);
    if (typedValue) {
      const len = parseFloat(typedValue);
      // A typed exact length no longer lands exactly on whatever was snapped (the direction
      // is kept, but the distance is overridden), so it's not the same point as that node.
      if (!isNaN(len)) { endPoint = anchor.clone().addScaledVector(direction, len); nodeId = null; }
    }
    return { point: endPoint, color, label, snapped: !!geomSnap, nodeId, axis: axisKey, kind: geomSnap ? geomSnap.kind : null };
  }

  function resolveLineEndpoint(clientX, clientY) { return resolveDirectedEndpoint(drawStart, clientX, clientY); }

  // Face splitting: drawing a line between two points that already sit on the same face's
  // perimeter cuts that face into two along the new line, instead of just adding a stray
  // edge on top of it. Scoped deliberately narrow (confirmed with the user): only this
  // exact "line between two existing border nodes" case, not general interior-line clipping.
  function areAdjacentInLoop(loop, a, b) {
    const n = loop.length;
    for (let i = 0; i < n; i++) {
      const cur = loop[i], next = loop[(i + 1) % n];
      if ((cur === a && next === b) || (cur === b && next === a)) return true;
    }
    return false;
  }
  function findSplittableFace(nA, nB) {
    return objects.find(o => o.type === 'polyface' &&
      o.params.nodeIds.includes(nA) && o.params.nodeIds.includes(nB) &&
      !areAdjacentInLoop(o.params.nodeIds, nA, nB));
  }
  function splitFace(face, nA, nB) {
    const loop = face.params.nodeIds;
    const i = loop.indexOf(nA), j = loop.indexOf(nB);
    const [lo, hi] = i < j ? [i, j] : [j, i];
    const loopA = loop.slice(lo, hi + 1);
    const loopB = loop.slice(hi).concat(loop.slice(0, lo + 1));
    addObject('polyface', { nodeIds: loopA, orientation: face.params.orientation, base: face.params.base }, face.height);
    addObject('polyface', { nodeIds: loopB, orientation: face.params.orientation, base: face.params.base }, face.height);
    removeObject(face);
  }
  function checkFaceSplit(nA, nB) {
    if (nA == null || nB == null || nA === nB) return;
    const face = findSplittableFace(nA, nB);
    if (face) splitFace(face, nA, nB);
  }

  function commitLineSegment(finalPt, finalNodeId) {
    rememberTyped();
    pushUndo();
    const endNodeId = (finalNodeId != null) ? finalNodeId : createNode(finalPt).id;
    const segment = addObject('line', { nodeIds: [drawStartNodeId, endNodeId] });
    chainLineObjs.push(segment);
    checkFaceSplit(drawStartNodeId, endNodeId);
    const closesLoop = chainOrigin && finalPt.distanceTo(chainOrigin) < 1e-6 && chainPoints.length >= 3;
    if (closesLoop) {
      const planar = detectPolygonOrientation(chainPoints);
      if (planar) {
        // The perimeter lines just committed (chainLineObjs) already reference these same
        // nodes, so they stay glued to the face automatically — no manual sync needed.
        addObject('polyface', { nodeIds: chainNodeIds.slice(), orientation: planar.orientation, base: planar.base }, 0);
      }
      // If it's not flat in a red/green or blue-axis plane, leave the drawn lines as-is
      // rather than collapsing them into a broken face.
      cancelDraw();
    } else {
      chainPoints.push(finalPt.clone());
      chainNodeIds.push(endNodeId);
      drawStart = finalPt.clone(); // chain to next segment
      drawStartNodeId = endNodeId;
      clearPreview();
      hideSnapMarker();
      typedValue = '';
    }
  }

  let lastMouseX = 0, lastMouseY = 0;

  // Re-renders the line preview at the last known mouse position — used so the preview
  // (and the exact length) updates live as the user types, without needing to move the mouse.
  function refreshLinePreview() {
    if (currentTool !== 'line' || drawStage !== 1) return;
    clearPreview();
    const resolved = resolveLineEndpoint(lastMouseX, lastMouseY);
    showInference(resolved, drawStart);
    previewMesh = buildLineMesh(drawStart, resolved.point);
    previewMesh.traverse(n => { if (n.material && n.material.color) n.material.color.setHex(resolved.color); });
    scene.add(previewMesh);
    setVCB('Longitud', drawStart.distanceTo(resolved.point).toFixed(2));
    let txt = 'x: ' + resolved.point.x.toFixed(2) + '  z: ' + resolved.point.z.toFixed(2);
    if (resolved.label && !typedValue) txt += '  · ' + resolved.label;
    if (typedValue) txt += '  → ' + typedValue + ' [Enter]';
    statusCoordsEl.textContent = txt;
    lastLineEndPoint = resolved.point.clone();
    lastLineEndNodeId = resolved.nodeId;
  }

  // Guide ("cinta métrica"): same click-move-click-to-place-next-point flow as Line, but
  // no auto-close-to-face — it's purely a reference/measuring aid.
  function commitGuideSegment(finalPt) {
    pushUndo();
    addObject('guide', { a: [guideChainStart.x, guideChainStart.y, guideChainStart.z], b: [finalPt.x, finalPt.y, finalPt.z] });
    guideChainStart = finalPt.clone(); // continue chaining, like Line
    clearPreview();
    hideSnapMarker();
    typedValue = '';
  }

  function refreshGuidePreview() {
    if (currentTool !== 'guide' || !guideChainStart) return;
    clearPreview();
    const resolved = resolveDirectedEndpoint(guideChainStart, lastMouseX, lastMouseY);
    showInference(resolved, guideChainStart);
    previewMesh = buildGuideMesh(guideChainStart, resolved.point);
    previewMesh.traverse(n => { if (n.material && n.material.color) n.material.color.setHex(resolved.color); });
    scene.add(previewMesh);
    const len = guideChainStart.distanceTo(resolved.point);
    setVCB('Longitud', len.toFixed(2));
    let txt = 'longitud: ' + len.toFixed(2);
    if (resolved.label && !typedValue) txt += '  · ' + resolved.label;
    if (typedValue) txt += '  → ' + typedValue + ' [Enter]';
    statusCoordsEl.textContent = txt;
    lastGuideEndPoint = resolved.point.clone();
  }

  function clearPreview() {
    if (previewMesh) { scene.remove(previewMesh); disposeMesh(previewMesh); previewMesh = null; }
  }

  function cancelDraw() {

      // Escape (or switching tools) mid-grab should abandon the push, not keep it half-done.
      extrudeObj.height = extrudeSnapshotHeight;
      extrudeObj.params = extrudeSnapshotParams;
      if (extrudeNodeSnapshot) {
        extrudeNodeSnapshot.forEach(({ id, pos }) => setNodePos(id, pos));
        extrudeNodeSnapshot.forEach(({ id }) => nodeMoved(id));
      }
      rebuildMesh(extrudeObj);
    }
    extrudeObj = null;
    extrudeSnapshotParams = null;
    controls.enabled = true;
    selectDragStart = null;
    boxSelectActive = false;
    hideMarquee();
    hideSnapMarker();
    drawStartNodeId = null;
    chainOrigin = null;
    chainPoints = [];
    chainNodeIds = [];
    chainLineObjs = [];
    hideFaceHighlight();

    // positions directly (unlike the rect/circle/guide params path, which only ever writes
    // into moveObj.params), so Escape/tool-switch needs to explicitly put them back.
    if (moveNodeId !== null && moveNodeOriginalPos) {

    moveAnchor = null;
    moveBaseParams = null;
    moveNodeId = null;
    moveNodeOriginalPos = null;
    moveNodeBase = null;

    freehandPts = null;
    editPts = [];

    filletSel = null;

    abortPaste();
    hideVCB();

    lastLineEndNodeId = null;
    guideChainStart = null;
    lastGuideEndPoint = null;
    offsetSourceObj = null;
    offsetBaseA = null;
    offsetBaseB = null;
    lastOffsetVec = null;
    extrudeWallIndex = null;
    extrudeBasePoints = null;
    extrudeNodeSnapshot = null;
    extrudeFaceKind = null;
    extrudeHitPoint = null;
    extrudeWorldNormal = null;

  // ═════════════ Drawing tools: rect / circle / polygon / arcs / rotated rect / freehand ═════════════
  // Everything below draws on a horizontal plane at the height of the first point. Closed
  // results become real shared-node line loops + a polyface (same as closing a Line chain),
  // arcs and freehand strokes become curve-grouped line chains (one click selects/erases it all).
  const SHAPE_TOOLS = ['polygon', 'arc2', 'arc3', 'rrect', 'freehand'];
  const DRAW_TOOLS = ['line', 'rect', 'circle', 'guide'].concat(SHAPE_TOOLS);
  let shapePts = [];        // points already placed for the active shape tool
  let polySides = 6;
  let freehandPts = null;   // while the button is held with the Freehand tool
  let lastDrawTool = null;  // for "repeat last command" (Shift+R)
  let lastCommitTool = null, lastCommitTyped = '', repeatPending = '';

  function typedNums() {
    return typedValue.split(/[;,]/).filter(t => t !== '' && t !== '-').map(parseFloat).filter(n => !isNaN(n));
  }
  function rememberTyped() { lastCommitTool = currentTool; lastCommitTyped = typedValue; }
  function applyRepeat() { if (repeatPending) { typedValue = repeatPending; repeatPending = ''; } }

  // First-point resolution: geometry snap if any, else the ground plane.
  function resolveStartPoint(clientX, clientY) {
    const raw = groundPoint(clientX, clientY);
    if (!raw) return null;
    const g = resolveGeometrySnap(raw, clientX, clientY);
    if (g) return { point: g.point.clone(), snapped: true, kind: g.kind, nodeId: g.nodeId };
    return { point: raw, snapped: false, kind: null, nodeId: null };
  }
  // Second-point resolution on the plane through `y`: only geometry that sits in that plane counts.
  function resolvePlanarGeom(clientX, clientY, y) {
    const raw = planePoint(clientX, clientY, y);
    if (!raw) return null;
    const g = resolveGeometrySnap(raw, clientX, clientY);
    if (g && Math.abs(g.point.y - y) < 1e-3) return { point: new THREE.Vector3(g.point.x, y, g.point.z), snapped: true, kind: g.kind };
    return { point: new THREE.Vector3(raw.x, y, raw.z), snapped: false, kind: null };
  }

  // ── preview builders (translucent fill + bright outline, instead of a bare wireframe) ──
  function buildPreviewShape(points, closed, fill) {
    const g = new THREE.Group();
    const lift = new THREE.Vector3(0, 0.004, 0);
    const pts = points.map(q => q.clone().add(lift));
    if (fill && closed && pts.length >= 3) {
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const idx = [];
      for (let i = 1; i < pts.length - 1; i++) idx.push(0, i, i + 1);
      geo.setIndex(idx);
      g.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: AXIS_COLOR_NONE, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false })));
    }
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    g.add(closed ? new THREE.LineLoop(lineGeo, new THREE.LineBasicMaterial({ color: AXIS_COLOR_NONE }))
                 : new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: AXIS_COLOR_NONE })));

  }
  function setPreview(obj) {
    clearPreview();
    previewMesh = obj;
    if (previewMesh) scene.add(previewMesh);
  }
  function circlePoints(c, r, n) {
    const pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; pts.push(new THREE.Vector3(c.x + r * Math.cos(a), c.y, c.z + r * Math.sin(a))); }
    return pts;
  }

  // ── geometry helpers ──
  // Arc through three points on a horizontal plane (circumcircle), p0 → pm → p1. Returns the
  // tessellated points (7.5° per segment) plus the radius, or a straight 2-point result if collinear.
  function arcThrough(p0, pm, p1) {
    const ax = p0.x, az = p0.z, bx = pm.x, bz = pm.z, cx = p1.x, cz = p1.z;
    const d = 2 * (ax * (bz - cz) + bx * (cz - az) + cx * (az - bz));
    if (Math.abs(d) < 1e-9) return { pts: [p0.clone(), p1.clone()], radius: Infinity };
    const a2 = ax * ax + az * az, b2 = bx * bx + bz * bz, c2 = cx * cx + cz * cz;
    const ux = (a2 * (bz - cz) + b2 * (cz - az) + c2 * (az - bz)) / d;
    const uz = (a2 * (cx - bx) + b2 * (ax - cx) + c2 * (bx - ax)) / d;
    const R = Math.hypot(ax - ux, az - uz);
    const TAU = Math.PI * 2, norm = a => ((a % TAU) + TAU) % TAU;
    const a0 = Math.atan2(az - uz, ax - ux), am = Math.atan2(bz - uz, bx - ux), a1 = Math.atan2(cz - uz, cx - ux);
    const ccw = norm(a1 - a0), mid = norm(am - a0);
    const sweep = mid <= ccw ? ccw : ccw - TAU; // the direction that actually passes through pm
    const n = Math.min(64, Math.max(4, Math.ceil(Math.abs(sweep) / (Math.PI / 24))));
    const pts = [p0.clone()];
    for (let i = 1; i < n; i++) { const a = a0 + sweep * i / n; pts.push(new THREE.Vector3(ux + R * Math.cos(a), p0.y, uz + R * Math.sin(a))); }
    pts.push(p1.clone());

  }
  function perpXZ(a, b) { // unit vector perpendicular to a→b on the horizontal plane
    const t = new THREE.Vector3(b.x - a.x, 0, b.z - a.z);
    if (t.lengthSq() < 1e-12) return new THREE.Vector3(0, 0, 1);
    t.normalize();
    return new THREE.Vector3(-t.z, 0, t.x);
  }
  function simplifyPath(pts, eps) { // Douglas–Peucker on the horizontal plane
    if (pts.length < 3) return pts.slice();
    const keep = new Array(pts.length).fill(false);
    keep[0] = keep[pts.length - 1] = true;
    const stack = [[0, pts.length - 1]];
    while (stack.length) {
      const [i, j] = stack.pop();
      let dmax = 0, idx = -1;
      for (let k = i + 1; k < j; k++) {
        const d = closestPointOnSegment(pts[k], pts[i], pts[j]).distanceTo(pts[k]);
        if (d > dmax) { dmax = d; idx = k; }
      }
      if (idx !== -1 && dmax > eps) { keep[idx] = true; stack.push([i, idx], [idx, j]); }
    }
    return pts.filter((_, i) => keep[i]);
  }

  function nodeAt(pt) {
    for (const [id, n] of nodes) if (Math.hypot(n.x - pt.x, n.y - pt.y, n.z - pt.z) < 1e-4) return id;
    return null;
  }
  function nextCurveId() { return 1 + objects.reduce((m, o) => Math.max(m, (o.params && o.params.curveId) || 0), 0); }
  // Curve-mates: every segment of the same arc / freehand stroke (so one click picks/erases it all).
  function curveMates(o) {
    if (o && o.type === 'line' && o.params.curveId) return objects.filter(x => x.type === 'line' && x.params.curveId === o.params.curveId);
    return o ? [o] : [];
  }

  // Commits a shape as shared-node line segments (reusing existing nodes at the same spot, so
  // it welds onto neighbouring geometry) and, if closed and flat, the polyface fill.
  function commitShape(points, closed, curve) {
    const pts = [];
    points.forEach(q => { if (!pts.length || pts[pts.length - 1].distanceTo(q) > 1e-4) pts.push(q.clone()); });
    if (closed && pts.length > 1 && pts[0].distanceTo(pts[pts.length - 1]) < 1e-4) pts.pop();
    if (pts.length < (closed ? 3 : 2)) return false;
    rememberTyped();
    pushUndo();
    const ids = pts.map(q => { const e = nodeAt(q); return e != null ? e : createNode(q).id; });
    const curveId = curve ? nextCurveId() : null;
    const segs = closed ? pts.length : pts.length - 1;
    for (let i = 0; i < segs; i++) {
      const params = { nodeIds: [ids[i], ids[(i + 1) % ids.length]] };
      if (curveId) params.curveId = curveId;
      addObject('line', params);
    }
    if (closed) {
      const planar = detectPolygonOrientation(pts);
      if (planar) addObject('polyface', { nodeIds: ids.slice(), orientation: planar.orientation, base: planar.base }, 0);
    }
    return true;
  }

  // ── Rectangle & circle (axis-aligned parametric objects), now with snapping + typed sizes ──
  // Rect typed sizes: "200,100" (width,depth) or "200" (width only). Signs flip direction.
  function computeRectEnd(clientX, clientY) {
    const res = resolvePlanarGeom(clientX, clientY, drawStart.y);
    const cur = res ? res.point : drawStart.clone();
    const nums = typedNums();
    let dx = cur.x - drawStart.x, dz = cur.z - drawStart.z;
    const sx = dx < 0 ? -1 : 1, sz = dz < 0 ? -1 : 1;
    if (nums.length >= 1) dx = sx * nums[0];
    if (nums.length >= 2) dz = sz * nums[1];
    return { end: new THREE.Vector3(drawStart.x + dx, drawStart.y, drawStart.z + dz), w: Math.abs(dx), d: Math.abs(dz), res };
  }
  function computeCircleRadius(clientX, clientY) {
    const res = resolvePlanarGeom(clientX, clientY, drawStart.y);
    const cur = res ? res.point : drawStart.clone();
    const nums = typedNums();
    return { r: nums.length ? Math.abs(nums[0]) : drawStart.distanceTo(cur), res };
  }
  function refreshRectCirclePreview() {
    if (currentTool !== 'rect' && currentTool !== 'circle') return;
    if (drawStage === 0) {
      const sp = resolveStartPoint(lastMouseX, lastMouseY);
      if (sp && sp.snapped) showSnapMarker(sp.point, snapColorFor(sp.kind), sp.kind); else hideSnapMarker();
      return;
    }
    if (currentTool === 'rect') {
      const { end, w, d, res } = computeRectEnd(lastMouseX, lastMouseY);
      if (res && res.snapped && !typedValue) showSnapMarker(end, snapColorFor(res.kind), res.kind); else hideSnapMarker();
      const y = drawStart.y;
      setPreview(buildPreviewShape([
        new THREE.Vector3(drawStart.x, y, drawStart.z), new THREE.Vector3(end.x, y, drawStart.z),
        new THREE.Vector3(end.x, y, end.z), new THREE.Vector3(drawStart.x, y, end.z)], true, true));
      setVCB('Dimensiones', w.toFixed(2) + ', ' + d.toFixed(2));
    } else {
      const { r, res } = computeCircleRadius(lastMouseX, lastMouseY);
      if (res && res.snapped && !typedValue) showSnapMarker(res.point, snapColorFor(res.kind), res.kind); else hideSnapMarker();
      setPreview(buildPreviewShape(circlePoints(drawStart, Math.max(r, 0.001), 48), true, true));
      setVCB('Radio', r.toFixed(2));
    }
  }
  function commitRectCircle(clientX, clientY) {
    if (currentTool === 'rect') {
      const { end, w, d } = computeRectEnd(clientX, clientY);
      if (w < 1e-3 || d < 1e-3) return;
      rememberTyped(); pushUndo();
      const params = { x1: drawStart.x, z1: drawStart.z, x2: end.x, z2: end.z };
      if (Math.abs(drawStart.y) > 1e-9) params.baseY = drawStart.y;
      addObject('rect', params, 0);
    } else {
      const { r } = computeCircleRadius(clientX, clientY);
      if (r < 1e-3) return;
      rememberTyped(); pushUndo();
      const params = { cx: drawStart.x, cz: drawStart.z, radius: r };
      if (Math.abs(drawStart.y) > 1e-9) params.baseY = drawStart.y;
      addObject('circle', params, 0);
    }
    cancelDraw();
  }

  // ── Shape tools: one function computes both the live preview and what a click/Enter commits ──
  // Returns { advance, final:{pts,closed,curve}, preview, label, measure, inference, resolved }.
  function computeShapeStep(clientX, clientY) {
    const out = { advance: null, final: null, preview: null, label: null, measure: '', resolved: null, anchor: null };
    const n = shapePts.length;
    if (n === 0) {
      const sp = resolveStartPoint(clientX, clientY);
      if (sp) { out.advance = sp.point; out.resolved = { snapped: sp.snapped, kind: sp.kind, point: sp.point, color: sp.snapped ? snapColorFor(sp.kind) : 0 }; }
      return out;
    }
    const y = shapePts[0].y;
    const t = currentTool;
    const nums = typedNums();
    const typedEndsWithS = /s$/.test(typedValue);
    const dirRes = (anchor) => { // directed endpoint on the plane, typed length honoured
      const r = resolveDirectedEndpoint(anchor, clientX, clientY, true);
      out.resolved = r; out.anchor = anchor; return r;
    };

    if (t === 'polygon') {
      const c = shapePts[0];
      const r0 = dirRes(c);
      let dir = r0.point.clone().sub(c);
      let radius = dir.length();
      if (radius < 1e-9) dir.set(1, 0, 0); else dir.normalize();
      if (nums.length && !typedEndsWithS) radius = Math.abs(nums[0]);
      const a0 = Math.atan2(dir.z, dir.x);
      const pts = [];
      for (let i = 0; i < polySides; i++) { const a = a0 + i / polySides * Math.PI * 2; pts.push(new THREE.Vector3(c.x + radius * Math.cos(a), y, c.z + radius * Math.sin(a))); }
      out.final = { pts, closed: true, curve: false };
      out.preview = buildPreviewShape(pts, true, true);
      out.label = 'Radio · ' + polySides + ' lados';
      out.measure = radius.toFixed(2);
      return out;
    }
    if (t === 'freehand') return out;

    // arc2 / arc3 / rrect share "second point like a Line" for their first leg
    if (n === 1) {
      const a = shapePts[0];
      const r = dirRes(a);
      out.advance = r.point.clone();
      out.preview = buildPreviewShape([a, r.point], false, false);
      out.label = t === 'arc3' ? 'Hasta el punto del arco' : 'Longitud';
      out.measure = a.distanceTo(r.point).toFixed(2);
      return out;
    }
    const p0 = shapePts[0], p1 = shapePts[1];
    const cursor = planePoint(clientX, clientY, y) || p1.clone();
    cursor.y = y;
    if (t === 'arc2') {
      const mid = p0.clone().add(p1).multiplyScalar(0.5);
      const nrm = perpXZ(p0, p1);
      let s = cursor.clone().sub(mid).dot(nrm);
      const side = s < 0 ? -1 : 1;
      if (nums.length) s = side * nums[0];
      if (Math.abs(s) < 1e-4) { out.final = { pts: [p0.clone(), p1.clone()], closed: false, curve: true }; }
      else {
        const apex = mid.clone().addScaledVector(nrm, s);
        const arc = arcThrough(p0, apex, p1);
        out.final = { pts: arc.pts, closed: false, curve: true };

      out.preview = buildPreviewShape(arc.pts, false, false);
      out.label = 'Radio'; out.measure = isFinite(arc.radius) ? arc.radius.toFixed(2) : '∞';

    if (t === 'rrect') {
      const nrm = perpXZ(p0, p1);
      let w = cursor.clone().sub(p1).dot(nrm);
      const side = w < 0 ? -1 : 1;
      if (nums.length) w = side * nums[0];
      const off = nrm.clone().multiplyScalar(w);
      const pts = [p0.clone(), p1.clone(), p1.clone().add(off), p0.clone().add(off)];
      out.final = { pts, closed: true, curve: false };
      out.preview = buildPreviewShape(pts, true, true);
      out.label = 'Ancho · lado ' + p0.distanceTo(p1).toFixed(2); out.measure = Math.abs(w).toFixed(2);
      return out;
    }
    return out;
  }

  // Which stages accept typed values (arc3 has none: its points are all geometric).
  function shapeVcbActive() {
    const n = shapePts.length;
    if (currentTool === 'polygon') return n === 1;
    if (currentTool === 'arc2' || currentTool === 'rrect') return n === 1 || n === 2;
    return false;
  }

  function refreshShapePreview() {
    if (!SHAPE_TOOLS.includes(currentTool)) return;
    if (currentTool === 'freehand') {
      if (freehandPts) {
        const q = planePoint(lastMouseX, lastMouseY, freehandPts[0].y);
        if (q) {
          q.y = freehandPts[0].y;
          if (q.distanceTo(freehandPts[freehandPts.length - 1]) > 0.12) freehandPts.push(q);
          setPreview(buildPreviewShape(freehandPts, false, false));
          setVCB('Puntos', String(freehandPts.length));
        }
      } else {
        const sp = resolveStartPoint(lastMouseX, lastMouseY);
        if (sp && sp.snapped) showSnapMarker(sp.point, snapColorFor(sp.kind), sp.kind); else hideSnapMarker();
      }
      return;
    }
    const step = computeShapeStep(lastMouseX, lastMouseY);
    if (shapePts.length === 0) {
      if (step.resolved && step.resolved.snapped) showSnapMarker(step.advance, step.resolved.color, step.resolved.kind); else hideSnapMarker();
      hideVCB();
      return;
    }
    setPreview(step.preview);
    if (step.resolved) {
      // resolved may come from resolveDirectedEndpoint (axis/geometry) — show inference feedback
      if (step.resolved.point && step.anchor) showInference(step.resolved, step.anchor); else hideSnapMarker();

  function shapeClick(clientX, clientY) {

    if (currentTool === 'freehand') return;
    const step = computeShapeStep(clientX, clientY);
    if (shapePts.length === 0) {
      if (!step.advance) return;
      shapePts = [step.advance.clone()];
      typedValue = '';
      applyRepeat();
      refreshShapePreview();
      return;
    }
    if (step.final) {
      const closed = step.final.closed;
      const ok = commitShape(step.final.pts, closed, step.final.curve);
      if (ok) cancelDraw();
      return;
    }
    if (step.advance) {
      shapePts.push(step.advance.clone());
      typedValue = '';
      refreshShapePreview();
    }
  }

  function shapeEnter() {
    if (currentTool === 'polygon' && /^\d+s$/.test(typedValue)) {
      polySides = Math.min(64, Math.max(3, parseInt(typedValue, 10)));
      typedValue = '';
      refreshShapePreview();
      return;
    }
    shapeClick(lastMouseX, lastMouseY);
  }

  function freehandStart(clientX, clientY) {
    const sp = resolveStartPoint(clientX, clientY);
    if (!sp) return;
    freehandPts = [sp.point.clone()];
    hideSnapMarker();
  }
  function freehandFinish() {
    const pts = freehandPts;
    freehandPts = null;
    clearPreview(); hideVCB();
    if (!pts || pts.length < 2) return;
    let eps = 0.05, simp = simplifyPath(pts, eps);
    while (simp.length > 160 && eps < 2) { eps *= 1.5; simp = simplifyPath(pts, eps); }
    const first = simp[0], last = simp[simp.length - 1];
    const closed = simp.length >= 4 && first.distanceTo(last) < 0.35;
    if (closed) simp[simp.length - 1] = first.clone();
    commitShape(simp, closed, true);
  }

  function repeatLast() {
    if (!lastDrawTool) return;
    const typed = lastCommitTool === lastDrawTool ? lastCommitTyped : '';
    setTool(lastDrawTool);
    repeatPending = typed;
  }


  // ═════════════ Edit tools: rotate / scale / flip / copy-paste ═════════════
  // One transform engine (a 4x4 matrix: rotation about the vertical axis, uniform scale, mirror,
  // translation) is applied to any mix of objects. Shared nodes move once; faces re-derive their
  // plane basis/offset/height from the matrix, so rotated or mirrored faces keep extruding right.
  const EDIT_TOOLS = ['rotate', 'scale', 'paste', 'offset', 'fillet'];
  let editPts = [];          // rotate: [center, reference]; scale: [base, reference]
  let transformCopy = false; // Ctrl toggles: transform a copy and leave the original
  let ghostGroup = null;
  let clipboard = null;
  let pasteState = null;     // { objs, snapshot, baseline, nodeBase }

  const AX_X = new THREE.Vector3(1, 0, 0), AX_Y = new THREE.Vector3(0, 1, 0), AX_Z = new THREE.Vector3(0, 0, 1);
  function matScale(M) { return Math.cbrt(Math.abs(M.determinant())); }

  function convertRectToPolyface(o) {
    const { x1, z1, x2, z2 } = o.params, y = o.params.baseY || 0;
    const ids = [[x1, z1], [x2, z1], [x2, z2], [x1, z2]].map(([x, z]) => createNode(new THREE.Vector3(x, y, z)).id);
    o.type = 'polyface';
    o.params = { nodeIds: ids, orientation: 'xz', base: y };
  }
  function convertCircleToPolyface(o) {
    const { cx, cz, radius } = o.params, y = o.params.baseY || 0;
    const ids = circlePoints(new THREE.Vector3(cx, y, cz), radius, 48).map(q => createNode(q).id);
    o.type = 'polyface';
    o.params = { nodeIds: ids, orientation: 'xz', base: y };

  // Can a rect stay a parametric rect under M? (axis-aligned result, and not an upside-down extrusion)
  function rectStaysParametric(o, M) {
    const ex = AX_X.clone().transformDirection(M), ey = AX_Y.clone().transformDirection(M), ez = AX_Z.clone().transformDirection(M);
    const e = 1 - 1e-6;
    const aligned = Math.abs(ey.y) > e && ((Math.abs(ex.x) > e && Math.abs(ez.z) > e) || (Math.abs(ex.z) > e && Math.abs(ez.x) > e));
    return aligned && !(ey.y < 0 && o.height > 0);
  }
  function circleStaysParametric(o, M) {
    const ey = AX_Y.clone().transformDirection(M);
    return !(ey.y < 0 && o.height > 0);
  }

  function transformPolyface(face, M, k) {
    const o = face.params.orientation || 'xz';
    const b = POLYFACE_BASES[o] || POLYFACE_BASES.xz;
    const bx = b.x.clone().transformDirection(M), by = b.y.clone().transformDirection(M), bz = b.z.clone().transformDirection(M);
    const p0 = b.z.clone().multiplyScalar(face.params.base || 0).applyMatrix4(M);
    face.params.base = bz.dot(p0);

  function applyMatrixToObjects(objs, M) {
    const k = matScale(M);
    objs.forEach(o => {
      if (o.type === 'rect' && !rectStaysParametric(o, M)) convertRectToPolyface(o);
      else if (o.type === 'circle' && !circleStaysParametric(o, M)) convertCircleToPolyface(o);
    });
    const ids = new Set();
    objs.forEach(o => {
      if (o.type === 'line' || o.type === 'polyface') {
        o.params.nodeIds.forEach(i => ids.add(i));
        (o.params.topNodeIds || []).forEach(i => ids.add(i));
      }
    });
    objs.forEach(o => {
      if (o.type === 'polyface') transformPolyface(o, M, k);
      else if (o.type === 'guide') {
        o.params.a = new THREE.Vector3(...o.params.a).applyMatrix4(M).toArray();
        o.params.b = new THREE.Vector3(...o.params.b).applyMatrix4(M).toArray();
      } else if (o.type === 'rect') {
        const y = o.params.baseY || 0;
        const a = new THREE.Vector3(o.params.x1, y, o.params.z1).applyMatrix4(M);
        const c = new THREE.Vector3(o.params.x2, y, o.params.z2).applyMatrix4(M);
        o.params.x1 = a.x; o.params.z1 = a.z; o.params.x2 = c.x; o.params.z2 = c.z; o.params.baseY = a.y;
        o.height *= k;

        const c = new THREE.Vector3(o.params.cx, o.params.baseY || 0, o.params.cz).applyMatrix4(M);
        o.params.cx = c.x; o.params.cz = c.z; o.params.baseY = c.y; o.params.radius *= k;

    const touched = new Set(objs);
    ids.forEach(id => objectsUsingNode(id).forEach(x => touched.add(x)));
    touched.forEach(rebuildMesh);
  }

  // Duplicates objects with fresh nodes (so the copy is independent of the original).
  function cloneObjects(objs) {
    const idMap = new Map();
    const mapId = id => { if (!idMap.has(id)) idMap.set(id, createNode(nodePos(id)).id); return idMap.get(id); };
    const curveMap = new Map(); let nc = nextCurveId();
    return objs.map(o => {
      const p = JSON.parse(JSON.stringify(o.params));
      if (p.nodeIds) p.nodeIds = p.nodeIds.map(mapId);
      if (p.topNodeIds) p.topNodeIds = p.topNodeIds.map(mapId);
      if (p.curveId) { if (!curveMap.has(p.curveId)) curveMap.set(p.curveId, nc++); p.curveId = curveMap.get(p.curveId); }
      return addObject(o.type, p, o.height);
    });
  }

  function selectionBox() {
    const box = new THREE.Box3();
    selectedObjects.forEach(o => box.expandByObject(o.mesh));
    return box;
  }

  function flipSelection(axis) {
    if (!selectedObjects.length) { statusCoordsEl.textContent = 'Selecciona algo para voltear.'; return; }
    const c = selectionBox().getCenter(new THREE.Vector3());
    const sc = axis === 'x' ? new THREE.Vector3(-1, 1, 1) : axis === 'y' ? new THREE.Vector3(1, -1, 1) : new THREE.Vector3(1, 1, -1);
    const M = new THREE.Matrix4().makeTranslation(c.x, c.y, c.z).multiply(new THREE.Matrix4().makeScale(sc.x, sc.y, sc.z)).multiply(new THREE.Matrix4().makeTranslation(-c.x, -c.y, -c.z));
    pushUndo();
    applyMatrixToObjects(selectedObjects, M);
    setSelection(selectedObjects.slice());
  }

  // ── live ghost of the selection under a candidate matrix (no model mutation until commit) ──
  function hideGhost() {
    if (ghostGroup) { scene.remove(ghostGroup); disposeMesh(ghostGroup); ghostGroup = null; }
  }
  function showGhost(M) {
    hideGhost();
    ghostGroup = new THREE.Group();
    selectedObjects.forEach(o => {
      const m = meshFor(o);
      m.traverse(n => {
        if (n.material && n.material.color && !n.userData.isEdgeOverlay) { n.material.color.setHex(COLOR_SELECTED); n.material.transparent = true; n.material.opacity = 0.6; }
        n.raycast = () => {};
      });
      ghostGroup.add(m);
    });
    ghostGroup.matrixAutoUpdate = false;
    ghostGroup.matrix.copy(M);
    ghostGroup.updateMatrixWorld(true);
    scene.add(ghostGroup);
  }

  function buildProtractor(center, radius, a0, a1) {
    const g = new THREE.Group();
    const y = center.y + 0.004;
    const mk = (pts, color, opacity) => { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color, transparent: true, opacity: opacity == null ? 1 : opacity })); l.raycast = () => {}; return l; };
    const P = (a, r) => new THREE.Vector3(center.x + r * Math.cos(a), y, center.z + r * Math.sin(a));
    const ring = []; for (let i = 0; i <= 72; i++) ring.push(P(i / 72 * Math.PI * 2, radius));
    g.add(mk(ring, 0x8b949e, 0.7));
    for (let d = 0; d < 360; d += 15) { const a = d * Math.PI / 180; const inner = (d % 45 === 0) ? 0.88 : 0.94; g.add(mk([P(a, radius * inner), P(a, radius)], 0x8b949e, 0.8)); }

      g.add(mk(arc, AXIS_COLOR_NONE));
    }
    return g;
  }

  // ── Rotate / Scale: compute both the preview and what a click/Enter commits ──
  function computeEditStep(clientX, clientY) {
    const out = { advance: null, M: null, preview: null, label: null, measure: '', resolved: null };
    const t = currentTool, n = editPts.length;
    if (n === 0) {
      const sp = resolveStartPoint(clientX, clientY);
      if (sp) { out.advance = sp.point; out.resolved = sp; }
      return out;
    }
    const c = editPts[0];
    const res = resolvePlanarGeom(clientX, clientY, c.y);
    const q = res ? res.point : c.clone();
    if (n === 1) {
      if (q.distanceTo(c) > 1e-6) out.advance = q;
      out.resolved = res;
      out.preview = t === 'rotate' ? buildProtractor(c, Math.max(q.distanceTo(c), 0.3), Math.atan2(q.z - c.z, q.x - c.x), null)

      out.measure = c.distanceTo(q).toFixed(2);

        .multiply(new THREE.Matrix4().makeTranslation(-c.x, -c.y, -c.z));

      out.label = 'Ángulo'; out.measure = (Math.round(deg * 10) / 10) + '°';

  function commitTransform(M) {

  }

  function editVcbActive() {
    if (currentTool === 'offset') return !!offFace;
    if (currentTool === 'fillet') return !!filletSel;
    return (currentTool === 'rotate' || currentTool === 'scale') && editPts.length === 2 && selectedObjects.length > 0;
  }

  function refreshEditPreview() {
    const t = currentTool;
    if (t === 'paste') { movePaste(); return; }
    if (t === 'offset') {
      if (!offFace) {
        const hit = pickObjectWithFace(lastMouseX, lastMouseY);
        const ok = hit && faceOffsetInfo(hit.obj);
        showFaceHighlight(ok ? buildFaceHighlightMesh(hit.obj, 'top') : null);
        hideVCB();
        return;
      }
      const st = computeOffsetStep(lastMouseX, lastMouseY);
      if (!st) return;
      setPreview(st.valid ? buildPreviewShape(st.loop3D, true, true) : null);
      setVCB('Desfase', (Math.round(st.d * 1000) / 1000).toFixed(2) + (st.valid ? '' : ' ✕'));
      return;
    }
    if (t === 'fillet') {
      if (!filletSel) {
        const c = nearestFilletCorner(lastMouseX, lastMouseY);
        if (c) showSnapMarker(c.N, SNAP_COLOR_ENDPOINT, 'endpoint', 'Esquina para empalme'); else hideSnapMarker();
        hideVCB();
        return;
      }
      const st = computeFilletStep(lastMouseX, lastMouseY);
      setPreview(buildPreviewShape(st.pts, false, false));
      setVCB('Radio', st.r.toFixed(2));
      return;
    }
    if (t !== 'rotate' && t !== 'scale') return;
    hideGhost();
    if (!selectedObjects.length) { clearPreview(); hideVCB(); hideSnapMarker(); return; }
    const st = computeEditStep(lastMouseX, lastMouseY);
    if (editPts.length === 0) {
      if (st.resolved && st.resolved.snapped) showSnapMarker(st.advance, snapColorFor(st.resolved.kind), st.resolved.kind); else hideSnapMarker();
      hideVCB();
      return;
    }
    if (st.resolved && st.resolved.snapped && !typedValue) showSnapMarker(st.resolved.point, snapColorFor(st.resolved.kind), st.resolved.kind); else hideSnapMarker();
    setPreview(st.preview);
    if (st.M) showGhost(st.M);
    if (st.label) setVCB(st.label + (transformCopy ? ' · copia' : ''), st.measure);
  }

  function editClick(clientX, clientY) {
    lastMouseX = clientX; lastMouseY = clientY;
    const t = currentTool;
    if (t === 'paste') { commitPaste(clientX, clientY); return; }
    if (t === 'offset') {
      if (!offFace) {
        const hit = pickObjectWithFace(clientX, clientY);
        if (hit && faceOffsetInfo(hit.obj)) { offFace = hit.obj; typedValue = ''; hideFaceHighlight(); refreshEditPreview(); }
        else statusCoordsEl.textContent = 'Desfase: haz clic sobre una cara plana (altura 0).';
      } else commitFaceOffset(clientX, clientY);
      return;
    }
    if (t === 'fillet') {
      if (!filletSel) {
        const c = nearestFilletCorner(clientX, clientY);
        if (c) { filletSel = c; typedValue = ''; hideSnapMarker(); refreshEditPreview(); }
        else statusCoordsEl.textContent = 'Empalme: haz clic sobre una esquina donde se unen exactamente dos líneas (en caras planas).';
      } else commitFillet(clientX, clientY);
      return;
    }
    if (!selectedObjects.length) {
      const o = pickObject(clientX, clientY);
      if (o) { setSelection(curveMates(o)); refreshEditPreview(); }
      return;
    }
    const st = computeEditStep(clientX, clientY);
