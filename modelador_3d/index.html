<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>CrokisCAD 3D — PortiCAD Multi-Tools</title>
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="shortcut icon" href="/favicon.png" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Top bar ── */
  .topbar {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    flex-shrink: 0;
    z-index: 300;
    position: relative;
  }
  .topbar-logo { font-size: 16px; font-weight: 700; color: #58a6ff; text-decoration: none; }
  .topbar-sep  { color: #30363d; font-size: 18px; }
  .topbar-crumb { font-size: 14px; color: #8b949e; display: flex; align-items: center; gap: 6px; }
  .topbar-title { font-size: 15px; font-weight: 600; color: #e6edf3; }
  .badge { background: #f0b42922; border: 1px solid #f0b42955; color: #f0b429;
           font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 20px; margin-left: 6px; }

  /* ── Menu bar ── */
  .menubar {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    height: 34px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 2px;
    flex-shrink: 0;
    position: relative;
    z-index: 250;
  }
  .menu-item { position: relative; }
  .menu-btn {
    background: none; border: none; color: #c9d1d9; font-size: 13px;
    padding: 6px 12px; border-radius: 4px; cursor: pointer;
  }
  .menu-btn:hover, .menu-btn.open { background: #21262d; color: #e6edf3; }
  .menu-dropdown {
    position: absolute; top: 100%; left: 0; margin-top: 2px;
    background: #161b22; border: 1px solid #30363d; border-radius: 6px;
    min-width: 190px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    display: none; flex-direction: column; padding: 4px; z-index: 260;
  }
  .menu-dropdown.show { display: flex; }
  .menu-dropdown button {
    background: none; border: none; color: #e6edf3; text-align: left;
    padding: 7px 10px; border-radius: 4px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .menu-dropdown button:hover { background: #1f6feb22; }
  .menu-dropdown .key { color: #8b949e; font-size: 11px; }
  .menubar-sep { width: 1px; height: 20px; background: #30363d; margin: 0 4px; }
  .menubar-btn {
    background: none; border: none; color: #c9d1d9; padding: 6px 8px; border-radius: 4px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .menubar-btn:hover:not(:disabled) { background: #21262d; color: #e6edf3; }
  .menubar-btn:disabled { color: #484f58; cursor: default; }

  /* ── Layout ── */
  .workspace { flex: 1; display: flex; min-height: 0; }

  .toolbar {
    width: 52px; background: #161b22; border-right: 1px solid #30363d;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 0; flex-shrink: 0; overflow-y: auto;
  }
  .tool-btn {
    width: 38px; height: 38px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: #8b949e; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
  }
  .tool-btn:hover { background: #21262d; color: #e6edf3; }
  .tool-btn.active { background: #1f6feb22; border-color: #1f6feb55; color: #58a6ff; }
  .tool-sep { width: 26px; height: 1px; background: #30363d; margin: 4px 0; }

  .viewport { position: relative; flex: 1; min-width: 0; background: #0d1117; }
  .viewport canvas { display: block; width: 100%; height: 100%; }

  .hint {
    position: absolute; top: 10px; left: 10px; background: #161b22ee;
    border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px;
    font-size: 12px; color: #c9d1d9; max-width: 320px; pointer-events: none;
  }
  .hint b { color: #58a6ff; }

  .marquee {
    position: absolute; border: 1px solid #58a6ff; background: #58a6ff22;
    pointer-events: none; display: none; z-index: 50;
  }

  .statusbar {
    height: 26px; background: #161b22; border-top: 1px solid #30363d;
    display: flex; align-items: center; padding: 0 12px; gap: 16px;
    font-size: 11px; color: #8b949e; flex-shrink: 0;
  }
  .statusbar .tool-name { color: #58a6ff; font-weight: 600; }

  input[type=file] { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="/">PortiCAD</a>
  <span class="topbar-sep">›</span>
  <div class="topbar-crumb">
    <span>Multi-Tools</span><span>›</span>
    <span class="topbar-title">CrokisCAD 3D</span>
  </div>
  <span class="badge">🧪 Beta</span>
</div>

<div class="menubar">
  <div class="menu-item">
    <button class="menu-btn" id="fileMenuBtn">Archivo</button>
    <div class="menu-dropdown" id="fileMenuDropdown">
      <button id="btnNew">Nuevo <span class="key">Ctrl+N</span></button>
      <button id="btnOpen">Abrir… <span class="key">Ctrl+O</span></button>
      <button id="btnSave">Guardar <span class="key">Ctrl+S</span></button>
      <button id="btnSaveAs">Guardar como…</button>
      <button id="btnClearGuides">Limpiar guías</button>
    </div>
  </div>
  <div class="menubar-sep"></div>
  <button class="menubar-btn" id="btnUndo" title="Deshacer (Ctrl+Z)" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
  </button>
  <button class="menubar-btn" id="btnRedo" title="Rehacer (Ctrl+Y)" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg>
  </button>
</div>

<div class="workspace">
  <div class="toolbar" id="toolbar">
    <button class="tool-btn active" data-tool="select" title="Seleccionar (S)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3l7 17 2.5-7L20 10.5 4 3z"/></svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="line" title="Línea (L)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/><circle cx="4" cy="20" r="1.5" fill="currentColor"/><circle cx="20" cy="4" r="1.5" fill="currentColor"/></svg>
    </button>
    <button class="tool-btn" data-tool="rect" title="Rectángulo (R)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12"/></svg>
    </button>
    <button class="tool-btn" data-tool="circle" title="Círculo (C)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="erase" title="Borrador (E)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3l4 4L9 19H5v-4L17 3z"/><line x1="13" y1="7" x2="17" y2="11"/></svg>
    </button>
    <button class="tool-btn" data-tool="extrude" title="Extruir (P)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10"/><path d="M8 8l4-4 4 4"/><rect x="5" y="14" width="14" height="8"/></svg>
    </button>
    <button class="tool-btn" data-tool="move" title="Mover (M)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="guide" title="Cinta métrica / guía (G)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4" stroke-dasharray="3 3"/><circle cx="4" cy="20" r="1.5" fill="currentColor"/><circle cx="20" cy="4" r="1.5" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="viewport" id="viewport">
    <div class="hint" id="hint">Selecciona una herramienta para empezar.</div>
    <div class="marquee" id="marquee"></div>
  </div>
</div>

<div class="statusbar">
  <span>Herramienta: <span class="tool-name" id="statusTool">Seleccionar</span></span>
  <span id="statusCoords"></span>
  <span id="statusCount" style="margin-left:auto"></span>
</div>

<input type="file" id="fileInput" accept="application/json,.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  'use strict';

  // ───────────────────────── Scene setup ─────────────────────────
  const viewport = document.getElementById('viewport');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);

  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);
  camera.position.set(14, 12, 14);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  viewport.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  // Left button is reserved for drawing tools (SketchUp-style); orbit/pan use middle/right.
  controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.PAN };

  scene.add(new THREE.HemisphereLight(0xffffff, 0x30363d, 1.0));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7);
  sun.position.set(20, 30, 10);
  scene.add(sun);

  function resize() {
    const w = viewport.clientWidth, h = viewport.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // ───────────────────────── Grid + axes ─────────────────────────
  const GRID_SIZE = 40, GRID_DIV = 40;
  const grid = new THREE.GridHelper(GRID_SIZE, GRID_DIV, 0x30363d, 0x21262d);
  scene.add(grid);

  function makeAxisLine(dir, color) {
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0,0,0), dir.clone().multiplyScalar(GRID_SIZE/2)
    ]);
    const mat = new THREE.LineBasicMaterial({ color, linewidth: 2 });
    return new THREE.Line(geo, mat);
  }
  scene.add(makeAxisLine(new THREE.Vector3(1,0,0), 0xf85149)); // X - red
  scene.add(makeAxisLine(new THREE.Vector3(-1,0,0), 0xf85149));
  scene.add(makeAxisLine(new THREE.Vector3(0,0,1), 0x3fb950)); // Z - green
  scene.add(makeAxisLine(new THREE.Vector3(0,0,-1), 0x3fb950));
  scene.add(makeAxisLine(new THREE.Vector3(0,1,0), 0x58a6ff)); // Y - blue (up)

  const AXIS_COLOR_X = 0xf85149; // red
  const AXIS_COLOR_Z = 0x3fb950; // green
  const AXIS_COLOR_Y = 0x58a6ff; // blue
  const AXIS_COLOR_NONE = 0xf0b429; // amber (no lock)
  const AXIS_LOCK_PIXEL_RADIUS = 22;

  // Closest point on the infinite line (linePoint + t*lineDir) to the ray (rayOrigin + s*rayDir).
  function closestPointOnLineToRay(linePoint, lineDir, rayOrigin, rayDir) {
    const w0 = new THREE.Vector3().subVectors(linePoint, rayOrigin);
    const a = lineDir.dot(lineDir), b = lineDir.dot(rayDir), c = rayDir.dot(rayDir);
    const d = lineDir.dot(w0), e = rayDir.dot(w0);
    const denom = a * c - b * b;
    const t = Math.abs(denom) < 1e-9 ? 0 : (b * e - c * d) / denom;
    return linePoint.clone().addScaledVector(lineDir, t);
  }

  // SketchUp-style axis inference: while drawing/dragging from `anchor`, lock onto whichever
  // of the red/green/blue axes (through anchor) the cursor's 3D ray currently passes closest to
  // on screen. Works regardless of anchor's height, so it also catches the blue (vertical) axis.
  const AXIS_X_DIR = new THREE.Vector3(1, 0, 0), AXIS_Y_DIR = new THREE.Vector3(0, 1, 0), AXIS_Z_DIR = new THREE.Vector3(0, 0, 1);
  function resolveAxisSnap(anchor, clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const rayOrigin = raycaster.ray.origin, rayDir = raycaster.ray.direction.clone().normalize();
    const axes = [
      { key: 'x', dir: AXIS_X_DIR, color: AXIS_COLOR_X, label: 'Eje rojo' },
      { key: 'z', dir: AXIS_Z_DIR, color: AXIS_COLOR_Z, label: 'Eje verde' },
      { key: 'y', dir: AXIS_Y_DIR, color: AXIS_COLOR_Y, label: 'Eje azul' },
    ];
    let best = null;
    axes.forEach(ax => {
      const candidate = closestPointOnLineToRay(anchor, ax.dir, rayOrigin, rayDir);
      const d = screenDistToPoint(clientX, clientY, candidate);
      if (d <= AXIS_LOCK_PIXEL_RADIUS && (!best || d < best.d)) best = { point: candidate, axis: ax.key, color: ax.color, label: ax.label, d };
    });
    return best;
  }

  // ───────────────────────── Model data ─────────────────────────
  // objects[]: { id, type:'line'|'guide'|'rect'|'circle'|'polyface', params:{...}, height, mesh }
  // 'line' and 'polyface' vertices are shared NODES (see `nodes` below), so two lines (or a
  // line and a face) that meet at the same point are actually the same point — move it once
  // and everything referencing it updates. rect/circle/guide stay independent/parametric.
  let objects = [];
  let nextId = 1;
  let selectedObjects = [];

  let nodes = new Map();   // id -> { id, x, y, z }
  let nextNodeId = 1;
  function createNode(v) { const n = { id: nextNodeId++, x: v.x, y: v.y, z: v.z }; nodes.set(n.id, n); return n; }
  function nodePos(id) { const n = nodes.get(id); return new THREE.Vector3(n.x, n.y, n.z); }
  function setNodePos(id, v) { const n = nodes.get(id); n.x = v.x; n.y = v.y; n.z = v.z; }

  // Every 'line'/'polyface' object that references node `id` — used to cascade a move.
  function objectsUsingNode(id) {
    return objects.filter(o => (o.type === 'line' || o.type === 'polyface') && o.params.nodeIds.includes(id));
  }
  function nodeMoved(id) { objectsUsingNode(id).forEach(rebuildMesh); }

  function pruneOrphanNodes() {
    const used = new Set();
    objects.forEach(o => {
      if (o.type === 'line' || o.type === 'polyface') o.params.nodeIds.forEach(id => used.add(id));
      // A polyface's top-edge nodes stay alive even if every line using them was erased —
      // they're still needed to keep tracking the solid's top surface (see spawnPolyfaceTopEdges).
      if (o.type === 'polyface' && o.params.topNodeIds) o.params.topNodeIds.forEach(id => used.add(id));
    });
    Array.from(nodes.keys()).forEach(id => { if (!used.has(id)) nodes.delete(id); });
  }

  // A "derived" node is a polyface's top-edge node (see spawnPolyfaceTopEdges): its position
  // is always kept in lockstep with the solid's actual top surface (base node + height), never
  // dragged independently — the solid mesh itself is still a straight extrusion of the base
  // loop, so letting the Move tool grab a top node on its own would desync the edge lines from
  // the solid they sit on.
  function isDerivedNode(id) {
    return objects.some(o => o.type === 'polyface' && o.params.topNodeIds && o.params.topNodeIds.includes(id));
  }

  // ───────────────────────── Undo / Redo ─────────────────────────
  // Whole-state snapshots (not per-action inverse operations) — simplest thing that's
  // actually correct given how tangled the shared-node graph can get (a single wall push can
  // touch a face, its perimeter lines, and its top-edge lines all at once). Object ids and
  // node ids are preserved across a snapshot so undo/redo doesn't disturb identity/selection
  // any more than necessary.
  const UNDO_LIMIT = 50;
  let undoStack = [];
  let redoStack = [];
  let pendingUndoSnapshot = null; // captured at grab time for a drag (move/extrude), pushed only on real commit

  function snapshotState() {
    return {
      nextId, nextNodeId,
      nodes: Array.from(nodes.values()).map(n => ({ ...n })),
      objects: objects.map(o => ({ id: o.id, type: o.type, params: JSON.parse(JSON.stringify(o.params)), height: o.height })),
    };
  }

  function restoreState(snap) {
    objects.forEach(o => { scene.remove(o.mesh); disposeMesh(o.mesh); });
    objects = [];
    selectedObjects = [];
    nodes = new Map();
    snap.nodes.forEach(n => nodes.set(n.id, { ...n }));
    nextNodeId = snap.nextNodeId;
    snap.objects.forEach(o => {
      const obj = { id: o.id, type: o.type, params: o.params, height: o.height || 0 };
      obj.mesh = meshFor(obj);
      obj.mesh.userData.objRef = obj;
      scene.add(obj.mesh);
      obj.mesh.updateMatrixWorld(true);
      applyColor(obj);
      objects.push(obj);
    });
    nextId = snap.nextId;
    updateStatusCount();
  }

  function updateUndoRedoButtons() {
    btnUndo.disabled = undoStack.length === 0;
    btnRedo.disabled = redoStack.length === 0;
  }

  // Call BEFORE a mutation that commits in one shot (drawing a segment, adding a rect, an
  // erase, etc.) — captures the state to go back to if the user undoes this action.
  function pushUndo() {
    undoStack.push(snapshotState());
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    redoStack = [];
    updateUndoRedoButtons();
  }

  // Pushes the snapshot captured at grab time for a drag-based action (Move/Extrude) — used
  // instead of pushUndo() there because the "before" state has to be captured before the live
  // preview starts mutating things, but should only land on the stack if the drag is actually
  // committed (not if it's cancelled — see cancelDraw, which discards pendingUndoSnapshot).
  function commitPendingUndo() {
    if (!pendingUndoSnapshot) return;
    undoStack.push(pendingUndoSnapshot);
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    redoStack = [];
    pendingUndoSnapshot = null;
    updateUndoRedoButtons();
  }

  function doUndo() {
    if (!undoStack.length) return;
    cancelDraw(); // abandon any in-progress draw/drag before jumping to a different state
    redoStack.push(snapshotState());
    restoreState(undoStack.pop());
    updateUndoRedoButtons();
  }

  function doRedo() {
    if (!redoStack.length) return;
    cancelDraw();
    undoStack.push(snapshotState());
    restoreState(redoStack.pop());
    updateUndoRedoButtons();
  }

  const COLOR_DEFAULT = 0x58a6ff;
  const COLOR_SELECTED = 0xf0b429;
  const GUIDE_COLOR_DEFAULT = 0x8b949e; // muted gray, reads as "reference", not real geometry
  const LINE_COLOR_DEFAULT = 0xffffff;  // white vector lines read clearly on the dark background
  const TYPE_DEFAULT_COLOR = { guide: GUIDE_COLOR_DEFAULT, line: LINE_COLOR_DEFAULT };

  function applyColor(obj) {
    const base = TYPE_DEFAULT_COLOR[obj.type] || COLOR_DEFAULT;
    const c = selectedObjects.includes(obj) ? COLOR_SELECTED : base;
    obj.mesh.traverse(n => { if (n.material && n.material.color && !n.userData.isEdgeOverlay) n.material.color.setHex(c); });
  }

  function disposeMesh(mesh) {
    mesh.traverse(n => {
      if (n.geometry) n.geometry.dispose();
      if (n.material) n.material.dispose();
    });
  }

  // Adds SketchUp-style black edge lines along every border of a solid (top/bottom
  // perimeter + verticals). Raycasting is disabled on it so it never steals picks/faces.
  function attachEdges(mesh) {
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(mesh.geometry),
      new THREE.LineBasicMaterial({ color: 0x000000 })
    );
    edges.userData.isEdgeOverlay = true;
    edges.raycast = () => {};
    mesh.add(edges);
  }

  // Shared by Line and Guide: an invisible cylinder gives reliable, generous-radius
  // raycasting/picking (a true zero-width THREE.Line is hard to click precisely), while the
  // actual visible line is a real vector line (no 3D thickness) riding on top of it, with
  // raycasting disabled so it never competes with the pickable cylinder for the same hit.
  const EDGE_PICK_RADIUS = 0.045;
  function buildEdgeMesh(a, b, lineMaterial) {
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length() || 0.001;
    const geo = new THREE.CylinderGeometry(EDGE_PICK_RADIUS, EDGE_PICK_RADIUS, len, 6);
    geo.translate(0, len/2, 0);
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ visible: false }));
    mesh.position.copy(a);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());

    const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,len,0)]);
    const visLine = new THREE.Line(lineGeo, lineMaterial);
    if (lineMaterial.isLineDashedMaterial) visLine.computeLineDistances();
    visLine.raycast = () => {};
    mesh.add(visLine);
    return mesh;
  }

  function buildLineMesh(a, b) {
    return buildEdgeMesh(a, b, new THREE.LineBasicMaterial({ color: LINE_COLOR_DEFAULT }));
  }

  // Reference/guide line ("cinta métrica"): other tools can still snap to it (via
  // objectVertices/resolveGeometrySnap) but it's excluded from extrude and never forms a face.
  function buildGuideMesh(a, b) {
    return buildEdgeMesh(a, b, new THREE.LineDashedMaterial({ color: GUIDE_COLOR_DEFAULT, dashSize: 0.25, gapSize: 0.18 }));
  }

  function buildRectMesh(x1, z1, x2, z2, height, baseY) {
    baseY = baseY || 0;
    const w = Math.max(Math.abs(x2 - x1), 0.001);
    const d = Math.max(Math.abs(z2 - z1), 0.001);
    const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
    const mat = new THREE.MeshStandardMaterial({ color: COLOR_DEFAULT, side: THREE.DoubleSide });
    let mesh;
    if (height > 0) {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(w, height, d), mat);
      mesh.position.set(cx, baseY + height/2, cz);
    } else {
      mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
      mesh.rotation.x = -Math.PI/2;
      mesh.position.set(cx, baseY + 0.002, cz);
    }
    attachEdges(mesh);
    return mesh;
  }

  function buildCircleMesh(cx, cz, radius, height, baseY) {
    baseY = baseY || 0;
    radius = Math.max(radius, 0.001);
    const mat = new THREE.MeshStandardMaterial({ color: COLOR_DEFAULT, side: THREE.DoubleSide });
    let mesh;
    if (height > 0) {
      mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 32), mat);
      mesh.position.set(cx, baseY + height/2, cz);
    } else {
      mesh = new THREE.Mesh(new THREE.CircleGeometry(radius, 32), mat);
      mesh.rotation.x = -Math.PI/2;
      mesh.position.set(cx, baseY + 0.002, cz);
    }
    attachEdges(mesh);
    return mesh;
  }

  // ── Arbitrary closed polygon (auto-created when a line chain closes back on itself) ──
  // Supports 3 axis-aligned planes so a closed loop can be a horizontal floor OR a
  // vertical wall (drawn using the blue-axis lock): 'xz' (horizontal, points=[x,z],
  // extrudes toward +Y), 'zy' (wall at x=base, points=[z,y], extrudes toward +X), 'xy'
  // (wall at z=base, points=[x,y], extrudes toward +Z). `base` is the polygon's offset
  // along whichever world axis is perpendicular to its plane.
  const POLYFACE_BASES = {
    xz: { x: new THREE.Vector3(1,0,0), y: new THREE.Vector3(0,0,1), z: new THREE.Vector3(0,1,0) },
    zy: { x: new THREE.Vector3(0,0,1), y: new THREE.Vector3(0,1,0), z: new THREE.Vector3(1,0,0) },
    xy: { x: new THREE.Vector3(1,0,0), y: new THREE.Vector3(0,1,0), z: new THREE.Vector3(0,0,1) },
  };
  function polyfaceOffsetVector(orientation, offset) {
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    return b.z.clone().multiplyScalar(offset);
  }
  // Maps a point's local (u,v) polygon coords, at a given offset along the plane's
  // normal, back to world XYZ.
  function polyfaceTo3D(orientation, offset, u, v) {
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    return b.x.clone().multiplyScalar(u).add(b.y.clone().multiplyScalar(v)).add(polyfaceOffsetVector(orientation, offset));
  }
  // Inverse: a world point's (u,v) coords within the polygon's plane.
  function polyfaceTo2D(orientation, worldPoint) {
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    return [worldPoint.dot(b.x), worldPoint.dot(b.y)];
  }
  // The world coordinate that measures "how far along the normal" a point is.
  function polyfaceNormalCoord(orientation, worldPoint) {
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    return worldPoint.dot(b.z);
  }
  // A 2D in-plane direction (e.g. a wall's outward edge normal) mapped to world XYZ.
  function polyface2DDirTo3D(orientation, du, dv) {
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    return b.x.clone().multiplyScalar(du).add(b.y.clone().multiplyScalar(dv));
  }

  // A polyface's current 2D (u,v) outline, resolved live from its shared nodes — never
  // cached, so moving a node is automatically reflected next render.
  function polyfacePoints2D(face) {
    const orientation = face.params.orientation || 'xz';
    return face.params.nodeIds.map(id => polyfaceTo2D(orientation, nodePos(id)));
  }

  // Figures out which of the 3 axis-aligned planes a just-closed line chain lies in —
  // 'xz' (horizontal floor), 'zy' or 'xy' (a vertical wall, reached by drawing with the
  // blue-axis lock). Returns null if the loop isn't flat in any of them (e.g. drawn off
  // any axis lock), so the caller can leave the original lines alone instead of collapsing
  // them into a broken/degenerate face.
  const POLYGON_PLANAR_EPS = 0.02;
  function detectPolygonOrientation(points3D) {
    const xs = points3D.map(p => p.x), ys = points3D.map(p => p.y), zs = points3D.map(p => p.z);
    const spanX = Math.max(...xs) - Math.min(...xs);
    const spanY = Math.max(...ys) - Math.min(...ys);
    const spanZ = Math.max(...zs) - Math.min(...zs);
    if (spanY <= POLYGON_PLANAR_EPS) return { orientation: 'xz', base: ys[0], points: points3D.map(p => [p.x, p.z]) };
    if (spanX <= POLYGON_PLANAR_EPS) return { orientation: 'zy', base: xs[0], points: points3D.map(p => [p.z, p.y]) };
    if (spanZ <= POLYGON_PLANAR_EPS) return { orientation: 'xy', base: zs[0], points: points3D.map(p => [p.x, p.y]) };
    return null;
  }

  function buildPolyfaceMesh(points, height, orientation, base) {
    orientation = orientation || 'xz';
    base = base || 0;
    const shape = new THREE.Shape(points.map(p => new THREE.Vector2(p[0], p[1])));
    const mat = new THREE.MeshStandardMaterial({ color: COLOR_DEFAULT, side: THREE.DoubleSide });
    const geo = height > 0
      ? new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false })
      : new THREE.ShapeGeometry(shape);
    const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
    const matrix = new THREE.Matrix4().makeBasis(b.x, b.y, b.z).setPosition(polyfaceOffsetVector(orientation, base));
    geo.applyMatrix4(matrix);
    const mesh = new THREE.Mesh(geo, mat);
    if (height <= 0) mesh.position.addScaledVector(b.z, 0.002); // nudge off the plane, avoids z-fighting
    attachEdges(mesh);
    return mesh;
  }

  function meshFor(obj) {
    if (obj.type === 'line') return buildLineMesh(nodePos(obj.params.nodeIds[0]), nodePos(obj.params.nodeIds[1]));
    if (obj.type === 'guide') return buildGuideMesh(new THREE.Vector3(...obj.params.a), new THREE.Vector3(...obj.params.b));
    if (obj.type === 'rect') return buildRectMesh(obj.params.x1, obj.params.z1, obj.params.x2, obj.params.z2, obj.height, obj.params.baseY);
    if (obj.type === 'circle') return buildCircleMesh(obj.params.cx, obj.params.cz, obj.params.radius, obj.height, obj.params.baseY);
    if (obj.type === 'polyface') return buildPolyfaceMesh(polyfacePoints2D(obj), obj.height, obj.params.orientation, obj.params.base);
  }

  function addObject(type, params, height) {
    const obj = { id: nextId++, type, params, height: height || 0 };
    obj.mesh = meshFor(obj);
    obj.mesh.userData.objRef = obj;
    scene.add(obj.mesh);
    obj.mesh.updateMatrixWorld(true);
    objects.push(obj);
    updateStatusCount();
    return obj;
  }

  function rebuildMesh(obj) {
    scene.remove(obj.mesh);
    disposeMesh(obj.mesh);
    obj.mesh = meshFor(obj);
    obj.mesh.userData.objRef = obj;
    scene.add(obj.mesh);
    obj.mesh.updateMatrixWorld(true);
    applyColor(obj);
  }

  // Every polyface whose BASE boundary loop uses (nodeIdA, nodeIdB) as one of its actual
  // edges (adjacent in the loop) — i.e. the fill(s) that would lose part of their perimeter
  // if this specific edge line were deleted. Deliberately checks only the base loop, not a
  // solid's derived top/vertical edges (spawnPolyfaceTopEdges) — those are cosmetic tracing,
  // not part of what defines the fill's shape, so erasing one shouldn't take the solid with it.
  function facesUsingEdge(nodeIdA, nodeIdB) {
    return objects.filter(o => o.type === 'polyface' && areAdjacentInLoop(o.params.nodeIds, nodeIdA, nodeIdB));
  }

  function removeObject(obj) {
    if (!objects.includes(obj)) return; // already gone (e.g. cascaded away with its fill already)
    if (obj.type === 'line') {
      // SketchUp-style: erasing an edge that bounds a face takes the face's fill with it,
      // but leaves the face's other edges standing (now bounding nothing).
      const [a, b] = obj.params.nodeIds;
      facesUsingEdge(a, b).forEach(removeObject);
    }
    scene.remove(obj.mesh);
    disposeMesh(obj.mesh);
    objects = objects.filter(o => o !== obj);
    selectedObjects = selectedObjects.filter(o => o !== obj);
    pruneOrphanNodes();
    updateStatusCount();
  }

  function clearAll() {
    objects.forEach(o => { scene.remove(o.mesh); disposeMesh(o.mesh); });
    objects = [];
    selectedObjects = [];
    nodes = new Map();
    updateStatusCount();
  }

  function setSelection(arr) {
    const prev = selectedObjects;
    selectedObjects = arr.slice();
    prev.forEach(o => { if (!selectedObjects.includes(o)) applyColor(o); });
    selectedObjects.forEach(o => applyColor(o));
  }

  function selectObject(obj) {
    setSelection(obj ? [obj] : []);
  }

  // Face highlight for the Extrude tool — shows exactly which face will be pushed/pulled,
  // not the whole solid, both while hovering and live while dragging it.
  const FACE_HIGHLIGHT_COLOR = 0x79c0ff;
  let faceHighlightMesh = null;
  function showFaceHighlight(mesh) {
    hideFaceHighlight();
    if (!mesh) return;
    mesh.raycast = () => {};
    faceHighlightMesh = mesh;
    scene.add(faceHighlightMesh);
  }
  function hideFaceHighlight() {
    if (faceHighlightMesh) { scene.remove(faceHighlightMesh); disposeMesh(faceHighlightMesh); faceHighlightMesh = null; }
  }

  // Builds a thin overlay mesh matching exactly the geometry of one face of a solid,
  // so the Extrude tool can highlight/track that single face instead of the whole object.
  function buildFaceHighlightMesh(obj, faceKind) {
    if (!faceKind) return null;
    const mat = new THREE.MeshBasicMaterial({ color: FACE_HIGHLIGHT_COLOR, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false });
    const baseY = (obj.params && obj.params.baseY) || 0;
    const h = obj.height;
    const topY = baseY + (h > 0 ? h : 0) + 0.01;

    if (obj.type === 'rect') {
      const { x1, z1, x2, z2 } = obj.params;
      const xMin = Math.min(x1, x2), xMax = Math.max(x1, x2), zMin = Math.min(z1, z2), zMax = Math.max(z1, z2);
      if (faceKind === 'top') {
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(xMax - xMin, zMax - zMin), mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.set((xMin + xMax) / 2, topY, (zMin + zMax) / 2);
        return mesh;
      }
      if (faceKind === 'x+' || faceKind === 'x-') {
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(zMax - zMin, h), mat);
        mesh.rotation.y = Math.PI / 2;
        mesh.position.set(faceKind === 'x+' ? xMax : xMin, baseY + h / 2, (zMin + zMax) / 2);
        return mesh;
      }
      if (faceKind === 'z+' || faceKind === 'z-') {
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(xMax - xMin, h), mat);
        mesh.position.set((xMin + xMax) / 2, baseY + h / 2, faceKind === 'z+' ? zMax : zMin);
        return mesh;
      }
    }
    if (obj.type === 'circle') {
      const { cx, cz, radius } = obj.params;
      if (faceKind === 'top') {
        const mesh = new THREE.Mesh(new THREE.CircleGeometry(radius, 32), mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.set(cx, topY, cz);
        return mesh;
      }
      if (faceKind === 'radius') {
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, h, 32, 1, true), mat);
        mesh.position.set(cx, baseY + h / 2, cz);
        return mesh;
      }
    }
    if (obj.type === 'polyface') {
      const pts = polyfacePoints2D(obj);
      const orientation = obj.params.orientation || 'xz';
      const faceBase = obj.params.base || 0;
      if (faceKind === 'top') {
        const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
        const geo = new THREE.ShapeGeometry(shape);
        const b = POLYFACE_BASES[orientation] || POLYFACE_BASES.xz;
        const topOffset = faceBase + (h > 0 ? h : 0) + 0.01;
        geo.applyMatrix4(new THREE.Matrix4().makeBasis(b.x, b.y, b.z).setPosition(polyfaceOffsetVector(orientation, topOffset)));
        return new THREE.Mesh(geo, mat);
      }
      const wallMatch = /^wall(\d+)$/.exec(faceKind);
      if (wallMatch) {
        const k = parseInt(wallMatch[1], 10);
        const a = pts[k], b2 = pts[(k + 1) % pts.length];
        const p0 = polyfaceTo3D(orientation, faceBase, a[0], a[1]);
        const p1 = polyfaceTo3D(orientation, faceBase, b2[0], b2[1]);
        const p2 = polyfaceTo3D(orientation, faceBase + h, b2[0], b2[1]);
        const p3 = polyfaceTo3D(orientation, faceBase + h, a[0], a[1]);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
          p0.x, p0.y, p0.z,  p1.x, p1.y, p1.z,  p2.x, p2.y, p2.z,
          p0.x, p0.y, p0.z,  p2.x, p2.y, p2.z,  p3.x, p3.y, p3.z,
        ]), 3));
        geo.computeVertexNormals();
        return new THREE.Mesh(geo, mat);
      }
    }
    return null;
  }

  // ───────────────────────── Tools / interaction ─────────────────────────
  let currentTool = 'select';
  const raycaster = new THREE.Raycaster();
  const mouseNDC = new THREE.Vector2();

  const hintEl = document.getElementById('hint');
  const statusToolEl = document.getElementById('statusTool');
  const statusCoordsEl = document.getElementById('statusCoords');
  const statusCountEl = document.getElementById('statusCount');
  const btnUndo = document.getElementById('btnUndo');
  const btnRedo = document.getElementById('btnRedo');

  const TOOL_HINTS = {
    select: 'Haz clic sobre una figura para seleccionarla.',
    line: 'Clic para el primer punto, clic para el segundo (engancha a extremos/medios/aristas y esquinas de sólidos, incluido el eje azul). Escribe un número + Enter para una longitud exacta. Cierra sobre el punto de inicio para crear una cara. Esc para cancelar.',
    rect: 'Clic en una esquina, clic en la esquina opuesta.',
    circle: 'Clic en el centro, clic para fijar el radio.',
    erase: 'Haz clic sobre una figura para borrarla.',
    extrude: 'Pasa el cursor para ver resaltada la cara exacta. Clic para agarrarla, mueve el mouse (la cara sigue al cursor), clic de nuevo para soltar — o escribe un número + Enter. Esc cancela.',
    move: 'Clic sobre una figura y arrastra para reubicarla. Acércate a un eje rojo/verde/azul para moverla solo en esa dirección (incluye subir/bajar del plano).',
    guide: 'Cinta métrica: clic en vacío para trazar una guía punto a punto (como la Línea). Clic sobre una línea o guía existente para crear una paralela a ella — mueve el mouse o escribe un número + Enter para fijar el offset. Archivo › Limpiar guías las borra todas.'
  };

  function updateStatusCount() {
    statusCountEl.textContent = objects.length + ' objeto(s)';
  }

  function setTool(tool) {
    cancelDraw();
    currentTool = tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
    const names = { select:'Seleccionar', line:'Línea', rect:'Rectángulo', circle:'Círculo', erase:'Borrador', extrude:'Extruir', move:'Mover', guide:'Cinta métrica' };
    statusToolEl.textContent = names[tool];
    hintEl.textContent = TOOL_HINTS[tool];
  }

  document.getElementById('toolbar').addEventListener('click', (e) => {
    const btn = e.target.closest('.tool-btn');
    if (btn) setTool(btn.dataset.tool);
  });

  // Intersects the cursor ray with the horizontal plane at height y (generalizes groundPoint
  // to any elevation, so drawing can continue level with an already-elevated point).
  function planePoint(clientX, clientY, y) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -y);
    const pt = new THREE.Vector3();
    const hit = raycaster.ray.intersectPlane(plane, pt);
    return hit ? pt : null;
  }

  function groundPoint(clientX, clientY) { return planePoint(clientX, clientY, 0); }

  function objRefOf(hit) {
    let n = hit.object;
    while (n && !n.userData.objRef) n = n.parent;
    return n ? n.userData.objRef : null;
  }

  function raycastAll(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    return raycaster.intersectObjects(objects.map(o => o.mesh), true);
  }

  // A kept perimeter line/guide sits flush on its face's own edge once that face has real
  // volume (extruded), so the two compete for the same ray hit almost exactly at tie. Since
  // clicking a thin edge is usually the more deliberate/precise action, prefer a line/guide
  // hit that's about as close as the closest hit, rather than blindly trusting hits[0].
  const COINCIDENT_HIT_EPS = 0.05;
  function pickObject(clientX, clientY) {
    const hits = raycastAll(clientX, clientY);
    if (!hits.length) return null;
    const closestDist = hits[0].distance;
    const edgeHit = hits.find(h => {
      const ref = objRefOf(h);
      return ref && (ref.type === 'line' || ref.type === 'guide') && h.distance <= closestDist + COINCIDENT_HIT_EPS;
    });
    return objRefOf(edgeHit || hits[0]);
  }

  // Like pickObject, but also returns which face was hit (for per-face push/pull). Extrude
  // can never act on a line/guide, so here it's the opposite preference: skip past one if
  // an actual face/solid was also hit, so pushing a face doesn't get blocked by its own
  // kept perimeter edge sitting on top of it.
  function pickObjectWithFace(clientX, clientY) {
    const hits = raycastAll(clientX, clientY);
    if (!hits.length) return null;
    const faceHit = hits.find(h => {
      const ref = objRefOf(h);
      return ref && ref.type !== 'line' && ref.type !== 'guide';
    }) || hits[0];
    const obj = objRefOf(faceHit);
    if (!obj) return null;
    return { obj, normal: faceHit.face ? faceHit.face.normal.clone() : null, point: faceHit.point.clone() };
  }

  // World-space outward normal for a given face kind (used to read the true push/pull
  // direction off the screen, instead of assuming "up on screen" always means "outward").
  function worldNormalForFace(obj, faceKind, hitPoint) {
    if (faceKind === 'top') {
      // For a polyface this is also hit when it's still flat (first-time extrude) — push
      // along the plane's own normal, not always +Y, so a vertical wall extrudes sideways.
      if (obj.type === 'polyface') return (POLYFACE_BASES[obj.params.orientation || 'xz'] || POLYFACE_BASES.xz).z.clone();
      return new THREE.Vector3(0, 1, 0);
    }
    if (faceKind === 'x+') return new THREE.Vector3(1, 0, 0);
    if (faceKind === 'x-') return new THREE.Vector3(-1, 0, 0);
    if (faceKind === 'z+') return new THREE.Vector3(0, 0, 1);
    if (faceKind === 'z-') return new THREE.Vector3(0, 0, -1);
    if (faceKind === 'radius') {
      const dir = new THREE.Vector3(hitPoint.x - obj.params.cx, 0, hitPoint.z - obj.params.cz);
      return dir.lengthSq() > 1e-9 ? dir.normalize() : new THREE.Vector3(1, 0, 0);
    }
    return new THREE.Vector3(0, 1, 0);
  }

  // Exact push/pull amount: intersects the cursor ray with the infinite line through the
  // original hit point along the face's outward normal, and returns the signed distance
  // from the hit point to that intersection. The face then tracks precisely under the
  // cursor along that one axis — no arbitrary pixel-to-world scale factor to get "backwards".
  function computePushDelta(hitPoint, worldNormal, clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const onAxis = closestPointOnLineToRay(hitPoint, worldNormal, raycaster.ray.origin, raycaster.ray.direction.clone().normalize());
    return onAxis.clone().sub(hitPoint).dot(worldNormal);
  }

  // Outward-pointing 2D normal of polygon edge k (points[k] -> points[k+1]), in XZ.
  // "Outward" is resolved as "away from the polygon's centroid" so it's correct
  // regardless of the vertex winding order.
  function polygonEdgeNormal(points, k) {
    const n = points.length;
    const a = points[k], b = points[(k + 1) % n];
    const dx = b[0] - a[0], dz = b[1] - a[1];
    const len = Math.hypot(dx, dz) || 1;
    let nx = dz / len, nz = -dx / len;
    let cx = 0, cz = 0;
    points.forEach(p => { cx += p[0]; cz += p[1]; });
    cx /= n; cz /= n;
    const midX = (a[0] + b[0]) / 2 - cx, midZ = (a[1] + b[1]) / 2 - cz;
    if (nx * midX + nz * midZ < 0) { nx = -nx; nz = -nz; }
    return [nx, nz];
  }

  // Intersection of line1 (p1 + t*d1) and line2 (p2 + s*d2), or null if ~parallel.
  function lineIntersect2D(p1, d1, p2, d2) {
    const denom = d1[0] * d2[1] - d1[1] * d2[0];
    if (Math.abs(denom) < 1e-9) return null;
    const dx = p2[0] - p1[0], dz = p2[1] - p1[1];
    const t = (dx * d2[1] - dz * d2[0]) / denom;
    return [p1[0] + d1[0] * t, p1[1] + d1[1] * t];
  }

  // Pushes/pulls one wall of a closed polygon by `distance` along its outward normal,
  // keeping it connected to its neighbors: only the shared edge's LINE shifts, and the
  // two adjacent vertices are recomputed as intersections with the (unmoved) neighbor
  // edges — so the rest of the polygon stays put, exactly like an independent wall push.
  function offsetPolygonEdge(points, edgeIndex, distance) {
    const n = points.length;
    const [nx, nz] = polygonEdgeNormal(points, edgeIndex);
    const a = points[edgeIndex], b = points[(edgeIndex + 1) % n];
    const shiftedA = [a[0] + nx * distance, a[1] + nz * distance];
    const dir = [b[0] - a[0], b[1] - a[1]];

    const prevA = points[(edgeIndex - 1 + n) % n];
    const prevDir = [a[0] - prevA[0], a[1] - prevA[1]];
    const newA = lineIntersect2D(prevA, prevDir, shiftedA, dir) || shiftedA;

    const nextB = points[(edgeIndex + 2) % n];
    const nextDir = [nextB[0] - b[0], nextB[1] - b[1]];
    const shiftedB = [b[0] + nx * distance, b[1] + nz * distance];
    const newB = lineIntersect2D(shiftedA, dir, b, nextDir) || shiftedB;

    const result = points.map(p => p.slice());
    result[edgeIndex] = newA;
    result[(edgeIndex + 1) % n] = newB;
    return result;
  }

  // Which face was hit, decided from the hit POINT's position, not the raycaster's face
  // normal — ExtrudeGeometry (used for closed-loop faces) can hand back an inverted local
  // normal depending on winding, which was making the wrong (opposite) wall get pushed.
  // Position is ground truth regardless of any geometry's winding quirks.
  function determineFace(obj, hitPoint) {
    if (!hitPoint || obj.height <= 0) return 'top'; // flat face: only "pull up to create height" applies
    const baseY = (obj.params && obj.params.baseY) || 0;
    const topY = baseY + obj.height;
    const capDist = Math.min(Math.abs(hitPoint.y - topY), Math.abs(hitPoint.y - baseY));

    if (obj.type === 'rect') {
      const { x1, z1, x2, z2 } = obj.params;
      const xMin = Math.min(x1, x2), xMax = Math.max(x1, x2), zMin = Math.min(z1, z2), zMax = Math.max(z1, z2);
      const candidates = [
        { kind: 'top', d: capDist },
        { kind: 'x-', d: Math.abs(hitPoint.x - xMin) }, { kind: 'x+', d: Math.abs(hitPoint.x - xMax) },
        { kind: 'z-', d: Math.abs(hitPoint.z - zMin) }, { kind: 'z+', d: Math.abs(hitPoint.z - zMax) },
      ];
      candidates.sort((a, b) => a.d - b.d);
      return candidates[0].kind;
    }
    if (obj.type === 'circle') {
      const { cx, cz, radius } = obj.params;
      const radiusDist = Math.abs(Math.hypot(hitPoint.x - cx, hitPoint.z - cz) - radius);
      return capDist < radiusDist ? 'top' : 'radius';
    }
    if (obj.type === 'polyface') {
      const orientation = obj.params.orientation || 'xz';
      const base = obj.params.base || 0;
      const alongNormal = polyfaceNormalCoord(orientation, hitPoint);
      const faceCapDist = Math.min(Math.abs(alongNormal - (base + obj.height)), Math.abs(alongNormal - base));
      const [hu, hv] = polyfaceTo2D(orientation, hitPoint);
      const pts = polyfacePoints2D(obj);
      let bestIdx = 0, bestDist = Infinity;
      for (let k = 0; k < pts.length; k++) {
        const a = pts[k], b = pts[(k + 1) % pts.length];
        const cp = closestPointOnSegment2D(hu, hv, a, b);
        const d = Math.hypot(hu - cp[0], hv - cp[1]);
        if (d < bestDist) { bestDist = d; bestIdx = k; }
      }
      return faceCapDist < bestDist ? 'top' : 'wall' + bestIdx;
    }
    return 'top';
  }

  function closestPointOnSegment2D(px, pz, a, b) {
    const dx = b[0] - a[0], dz = b[1] - a[1];
    const lenSq = dx * dx + dz * dz || 1;
    const t = Math.max(0, Math.min(1, ((px - a[0]) * dx + (pz - a[1]) * dz) / lenSq));
    return [a[0] + dx * t, a[1] + dz * t];
  }

  // Resolves a face kind to the exact param field to edit, the base value to drag from,
  // and the sign that makes "drag away from the box" increase that field.
  function faceInfo(obj, faceKind) {
    if (faceKind === 'top') return { field: 'height', sign: 1, base: obj.height };
    if (faceKind === 'radius') return { field: 'radius', sign: 1, base: obj.params.radius };
    const p = obj.params;
    if (faceKind === 'x+') { const f = p.x1 >= p.x2 ? 'x1' : 'x2'; return { field: f, sign: 1, base: p[f] }; }
    if (faceKind === 'x-') { const f = p.x1 <= p.x2 ? 'x1' : 'x2'; return { field: f, sign: -1, base: p[f] }; }
    if (faceKind === 'z+') { const f = p.z1 >= p.z2 ? 'z1' : 'z2'; return { field: f, sign: 1, base: p[f] }; }
    { const f = p.z1 <= p.z2 ? 'z1' : 'z2'; return { field: f, sign: -1, base: p[f] }; } // 'z-'
  }

  const MIN_FACE_SIZE = 0.05;
  function applyFaceDrag(obj, field, sign, baseValue, delta) {
    const newValue = baseValue + sign * delta;
    if (field === 'height') { obj.height = Math.max(MIN_FACE_SIZE, newValue); return; }
    if (field === 'radius') { obj.params.radius = Math.max(MIN_FACE_SIZE, newValue); return; }
    const otherField = { x1: 'x2', x2: 'x1', z1: 'z2', z2: 'z1' }[field];
    const otherValue = obj.params[otherField];
    obj.params[field] = sign > 0 ? Math.max(newValue, otherValue + MIN_FACE_SIZE) : Math.min(newValue, otherValue - MIN_FACE_SIZE);
  }

  // The first time a polyface actually gains volume, spawn real, independent, erasable
  // 'line' objects for its top perimeter and its vertical edges — before this, extruding a
  // shape only drew a cosmetic (unpickable) EdgesGeometry outline baked into the solid mesh,
  // so the user had no way to select/erase just one edge of the resulting box. Each top
  // corner gets its own real shared node (topNodeIds, parallel to the base nodeIds), kept in
  // lockstep with the solid's actual top surface by refreshExtrudePreview on every later
  // height/wall push — see isDerivedNode for why these nodes can't be dragged independently.
  function spawnPolyfaceTopEdges(face) {
    const orientation = face.params.orientation || 'xz';
    const topOffset = (face.params.base || 0) + face.height;
    const baseIds = face.params.nodeIds;
    const topNodeIds = baseIds.map(id => {
      const [u, v] = polyfaceTo2D(orientation, nodePos(id));
      return createNode(polyfaceTo3D(orientation, topOffset, u, v)).id;
    });
    face.params.topNodeIds = topNodeIds;
    const n = topNodeIds.length;
    for (let i = 0; i < n; i++) {
      addObject('line', { nodeIds: [topNodeIds[i], topNodeIds[(i + 1) % n]] }); // top perimeter
      addObject('line', { nodeIds: [baseIds[i], topNodeIds[i]] }); // vertical edge
    }
  }

  // Snapshot of a polyface's node positions (base, plus top-edge nodes if it has them) for
  // Escape-revert during a push/pull drag.
  function snapshotPolyfaceNodes(face, topOnly) {
    const list = [];
    if (!topOnly) face.params.nodeIds.forEach(id => list.push({ id, pos: nodePos(id) }));
    if (face.params.topNodeIds) face.params.topNodeIds.forEach(id => list.push({ id, pos: nodePos(id) }));
    return list;
  }

  // Applies the current push/pull (from the live cursor, or the typed VCB value if any),
  // rebuilds the mesh, and keeps the face highlight tracking the exact face being pushed.
  function refreshExtrudePreview(clientX, clientY) {
    if (currentTool !== 'extrude' || !extrudeObj) return;
    const delta = typedValue !== '' ? (parseFloat(typedValue) || 0) : computePushDelta(extrudeHitPoint, extrudeWorldNormal, clientX, clientY);
    const orientation = extrudeObj.params.orientation || 'xz';
    const base = extrudeObj.params.base || 0;
    if (extrudeWallIndex !== null) {
      const newPts = offsetPolygonEdge(extrudeBasePoints, extrudeWallIndex, delta);
      const nodeIds = extrudeObj.params.nodeIds;
      newPts.forEach((p, idx) => setNodePos(nodeIds[idx], polyfaceTo3D(orientation, base, p[0], p[1])));
      nodeIds.forEach(id => nodeMoved(id));
      if (extrudeObj.params.topNodeIds) {
        // Keep the top-edge nodes tracking the same (u,v) as their base counterparts, at the
        // solid's top offset, so the top perimeter/vertical edge lines stay glued to the wall.
        const topOffset = base + extrudeObj.height;
        newPts.forEach((p, idx) => setNodePos(extrudeObj.params.topNodeIds[idx], polyfaceTo3D(orientation, topOffset, p[0], p[1])));
        extrudeObj.params.topNodeIds.forEach(id => nodeMoved(id));
      }
    } else {
      applyFaceDrag(extrudeObj, extrudeField, extrudeSign, extrudeBaseValue, delta);
      if (extrudeObj.type === 'polyface' && extrudeObj.params.topNodeIds) {
        // A top push changes only the offset-along-normal component of each top node — same
        // (u,v) as its base counterpart, new offset = base + the just-updated height.
        const topOffset = base + extrudeObj.height;
        extrudeObj.params.nodeIds.forEach((baseId, idx) => {
          const [u, v] = polyfaceTo2D(orientation, nodePos(baseId));
          setNodePos(extrudeObj.params.topNodeIds[idx], polyfaceTo3D(orientation, topOffset, u, v));
        });
        extrudeObj.params.topNodeIds.forEach(id => nodeMoved(id));
      }
    }
    rebuildMesh(extrudeObj);
    selectObject(extrudeObj);
    showFaceHighlight(buildFaceHighlightMesh(extrudeObj, extrudeFaceKind));
    let txt = 'distancia: ' + delta.toFixed(2);
    if (typedValue !== '') txt += '  → ' + typedValue + ' [Enter]';
    statusCoordsEl.textContent = txt;
  }

  function endExtrudeDrag() {
    if (extrudeObj && extrudeObj.type === 'polyface' && extrudeObj.height > 0 && !extrudeObj.params.topNodeIds) {
      spawnPolyfaceTopEdges(extrudeObj);
    }
    commitPendingUndo();
    extrudeObj = null;
    extrudeSnapshotParams = null;
    extrudeWallIndex = null;
    extrudeBasePoints = null;
    extrudeNodeSnapshot = null;
    extrudeFaceKind = null;
    extrudeHitPoint = null;
    extrudeWorldNormal = null;
    typedValue = '';
    hideFaceHighlight();
    controls.enabled = true;
  }

  // ── Box (marquee) select: drag with the Select tool to grab every object the rectangle touches ──
  const marqueeEl = document.getElementById('marquee');
  const BOX_SELECT_THRESHOLD_PX = 4;
  let selectDragStart = null;   // {x,y} in client coords
  let boxSelectActive = false;

  function screenBoundsOf(obj, canvasRect) {
    const box = new THREE.Box3().setFromObject(obj.mesh);
    const corners = [
      [box.min.x, box.min.y, box.min.z], [box.min.x, box.min.y, box.max.z],
      [box.min.x, box.max.y, box.min.z], [box.min.x, box.max.y, box.max.z],
      [box.max.x, box.min.y, box.min.z], [box.max.x, box.min.y, box.max.z],
      [box.max.x, box.max.y, box.min.z], [box.max.x, box.max.y, box.max.z],
    ];
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const v = new THREE.Vector3();
    corners.forEach(c => {
      v.set(c[0], c[1], c[2]).project(camera);
      const sx = (v.x + 1) / 2 * canvasRect.width;
      const sy = (1 - v.y) / 2 * canvasRect.height;
      minX = Math.min(minX, sx); maxX = Math.max(maxX, sx);
      minY = Math.min(minY, sy); maxY = Math.max(maxY, sy);
    });
    return { minX, minY, maxX, maxY };
  }

  function rectsIntersect(a, b) {
    return !(a.maxX < b.minX || a.minX > b.maxX || a.maxY < b.minY || a.minY > b.maxY);
  }

  function projectToScreen(worldVec3, canvasRect) {
    const v = worldVec3.clone().project(camera);
    return { x: (v.x + 1) / 2 * canvasRect.width, y: (1 - v.y) / 2 * canvasRect.height };
  }

  // Exact 2D segment-vs-rectangle test — a diagonal line's own AABB is mostly empty
  // space, so the loose bbox check used for solids would false-positive on it.
  function segmentIntersectsRect(p1, p2, rect) {
    if (p1.x < rect.minX && p2.x < rect.minX) return false;
    if (p1.x > rect.maxX && p2.x > rect.maxX) return false;
    if (p1.y < rect.minY && p2.y < rect.minY) return false;
    if (p1.y > rect.maxY && p2.y > rect.maxY) return false;
    const inside = (p) => p.x >= rect.minX && p.x <= rect.maxX && p.y >= rect.minY && p.y <= rect.maxY;
    if (inside(p1) || inside(p2)) return true;
    const ccw = (p, q, r) => (r.y - p.y) * (q.x - p.x) > (q.y - p.y) * (r.x - p.x);
    const segsCross = (a, b, c, d) => ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d);
    const corners = [
      { x: rect.minX, y: rect.minY }, { x: rect.maxX, y: rect.minY },
      { x: rect.maxX, y: rect.maxY }, { x: rect.minX, y: rect.maxY },
    ];
    for (let i = 0; i < 4; i++) {
      if (segsCross(p1, p2, corners[i], corners[(i + 1) % 4])) return true;
    }
    return false;
  }

  function updateMarquee(x1, y1, x2, y2) {
    const vpRect = viewport.getBoundingClientRect();
    marqueeEl.style.left = (Math.min(x1, x2) - vpRect.left) + 'px';
    marqueeEl.style.top = (Math.min(y1, y2) - vpRect.top) + 'px';
    marqueeEl.style.width = Math.abs(x2 - x1) + 'px';
    marqueeEl.style.height = Math.abs(y2 - y1) + 'px';
    marqueeEl.style.display = 'block';
  }

  function hideMarquee() { marqueeEl.style.display = 'none'; }

  function finalizeBoxSelect(x1, y1, x2, y2) {
    const canvasRect = dom.getBoundingClientRect();
    const dragBox = {
      minX: Math.min(x1, x2) - canvasRect.left, maxX: Math.max(x1, x2) - canvasRect.left,
      minY: Math.min(y1, y2) - canvasRect.top, maxY: Math.max(y1, y2) - canvasRect.top,
    };
    const matches = objects.filter(o => {
      if (o.type === 'line' || o.type === 'guide') {
        const [pa, pb] = lineEndpoints(o);
        const a = projectToScreen(pa, canvasRect), b = projectToScreen(pb, canvasRect);
        return segmentIntersectsRect(a, b, dragBox);
      }
      return rectsIntersect(screenBoundsOf(o, canvasRect), dragBox);
    });
    setSelection(matches);
  }

  // ── Line-drawing inference: snap to existing endpoints / midpoints / on-edge points ──
  const SNAP_PIXEL_RADIUS = 14;
  const SNAP_COLOR_ENDPOINT = 0x2dd4bf; // teal
  const SNAP_COLOR_MIDPOINT = 0xa78bfa; // violet
  const SNAP_COLOR_ONEDGE = 0xf472b6;   // pink
  const SNAP_LABEL = { endpoint: 'Punto final', midpoint: 'Punto medio', onedge: 'Sobre línea' };

  function screenDistToPoint(clientX, clientY, worldPt) {
    const canvasRect = dom.getBoundingClientRect();
    const s = projectToScreen(worldPt, canvasRect);
    return Math.hypot((clientX - canvasRect.left) - s.x, (clientY - canvasRect.top) - s.y);
  }

  // Nearest real shared node to the cursor (screen-space), for the Move tool's node-drag
  // priority — checked against every node regardless of which object(s) reference it.
  function findNearestNode(clientX, clientY) {
    let best = null;
    nodes.forEach((n, id) => {
      if (isDerivedNode(id)) return; // a top-edge node moves only as part of its whole solid
      const d = screenDistToPoint(clientX, clientY, nodePos(id));
      if (d <= SNAP_PIXEL_RADIUS && (!best || d < best.d)) best = { id, d };
    });
    return best ? best.id : null;
  }

  // The two world-space endpoints of a 'line' (via its shared nodes) or 'guide' (via its
  // own stored coords) — the two types that midpoint/on-edge snapping applies to.
  function lineEndpoints(o) {
    if (o.type === 'line') return [nodePos(o.params.nodeIds[0]), nodePos(o.params.nodeIds[1])];
    return [new THREE.Vector3(...o.params.a), new THREE.Vector3(...o.params.b)];
  }

  function closestPointOnSegment(p, a, b) {
    const ab = new THREE.Vector3().subVectors(b, a);
    const lenSq = ab.lengthSq();
    if (lenSq < 1e-9) return a.clone();
    const t = THREE.MathUtils.clamp(new THREE.Vector3().subVectors(p, a).dot(ab) / lenSq, 0, 1);
    return a.clone().addScaledVector(ab, t);
  }

  // Every vertex of an object worth snapping to, as { point, nodeId } — nodeId is the real
  // shared node to reuse when a new line/face is drawn onto it (null for a synthesized
  // vertex, e.g. rect/circle corners, or a solid's top layer, which don't correspond to a
  // single stored node). For a solid this is every corner at its base AND (if extruded) at
  // its top, so a line can connect down to the ground or up to any corner, same as SketchUp.
  function objectVertices(o) {
    if (o.type === 'line') return o.params.nodeIds.map(id => ({ point: nodePos(id), nodeId: id }));
    if (o.type === 'guide') return [{ point: new THREE.Vector3(...o.params.a), nodeId: null }, { point: new THREE.Vector3(...o.params.b), nodeId: null }];
    const baseY = o.params.baseY || 0;
    const ys = o.height > 0 ? [baseY, baseY + o.height] : [baseY];
    if (o.type === 'rect') {
      const { x1, z1, x2, z2 } = o.params;
      const pts = [];
      ys.forEach(y => pts.push(
        new THREE.Vector3(x1, y, z1), new THREE.Vector3(x1, y, z2),
        new THREE.Vector3(x2, y, z1), new THREE.Vector3(x2, y, z2)
      ));
      return pts.map(point => ({ point, nodeId: null }));
    }
    if (o.type === 'circle') return ys.map(y => ({ point: new THREE.Vector3(o.params.cx, y, o.params.cz), nodeId: null }));
    if (o.type === 'polyface') {
      const orientation = o.params.orientation || 'xz';
      const base = o.params.base || 0;
      const pts = [];
      o.params.nodeIds.forEach(id => pts.push({ point: nodePos(id), nodeId: id }));
      if (o.height > 0) {
        if (o.params.topNodeIds) {
          // Real top-edge nodes exist (spawnPolyfaceTopEdges already ran) — reuse them so a
          // new line snapped onto a box's top corner shares the same point, not a duplicate.
          o.params.topNodeIds.forEach(id => pts.push({ point: nodePos(id), nodeId: id }));
        } else {
          o.params.nodeIds.forEach(id => pts.push({ point: polyfaceTo3D(orientation, base + o.height, ...polyfaceTo2D(orientation, nodePos(id))), nodeId: null }));
        }
      }
      return pts;
    }
    return [];
  }

  // Priority: endpoint > midpoint > on-edge (matches SketchUp's inference order).
  function resolveGeometrySnap(rawPoint, clientX, clientY) {
    let best = null;
    objects.forEach(o => {
      objectVertices(o).forEach(({ point, nodeId }) => {
        const d = screenDistToPoint(clientX, clientY, point);
        if (d <= SNAP_PIXEL_RADIUS && (!best || d < best.d)) best = { point, d, kind: 'endpoint', nodeId };
      });
    });
    if (best) return { point: best.point.clone(), kind: best.kind, nodeId: best.nodeId };

    objects.forEach(o => {
      if (o.type !== 'line' && o.type !== 'guide') return;
      const [a, b] = lineEndpoints(o);
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const d = screenDistToPoint(clientX, clientY, mid);
      if (d <= SNAP_PIXEL_RADIUS && (!best || d < best.d)) best = { point: mid, d, kind: 'midpoint', nodeId: null };
    });
    if (best) return { point: best.point.clone(), kind: best.kind, nodeId: best.nodeId };

    objects.forEach(o => {
      if (o.type !== 'line' && o.type !== 'guide') return;
      const [a, b] = lineEndpoints(o);
      const cp = closestPointOnSegment(rawPoint, a, b);
      const d = screenDistToPoint(clientX, clientY, cp);
      if (d <= SNAP_PIXEL_RADIUS && (!best || d < best.d)) best = { point: cp, d, kind: 'onedge', nodeId: null };
    });
    if (best) return { point: best.point.clone(), kind: best.kind, nodeId: best.nodeId };

    return null;
  }

  let snapMarkerMesh = null;
  function showSnapMarker(point, color) {
    hideSnapMarker();
    const geo = new THREE.SphereGeometry(0.09, 12, 12);
    const mat = new THREE.MeshBasicMaterial({ color });
    snapMarkerMesh = new THREE.Mesh(geo, mat);
    snapMarkerMesh.position.copy(point);
    scene.add(snapMarkerMesh);
  }
  function hideSnapMarker() {
    if (snapMarkerMesh) { scene.remove(snapMarkerMesh); disposeMesh(snapMarkerMesh); snapMarkerMesh = null; }
  }

  // draw state
  let drawStage = 0;       // 0 = idle, 1 = first point placed
  let drawStart = null;    // THREE.Vector3
  let drawStartNodeId = null; // shared node id backing drawStart, for the line tool
  let previewMesh = null;
  let extrudeObj = null;
  let extrudeFaceKind = null;   // 'top' | 'radius' | 'x+' | 'x-' | 'z+' | 'z-' | 'wallN' — for the live highlight
  let extrudeHitPoint = null;   // THREE.Vector3 — where the face was originally clicked
  let extrudeWorldNormal = null; // THREE.Vector3 — that face's outward normal, the push axis
  let extrudeField = null;   // 'height' | 'radius' | 'x1' | 'x2' | 'z1' | 'z2' — which param this drag edits
  let extrudeSign = 1;
  let extrudeBaseValue = 0;
  let extrudeWallIndex = null;  // set instead of extrudeField when pushing one wall of a polyface
  let extrudeBasePoints = null; // snapshot of polyface 2D points at drag start, for offsetPolygonEdge's math
  let extrudeNodeSnapshot = null; // [{id, pos}] snapshot of the face's nodes at drag start, for Escape-revert
  let extrudeSnapshotHeight = 0;   // full pre-grab snapshot, restored if the grab is cancelled (Escape)
  let extrudeSnapshotParams = null;
  let chainOrigin = null;  // first vertex of the active line chain (for auto-close detection)
  let chainPoints = [];    // vertices placed so far in the active chain, in order
  let chainNodeIds = [];   // node ids placed so far in the active chain, parallel to chainPoints
  let chainLineObjs = [];  // the 'line' objects created for the active chain's segments
  let moveObj = null;
  let moveAnchor = null;      // THREE.Vector3 — world point clicked at drag start
  let moveBaseParams = null;  // deep clone of obj.params at drag start, translated fresh each move
  let moveNodeId = null;         // set instead of moveObj when dragging a single shared node
  let moveNodeOriginalPos = null; // that node's position at grab start, for Escape-revert
  let moveNodeBase = null;       // [{id, pos}] snapshot when dragging a whole line/polyface's nodes together

  // Rewrites obj.params (from a snapshot) shifted by (dx,dy,dz) — used by the Move tool for
  // the independent/parametric types. 'line' and 'polyface' move via their shared nodes
  // instead (see the Move tool's node-drag / whole-edge-drag branches), not through here.
  function translatedParams(type, baseParams, dx, dy, dz) {
    const p = JSON.parse(JSON.stringify(baseParams));
    if (type === 'guide') {
      p.a = [p.a[0] + dx, p.a[1] + dy, p.a[2] + dz];
      p.b = [p.b[0] + dx, p.b[1] + dy, p.b[2] + dz];
    } else if (type === 'rect') {
      p.x1 += dx; p.x2 += dx; p.z1 += dz; p.z2 += dz;
      p.baseY = (p.baseY || 0) + dy;
    } else if (type === 'circle') {
      p.cx += dx; p.cz += dz;
      p.baseY = (p.baseY || 0) + dy;
    }
    return p;
  }

  // ── SketchUp-style "type a length" (VCB): after clicking a point, typing a number and
  // pressing Enter places the line's next point exactly that far along whatever direction
  // (snap or axis-lock) is currently showing, instead of wherever the mouse happens to be.
  let typedValue = '';
  let lastLineEndPoint = null;
  let lastLineEndNodeId = null; // shared node id backing lastLineEndPoint, if it's an exact snap
  let guideChainStart = null; // anchor for the Guide tool's current segment (continues like Line)
  let lastGuideEndPoint = null;

  // Guide tool, offset mode: click an existing line/guide, move the mouse (or type a
  // value + Enter) to lay a new guide parallel to it at that perpendicular distance —
  // same idea as SketchUp's Tape Measure offset.
  let offsetSourceObj = null;
  let offsetBaseA = null, offsetBaseB = null; // snapshot of the source line's endpoints
  let lastOffsetVec = null;

  // The perpendicular vector from the source line to wherever the cursor currently points:
  // finds the mutual closest points between the (infinite) line and the cursor's 3D ray —
  // the segment connecting them is, by construction, perpendicular to the line.
  function computeOffsetVec(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const rayOrigin = raycaster.ray.origin, rayDir = raycaster.ray.direction.clone().normalize();
    const lineDir = offsetBaseB.clone().sub(offsetBaseA).normalize();
    const closestOnLine = closestPointOnLineToRay(offsetBaseA, lineDir, rayOrigin, rayDir);
    const t = closestOnLine.clone().sub(rayOrigin).dot(rayDir);
    const closestOnRay = rayOrigin.clone().addScaledVector(rayDir, t);
    return closestOnRay.clone().sub(closestOnLine);
  }

  function refreshOffsetPreview() {
    if (currentTool !== 'guide' || !offsetSourceObj) return;
    clearPreview();
    let offsetVec = computeOffsetVec(lastMouseX, lastMouseY);
    if (offsetVec.lengthSq() < 1e-9) offsetVec = new THREE.Vector3(0.001, 0, 0);
    if (typedValue) {
      const len = parseFloat(typedValue);
      if (!isNaN(len)) offsetVec = offsetVec.clone().normalize().multiplyScalar(len);
    }
    lastOffsetVec = offsetVec.clone();
    const newA = offsetBaseA.clone().add(offsetVec), newB = offsetBaseB.clone().add(offsetVec);
    previewMesh = buildGuideMesh(newA, newB);
    previewMesh.traverse(n => { if (n.material && n.material.color) n.material.color.setHex(AXIS_COLOR_NONE); });
    scene.add(previewMesh);
    let txt = 'offset: ' + offsetVec.length().toFixed(2);
    if (typedValue) txt += '  → ' + typedValue + ' [Enter]';
    statusCoordsEl.textContent = txt;
  }

  function commitOffset() {
    if (offsetSourceObj && lastOffsetVec) {
      pushUndo();
      const newA = offsetBaseA.clone().add(lastOffsetVec), newB = offsetBaseB.clone().add(lastOffsetVec);
      addObject('guide', { a: [newA.x, newA.y, newA.z], b: [newB.x, newB.y, newB.z] });
    }
    cancelDraw();
  }

  // Shared by the Line and Guide tools: resolves where the "next point" should land —
  // geometry snap first, then axis lock, then a free point on the plane through `anchor`
  // — and overrides it with the typed VCB length along that same direction if one is set.
  function resolveDirectedEndpoint(anchor, clientX, clientY) {
    const raw = groundPoint(clientX, clientY) || anchor.clone();
    const geomSnap = resolveGeometrySnap(raw, clientX, clientY);
    let endPoint, color, label, nodeId = null;
    if (geomSnap) {
      endPoint = geomSnap.point;
      color = geomSnap.kind === 'endpoint' ? SNAP_COLOR_ENDPOINT : geomSnap.kind === 'midpoint' ? SNAP_COLOR_MIDPOINT : SNAP_COLOR_ONEDGE;
      label = SNAP_LABEL[geomSnap.kind];
      nodeId = geomSnap.nodeId;
    } else {
      const axisSnap = resolveAxisSnap(anchor, clientX, clientY);
      if (axisSnap) {
        endPoint = axisSnap.point; color = axisSnap.color; label = axisSnap.label;
      } else {
        endPoint = planePoint(clientX, clientY, anchor.y) || anchor.clone();
        color = AXIS_COLOR_NONE; label = null;
      }
    }
    const direction = endPoint.clone().sub(anchor);
    if (direction.lengthSq() > 1e-9) direction.normalize(); else direction.set(1, 0, 0);
    if (typedValue) {
      const len = parseFloat(typedValue);
      // A typed exact length no longer lands exactly on whatever was snapped (the direction
      // is kept, but the distance is overridden), so it's not the same point as that node.
      if (!isNaN(len)) { endPoint = anchor.clone().addScaledVector(direction, len); nodeId = null; }
    }
    return { point: endPoint, color, label, snapped: !!geomSnap, nodeId };
  }

  function resolveLineEndpoint(clientX, clientY) { return resolveDirectedEndpoint(drawStart, clientX, clientY); }

  // Face splitting: drawing a line between two points that already sit on the same face's
  // perimeter cuts that face into two along the new line, instead of just adding a stray
  // edge on top of it. Scoped deliberately narrow (confirmed with the user): only this
  // exact "line between two existing border nodes" case, not general interior-line clipping.
  function areAdjacentInLoop(loop, a, b) {
    const n = loop.length;
    for (let i = 0; i < n; i++) {
      const cur = loop[i], next = loop[(i + 1) % n];
      if ((cur === a && next === b) || (cur === b && next === a)) return true;
    }
    return false;
  }
  function findSplittableFace(nA, nB) {
    return objects.find(o => o.type === 'polyface' &&
      o.params.nodeIds.includes(nA) && o.params.nodeIds.includes(nB) &&
      !areAdjacentInLoop(o.params.nodeIds, nA, nB));
  }
  function splitFace(face, nA, nB) {
    const loop = face.params.nodeIds;
    const i = loop.indexOf(nA), j = loop.indexOf(nB);
    const [lo, hi] = i < j ? [i, j] : [j, i];
    const loopA = loop.slice(lo, hi + 1);
    const loopB = loop.slice(hi).concat(loop.slice(0, lo + 1));
    addObject('polyface', { nodeIds: loopA, orientation: face.params.orientation, base: face.params.base }, face.height);
    addObject('polyface', { nodeIds: loopB, orientation: face.params.orientation, base: face.params.base }, face.height);
    removeObject(face);
  }
  function checkFaceSplit(nA, nB) {
    if (nA == null || nB == null || nA === nB) return;
    const face = findSplittableFace(nA, nB);
    if (face) splitFace(face, nA, nB);
  }

  function commitLineSegment(finalPt, finalNodeId) {
    pushUndo();
    const endNodeId = (finalNodeId != null) ? finalNodeId : createNode(finalPt).id;
    const segment = addObject('line', { nodeIds: [drawStartNodeId, endNodeId] });
    chainLineObjs.push(segment);
    checkFaceSplit(drawStartNodeId, endNodeId);
    const closesLoop = chainOrigin && finalPt.distanceTo(chainOrigin) < 1e-6 && chainPoints.length >= 3;
    if (closesLoop) {
      const planar = detectPolygonOrientation(chainPoints);
      if (planar) {
        // The perimeter lines just committed (chainLineObjs) already reference these same
        // nodes, so they stay glued to the face automatically — no manual sync needed.
        addObject('polyface', { nodeIds: chainNodeIds.slice(), orientation: planar.orientation, base: planar.base }, 0);
      }
      // If it's not flat in a red/green or blue-axis plane, leave the drawn lines as-is
      // rather than collapsing them into a broken face.
      cancelDraw();
    } else {
      chainPoints.push(finalPt.clone());
      chainNodeIds.push(endNodeId);
      drawStart = finalPt.clone(); // chain to next segment
      drawStartNodeId = endNodeId;
      clearPreview();
      hideSnapMarker();
      typedValue = '';
    }
  }

  let lastMouseX = 0, lastMouseY = 0;

  // Re-renders the line preview at the last known mouse position — used so the preview
  // (and the exact length) updates live as the user types, without needing to move the mouse.
  function refreshLinePreview() {
    if (currentTool !== 'line' || drawStage !== 1) return;
    clearPreview();
    const resolved = resolveLineEndpoint(lastMouseX, lastMouseY);
    if (resolved.snapped && !typedValue) showSnapMarker(resolved.point, resolved.color); else hideSnapMarker();
    previewMesh = buildLineMesh(drawStart, resolved.point);
    previewMesh.traverse(n => { if (n.material && n.material.color) n.material.color.setHex(resolved.color); });
    scene.add(previewMesh);
    let txt = 'x: ' + resolved.point.x.toFixed(2) + '  z: ' + resolved.point.z.toFixed(2);
    if (resolved.label && !typedValue) txt += '  · ' + resolved.label;
    if (typedValue) txt += '  → ' + typedValue + ' [Enter]';
    statusCoordsEl.textContent = txt;
    lastLineEndPoint = resolved.point.clone();
    lastLineEndNodeId = resolved.nodeId;
  }

  // Guide ("cinta métrica"): same click-move-click-to-place-next-point flow as Line, but
  // no auto-close-to-face — it's purely a reference/measuring aid.
  function commitGuideSegment(finalPt) {
    pushUndo();
    addObject('guide', { a: [guideChainStart.x, guideChainStart.y, guideChainStart.z], b: [finalPt.x, finalPt.y, finalPt.z] });
    guideChainStart = finalPt.clone(); // continue chaining, like Line
    clearPreview();
    hideSnapMarker();
    typedValue = '';
  }

  function refreshGuidePreview() {
    if (currentTool !== 'guide' || !guideChainStart) return;
    clearPreview();
    const resolved = resolveDirectedEndpoint(guideChainStart, lastMouseX, lastMouseY);
    if (resolved.snapped && !typedValue) showSnapMarker(resolved.point, resolved.color); else hideSnapMarker();
    previewMesh = buildGuideMesh(guideChainStart, resolved.point);
    previewMesh.traverse(n => { if (n.material && n.material.color) n.material.color.setHex(resolved.color); });
    scene.add(previewMesh);
    const len = guideChainStart.distanceTo(resolved.point);
    let txt = 'longitud: ' + len.toFixed(2);
    if (resolved.label && !typedValue) txt += '  · ' + resolved.label;
    if (typedValue) txt += '  → ' + typedValue + ' [Enter]';
    statusCoordsEl.textContent = txt;
    lastGuideEndPoint = resolved.point.clone();
  }

  function clearPreview() {
    if (previewMesh) { scene.remove(previewMesh); disposeMesh(previewMesh); previewMesh = null; }
  }

  function cancelDraw() {
    drawStage = 0; drawStart = null;
    clearPreview();
    if (extrudeObj && extrudeSnapshotParams) {
      // The object was left reflecting wherever the cursor last was — revert it, since
      // Escape (or switching tools) mid-grab should abandon the push, not keep it half-done.
      extrudeObj.height = extrudeSnapshotHeight;
      extrudeObj.params = extrudeSnapshotParams;
      if (extrudeNodeSnapshot) {
        extrudeNodeSnapshot.forEach(({ id, pos }) => setNodePos(id, pos));
        extrudeNodeSnapshot.forEach(({ id }) => nodeMoved(id));
      }
      rebuildMesh(extrudeObj);
    }
    extrudeObj = null;
    extrudeSnapshotParams = null;
    controls.enabled = true;
    selectDragStart = null;
    boxSelectActive = false;
    hideMarquee();
    hideSnapMarker();
    drawStartNodeId = null;
    chainOrigin = null;
    chainPoints = [];
    chainNodeIds = [];
    chainLineObjs = [];
    hideFaceHighlight();
    // Reverting a Move-in-progress: a node/edge drag has already mutated shared node
    // positions directly (unlike the rect/circle/guide params path, which only ever writes
    // into moveObj.params), so Escape/tool-switch needs to explicitly put them back.
    if (moveNodeId !== null && moveNodeOriginalPos) {
      setNodePos(moveNodeId, moveNodeOriginalPos);
      nodeMoved(moveNodeId);
    }
    if (moveNodeBase) {
      moveNodeBase.forEach(({ id, pos }) => setNodePos(id, pos));
      moveNodeBase.forEach(({ id }) => nodeMoved(id));
    }
    moveObj = null;
    moveAnchor = null;
    moveBaseParams = null;
    moveNodeId = null;
    moveNodeOriginalPos = null;
    moveNodeBase = null;
    typedValue = '';
    lastLineEndPoint = null;
    lastLineEndNodeId = null;
    guideChainStart = null;
    lastGuideEndPoint = null;
    offsetSourceObj = null;
    offsetBaseA = null;
    offsetBaseB = null;
    lastOffsetVec = null;
    extrudeWallIndex = null;
    extrudeBasePoints = null;
    extrudeNodeSnapshot = null;
    extrudeFaceKind = null;
    extrudeHitPoint = null;
    extrudeWorldNormal = null;
    pendingUndoSnapshot = null; // whatever grab this belonged to was abandoned, not committed
    pruneOrphanNodes();
  }

  const dom = renderer.domElement;

  dom.addEventListener('contextmenu', e => e.preventDefault());

  dom.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;

    if (currentTool === 'select') {
      selectDragStart = { x: e.clientX, y: e.clientY };
      boxSelectActive = false;
      return;
    }

    if (currentTool === 'erase') {
      const obj = pickObject(e.clientX, e.clientY);
      if (obj) { pushUndo(); removeObject(obj); }
      return;
    }

    if (currentTool === 'line') {
      if (drawStage === 0) {
        const raw = groundPoint(e.clientX, e.clientY);
        if (!raw) return;
        const geomSnap = resolveGeometrySnap(raw, e.clientX, e.clientY);
        const startPt = geomSnap ? geomSnap.point : raw;
        const startNodeId = (geomSnap && geomSnap.nodeId != null) ? geomSnap.nodeId : createNode(startPt).id;
        drawStart = startPt.clone();
        drawStartNodeId = startNodeId;
        drawStage = 1;
        chainOrigin = startPt.clone();
        chainPoints = [startPt.clone()];
        chainNodeIds = [startNodeId];
        chainLineObjs = [];
        typedValue = '';
      } else {
        const resolved = lastLineEndPoint ? { point: lastLineEndPoint.clone(), nodeId: lastLineEndNodeId } : resolveLineEndpoint(e.clientX, e.clientY);
        commitLineSegment(resolved.point, resolved.nodeId);
      }
      return;
    }

    if (currentTool === 'guide') {
      if (offsetSourceObj) {
        // Second click: confirm the offset guide at whatever distance is currently showing.
        commitOffset();
        return;
      }
      if (!guideChainStart) {
        // Clicking an existing line/guide starts an offset instead of a fresh 2-point guide.
